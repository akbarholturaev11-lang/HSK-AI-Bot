function marketing(){let x=subs.marketing;return head('Growth','Marketing','Kampaniyalarni yaratish, joylashtirish va natijalarini kuzatish.',x==='campaigns'?B(I('plus',15)+' Yangi kampaniya','data-wizard','primary'):'')+subTabs('marketing')+demo()+(x==='campaigns'?`${panel('Kampaniya turlari','Har bir kanal va format uchun yagona ish oqimi',`<div class="grid cols-2">${quickCard('Ommaviy xabar','Segment → Matn → Test → Yuborish','mail','marketing:campaigns')}${quickCard('Bot reklama xabari','Telegram chat segmentlari','megaphone','marketing:campaigns')}${quickCard('Chegirma','Tarif va muddat bo‘yicha','wallet','marketing:campaigns')}${quickCard('Release feedback','Yangi versiya bo‘yicha fikr','users','marketing:campaigns')}</div><div class="space"></div>${B(I('plus',15)+' Yangi kampaniya yaratish','data-wizard','primary')}`)}`:x==='creatives'?`${panel('Reklama inventari','Kurs reklamalari va ilova promo joylari',`<div class="clean-list">${[['Kurs reklama roliklari','Video / surat, til, muddat, CTA'],['Kurs ichidagi joylashuvlar','Har bir joy uchun visibility'],['Android ilovasi promosi','Qurilmaga mos ko‘rsatish'],['Reklama samaradorligi','Ko‘rish va bosishlar']].map(([t,d])=>`<div class="clean-row"><div><b>${t}</b><p>${d}</p></div>${B('Ochish','data-toast="'+t+' — UI prototipi"','small')}</div>`).join('')}</div>`)}`:x==='notifications'?`${panel('Motivatsion eslatmalar','UZ / RU / TJ matnlar va faollik',`<div class="setting"><div class="setting-main"><b>Kundalik o‘qish eslatmasi</b><p>Demo: faqat preview sozlamasi</p></div><input aria-label="Demo eslatma" class="switch" type="checkbox" data-notif ${notifOn?'checked':''}></div><div class="formstack"><div class="field"><label>Tojikcha xabar</label><textarea class="textarea">Имрӯз ҳам дарси хитоиро идома диҳед 📚</textarea></div><div class="field"><label>Ruscha matn</label><textarea class="textarea">Продолжайте изучать китайский язык сегодня 📚</textarea></div><div class="field"><label>O‘zbekcha matn</label><textarea class="textarea">Bugun ham xitoy tili darsini davom ettiring 📚</textarea></div>${B('Preview ko‘rish','data-toast="Eslatma preview — demo"','primary')}</div>`)}`:`${panel('Hamkorlar','Hamkorlik arizalari va to‘lovlar',`<div class="grid cols-3">${metric('Arizalar','4','Demo','mail')}${metric('Faol hamkorlar','2','Demo','users')}${metric('To‘lovlar','1','Demo','wallet')}</div><div class="space"></div><div class="callout">${I('info')} Hamkor to‘lovlarini umumiy foydalanuvchi Pro to‘lovlari bilan aralashtirmaslik kerak.</div>`)}`)}
function system(){let x=subs.system;return head('Operations & Safety','Tizim','Platforma ishlashi, xavfsizlik va texnik sozlamalar.')+subTabs('system')+demo()+(x==='models'?`${panel('AI modeli','Provider va fallback tartibi',`<div class="formstack"><div class="field"><label>Asosiy Gemini modeli</label><select class="select" id="aimodel"><option${aiModel==='Gemini 2.5 Flash'?' selected':''}>Gemini 2.5 Flash</option><option${aiModel==='Gemini 2.5 Pro'?' selected':''}>Gemini 2.5 Pro</option></select></div><div class="setting"><div><b>Zaxira provider</b><p>OpenAI fallback · backend sozlamasi</p></div>${badge('active')}</div><div class="callout">${I('info')} Model almashtirishda tarif, token va fallback xarajatlarini tekshirish kerak.</div>${B('Saqlashni ko‘rish','data-confirm="model"','primary')}</div>`)}`:x==='channels'?`${panel('Majburiy kanal obunasi','Kanal ro‘yxati va holati',`<div class="setting"><div><b>Majburiy obuna</b><p>Foydalanuvchi kirishida kanalni tekshirish</p></div>${badge('active')}</div><div class="field"><label>Telegram kanal URL</label><input class="input" value="https://t.me/example_channel"/></div><div class="space"></div>${B('Kanal qo‘shish','data-toast="Demo: kanal qo‘shilmadi"')}`)}`:x==='help'?`${panel('Yordam sozlamalari','Admin aloqasi va ko‘rsatmalar',`<div class="formstack"><div class="field"><label>Admin username</label><input class="input" value="@demo_admin"/></div><div class="field"><label>Video qo‘llanma</label><input class="input" value="https://example.com/help"/></div>${B('Preview saqlash','data-toast="Demo: ma’lumot saqlanmadi"','primary')}</div>`)}`:`${panel('Amallar jurnali','Taklif etilayotgan yangi xavfsizlik funksiyasi',`<div class="callout">${I('shield')} Hozirgi kodda ushbu to‘liq UI jurnali mavjudligi tasdiqlanmagan. Bu Admin V2 uchun yangi talab, prototip ma’lumotlari namunaviy.</div><div class="space"></div><div class="clean-list">${[['10:42','Demo Admin · Tarif preview'],['09:18','Demo Admin · HSK 3.0 rejimi'],['Kecha','Demo Admin · Eslatma preview']].map(([a,b])=>`<div class="clean-row"><b>${b}</b><span class="note">${a}</span></div>`).join('')}</div>`)}`)}
function renderContent(){return {home,analytics,users:usersView,finance,product,marketing,system}[route]();}
function shell(){return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">学</div><div><div class="brand-name">HSK AI</div><div class="brand-meta">CONTROL CENTER</div></div></div><div class="section-caption">WORKSPACE</div><nav aria-label="Asosiy navigatsiya">${nav.map(([key,ico,label])=>`<button class="navbtn ${route===key?'active':''}" data-route="${key}" aria-current="${route===key?'page':'false'}"><span class="ni">${I(ico,19)}</span><span>${label}</span>${I('chevron',14)}</button>`).join('')}</nav><div class="side-spacer"></div><div class="side-bottom"><div class="server"><i class="dot"></i>Prototip interfeysi faol</div><div class="profile"><div class="avatar">AD</div><div><b>Demo Administrator</b><small>Faqat UI preview</small></div></div></div></aside><div class="workspace"><header class="topbar"><div class="breadcrumb"><span>HSK AI</span><span>/</span><b>${paths[route][0]}</b></div><div class="mobile-brand">HSK AI <span style="color:#f08879;margin-left:5px">Admin</span></div><div class="top-actions"><span class="demo-chip">● DEMO · REAL EMAS</span><button class="search-btn" data-search-open aria-label="Navigatsiyada qidirish">${I('search',16)}<span>Bo‘lim yoki amal qidirish</span><small class="key">/</small></button><button class="circle-btn refresh-btn" data-toast="Demo sahifa yangilandi" aria-label="Yangilash">${I('refresh')}</button></div></header><main class="content" id="main-content">${renderContent()}</main></div></div><nav class="mobile-nav" aria-label="Mobil navigatsiya">${[['home','house','Bosh'],['analytics','chart','Tahlil'],['users','users','Odamlar'],['finance','wallet','To‘lov'],['menu','menu','Menyu']].map(([key,ico,label])=>`<button class="${(route===key||key==='menu'&&['product','marketing','system'].includes(route))?'active':''}" data-mobile="${key}">${I(ico,20)}<span>${label}</span></button>`).join('')}</nav>`}
function userDrawer(){const u=users.find(x=>x.id===selectedUser)||users[0];return `<div class="drawer-head"><div><div class="eyebrow">Foydalanuvchi profili</div><h2>${E(u.name)}</h2><p>@${E(u.username)} · ID ${u.id}</p></div><button class="circle-btn" aria-label="Yopish" data-close>${I('close')}</button></div><div class="drawer-body"><div class="spaced"><div class="usercell"><div class="useravatar" style="width:43px;height:43px">U${u.id%10}</div><div><b>${E(u.name)}</b><small>Demo foydalanuvchi</small></div></div>${badge(u.plan)}</div><div class="space"></div>${panel('Hisob tafsilotlari','Ilovalardagi umumiy holat',`<div class="clean-list">${[['Kurs',u.level],['Obuna',u.plan],['Platforma',u.platform],['Faollik',u.activity]].map(([a,b])=>`<div class="clean-row"><span class="note">${a}</span><b>${b}</b></div>`).join('')}</div>`)}<div class="space"></div>${panel('Amallar','Bir foydalanuvchi kontekstida',`<div class="formstack">${B('Pro obuna berish','data-confirm="access"','')}${B('Shaxsiy xabar tayyorlash','data-toast="Shaxsiy xabar demo rejimida yuborilmaydi"')}${B('Hisobni to‘liq o‘chirish','data-confirm="delete"','danger')}</div>`)}<div class="space"></div><div class="callout">${I('shield')} Xavfli amallar ID va ta’sir ko‘lami bilan tasdiqlanishi kerak. Demo hech qanday serverga so‘rov yubormaydi.</div></div><div class="drawer-footer">${B('Yopish','data-close')}</div>`}
function paymentDrawer(){const p=payments.find(x=>x.id===selectedPayment)||payments[0];return `<div class="drawer-head"><div><div class="eyebrow">To‘lovni tekshirish</div><h2>To‘lov #${p.id}</h2><p>${p.user} · ${p.time}</p></div><button class="circle-btn" aria-label="Yopish" data-close>${I('close')}</button></div><div class="drawer-body">${panel('To‘lov ma’lumotlari','Demo kvitansiya',`<div class="clean-list">${[['Mahsulot',p.type],['To‘lov usuli',p.method],['Summa',p.amount],['Holat',badge(p.status)]].map(([a,b])=>`<div class="clean-row"><span class="note">${a}</span><b>${b}</b></div>`).join('')}</div>`)}<div class="space"></div><div class="callout">${I('alert')} Haqiqiy to‘lov tasdig‘idan oldin bankdagi tushumni alohida tekshirish shart. Kvitansiya rasmi o‘zi yetarli dalil emas.</div></div><div class="drawer-footer">${B('Yopish','data-close')}${p.status==='pending'?B('Rad etish','data-confirm="reject"','danger')+B('Tasdiqlash','data-confirm="approve"','primary'):''}</div>`}
function menuDrawer(){return `<div class="drawer-head"><div><div class="eyebrow">Barcha bo‘limlar</div><h2>Menyu</h2><p>Kamroq ishlatiladigan boshqaruv markazlari</p></div><button class="circle-btn" data-close aria-label="Yopish">${I('close')}</button></div><div class="drawer-body"><div class="option-list">${nav.map(([key,ico,label])=>`<button class="option-tile" data-route="${key}"><div class="activity-icon">${I(ico)}</div><span><b>${label}</b><small>${paths[key][1]}</small></span><span class="right">${I('chevron')}</span></button>`).join('')}</div></div>`}
function wizardDrawer(){let st=wizardStep;const steps=['Auditoriya','Xabar','Preview','Tasdiqlash'];let body=st===1?`<div class="formstack"><div class="field"><label>Kampaniya turi</label><select class="select" id="campaignType"><option>Ommaviy xabar</option><option>Bot reklama xabari</option><option>Chegirma</option></select></div><div class="field"><label>Auditoriya</label><select class="select"><option>Faol foydalanuvchilar (demo)</option><option>Barcha foydalanuvchilar (demo)</option><option>Bepul foydalanuvchilar (demo)</option></select></div><div class="field"><label>Til</label><div class="pill-list"><span class="pill active">Тоҷикӣ</span><span class="pill active">O‘zbekcha</span><span class="pill active">Русский</span></div></div><div class="callout">${I('info')} Segment hajmi haqiqiy server javobidan olinishi kerak; demo hisob haqiqiy auditoriyani ko‘rsatmaydi.</div></div>`:st===2?`<div class="formstack"><div class="field"><label>Xabar matni (tojikcha)</label><textarea class="textarea" id="campaignText">Салом! Имрӯз дар HSK AI дарси навро оғоз кунед 📚</textarea></div><div class="setting"><div><b>UZ/RU tarjima</b><p>Yuborishdan oldin har birini tekshirish</p></div><input type="checkbox" class="switch" checked aria-label="AI tarjima demo"></div><div class="field"><label>CTA turi</label><select class="select"><option>Kursni ochish</option><option>Havola</option><option>CTA yo‘q</option></select></div></div>`:st===3?`<div class="formstack"><div class="field"><label>Tojikcha preview</label><div class="preview-bubble">Салом! Имрӯз дар HSK AI дарси навро оғоз кунед 📚</div></div><div class="field"><label>O‘zbekcha preview</label><div class="preview-bubble">Salom! Bugun HSK AI’da yangi darsni boshlang 📚</div></div><div class="field"><label>Ruscha preview</label><div class="preview-bubble">Привет! Начните сегодня новый урок в HSK AI 📚</div></div></div>`:`<div class="formstack"><div class="callout">${I('alert')} Real mahsulotda bu qadam auditoriya, matn, tarjima, CTA va haqiqiy test-xabarni tekshirishi kerak.</div><div class="clean-row"><b>Auditoriya</b><span class="note">Demo segment</span></div><div class="clean-row"><b>Til</b><span class="note">TJ / UZ / RU</span></div><div class="clean-row"><b>Jo‘natish</b><span class="note">Prototipda bloklangan</span></div></div>`;return `<div class="drawer-head"><div><div class="eyebrow">Yangi kampaniya / Demo</div><h2>Ommaviy xabar</h2><p>Bir jarayon, to‘rtta aniq qadam</p></div><button class="circle-btn" aria-label="Yopish" data-close>${I('close')}</button></div><div class="drawer-body"><div class="step-row">${steps.map((n,i)=>`${i?'<div class="step-divider"></div>':''}<div class="step ${i+1===st?'active':''}"><em>${i+1}</em><span>${n}</span></div>`).join('')}</div>${body}</div><div class="drawer-footer">${st>1?B('Orqaga','data-wizard-back'):B('Bekor qilish','data-close')}${st<4?B('Davom etish '+I('arrow',14),'data-wizard-next','primary'):B('Faqat demo · tugatish','data-toast="Demo yakunlandi. Xabar yuborilmadi" data-close','primary')}</div>`}
function confirmModal(kind){const map={price:['Narx o‘zgarishini tasdiqlash','Tarif yoki narx o‘zgarishi barcha yangi xaridlarga ta’sir qilishi mumkin.','O‘zgarishni demo ko‘rsatish'],model:['AI modelini almashtirish','Provider almashsa narx, token va fallback xarajatlari o‘zgarishi mumkin.','Demo tasdiqlash'],free:['Hamma uchun bepul rejim','Bu haqiqiy tizimda barcha darslarga kirish huquqini o‘zgartirishi mumkin.','Demo rejimni tanlash'],access:['Pro obuna berish','Noto‘g‘ri foydalanuvchiga kirish huquqini berish xavfi bor.','Demo obuna berish'],delete:['Foydalanuvchini o‘chirish','Hisob va unga tegishli ma’lumotlar qaytarilmas tarzda o‘chishi mumkin.','Demo o‘chirish'],approve:['To‘lovni tasdiqlash','Bankda haqiqiy tushum borligi tekshirilmasdan tasdiqlamang.','Demo tasdiqlash'],reject:['To‘lovni rad etish','Kvitansiya va to‘lov rekvizitlarini solishtiring.','Demo rad etish']};const [title,descr,button]=map[kind]||map.price;return `<div class="modal"><div class="spaced" style="margin-bottom:13px"><div class="eyebrow" style="margin:0">Xavfsiz amal / Demo</div><button class="circle-btn" data-close aria-label="Yopish">${I('close')}</button></div><h2>${title}</h2><p>${descr}</p><div class="alert">${I('shield',16)} Bu prototip. Bosish faqat demo holatini ko‘rsatadi; serverga yozilmaydi.</div><div class="modal-actions">${B('Bekor qilish','data-close')}${B(button,`data-confirm-done="${kind}"`,'primary')}</div></div>`}
const searchItems=nav.flatMap(([key,ico,name])=>[{key,sub:'',title:name,group:'Asosiy bo‘lim'}].concat((subnav[key]||[]).map(([s,v])=>({key,sub:s,title:v,group:name}))));
function searchModal(){let q=searchQuery.trim().toLocaleLowerCase(),hits=searchItems.filter(x=>!q||(x.title+' '+x.group).toLocaleLowerCase().includes(q)).slice(0,14);return `<div class="modal search-modal"><div class="spaced" style="padding-right:12px;border-bottom:1px solid var(--line)"><input id="searchField" placeholder="Bo‘lim yoki amal qidirish..." autocomplete="off" value="${E(searchQuery)}" aria-label="Bo‘lim qidirish"/><button class="circle-btn" data-close aria-label="Qidiruvni yopish">${I('close')}</button></div><div class="search-results">${hits.length?hits.map(x=>`<button class="search-result" data-nav-sub="${x.key}:${x.sub}">${I('search',16)}<span>${E(x.title)}</span><small>${E(x.group)}</small>${I('chevron',14)}</button>`).join(''):'<div class="empty-panel">Mos bo‘lim topilmadi</div>'}</div></div>`}
function render(keepScroll=false){let before=window.scrollY;document.getElementById('app').innerHTML=shell();document.getElementById('portal').innerHTML=(drawer?`<div class="overlay drawer-overlay" data-overlay="drawer" role="presentation"><div class="drawer" role="dialog" aria-modal="true" aria-label="${drawer==='user'?'Foydalanuvchi':drawer==='payment'?'To‘lov':drawer==='wizard'?'Kampaniya':'Menyu'}">${({user:userDrawer,payment:paymentDrawer,wizard:wizardDrawer,menu:menuDrawer})[drawer]()}</div></div>`:'')+(modal?`<div class="overlay modaloverlay" data-overlay="modal"><div role="dialog" aria-modal="true" aria-label="Tasdiqlash">${confirmModal(modal)}</div></div>`:'')+(searchOpen?`<div class="overlay modaloverlay" data-overlay="search"><div role="dialog" aria-modal="true" aria-label="Qidirish">${searchModal()}</div></div>`:'');document.body.style.overflow=drawer||modal||searchOpen?'hidden':'';if(!keepScroll)window.scrollTo(0,0);else window.scrollTo(0,before);if(searchOpen){let e=document.getElementById('searchField');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}}
function navigate(k,s){if(!paths[k])return;route=k;if(s&&subnav[k]?.some(x=>x[0]===s))subs[k]=s;drawer=null;modal=null;searchOpen=false;render()}
function notify(t){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=t;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3300)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.matches('[data-overlay]')){drawer=null;modal=null;searchOpen=false;render(true)}return;}if(b.dataset.route){navigate(b.dataset.route);return}if(b.dataset.navSub){const [r,s]=b.dataset.navSub.split(':');navigate(r,s);return}if(b.dataset.mobile){if(b.dataset.mobile==='menu'){drawer='menu';render(true)}else navigate(b.dataset.mobile);return}if(b.dataset.sub){subs[route]=b.dataset.sub;render(true);return}if(b.dataset.period){period=b.dataset.period;render(true);return}if(b.dataset.userFilter){uFilter=b.dataset.userFilter;render(true);return}if(b.dataset.user){selectedUser=+b.dataset.user;drawer='user';render(true);return}if(b.dataset.payment){selectedPayment=+b.dataset.payment;drawer='payment';render(true);return}if(b.hasAttribute('data-search-open')){searchOpen=true;searchQuery='';render(true);return}if(b.dataset.confirm){modal=b.dataset.confirm;render(true);return}if(b.dataset.confirmDone){let a=b.dataset.confirmDone;modal=null;if(['approve','reject'].includes(a)){let p=payments.find(x=>x.id===selectedPayment);if(p)p.status=a==='approve'?'approved':'rejected';drawer=null;}render(true);notify('Demo amal bajarildi — serverda hech narsa o‘zgarmadi');return}if(b.hasAttribute('data-wizard')){drawer='wizard';wizardStep=1;render(true);return}if(b.hasAttribute('data-wizard-next')){wizardStep=Math.min(4,wizardStep+1);render(true);return}if(b.hasAttribute('data-wizard-back')){wizardStep=Math.max(1,wizardStep-1);render(true);return}if(b.hasAttribute('data-close')){drawer=null;modal=null;searchOpen=false;render(true);if(b.dataset.toast)notify(b.dataset.toast);return}if(b.dataset.toast){notify(b.dataset.toast);return}});
document.addEventListener('change',e=>{let t=e.target;if(t.hasAttribute('data-track3')){track3=t.checked;notify('HSK 3.0 holati faqat prototipda o‘zgardi');}if(t.hasAttribute('data-trial')){trial=t.checked;notify('Trial holati faqat prototipda o‘zgardi');}if(t.hasAttribute('data-notif')){notifOn=t.checked;notify('Eslatma holati faqat prototipda o‘zgardi');}if(t.id==='aimodel'){aiModel=t.value}});
document.addEventListener('input',e=>{if(e.target.id==='searchField'){searchQuery=e.target.value;const results=document.querySelector('.search-results');if(results){let q=searchQuery.trim().toLocaleLowerCase(),hits=searchItems.filter(x=>!q||(x.title+' '+x.group).toLocaleLowerCase().includes(q)).slice(0,14);results.innerHTML=hits.length?hits.map(x=>`<button class="search-result" data-nav-sub="${x.key}:${x.sub}">${I('search',16)}<span>${E(x.title)}</span><small>${E(x.group)}</small>${I('chevron',14)}</button>`).join(''):'<div class="empty-panel">Mos bo‘lim topilmadi</div>'}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(drawer||modal||searchOpen)){drawer=null;modal=null;searchOpen=false;render(true)}else if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!e.ctrlKey){e.preventDefault();searchOpen=true;searchQuery='';render(true)}});
render();
})();
</script>
