<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108" role="img" aria-labelledby="title description">
  <title id="title">HSK AI knot</title>
  <desc id="description">A gold Chinese knot, two rounded squares woven over and under, on cinnabar.</desc>
  <defs>
    <linearGradient id="cinnabar" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0614C"/>
      <stop offset="1" stop-color="#C02F32"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="28" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7C948"/>
      <stop offset="1" stop-color="#D9920F"/>
    </linearGradient>
  </defs>

  <rect width="108" height="108" fill="url(#cinnabar)"/>

  <!--
    Two rounded squares, one turned 45 degrees, woven: each strand passes over
    at four crossings and under at the other four. The under-passes are cut by
    a casing stroke painted in the background gradient, so the gap reads as the
    cinnabar behind the knot. Both strands stay inside the adaptive-icon safe
    circle, so a launcher mask cannot bite into the knot.
  -->
  <g fill="none" stroke-linejoin="round">
    <!-- strand A, flat -->
    <path d="M39.5,35 H68.5 A4.5,4.5 0 0 1 73,39.5 V68.5 A4.5,4.5 0 0 1 68.5,73 H39.5 A4.5,4.5 0 0 1 35,68.5 V39.5 A4.5,4.5 0 0 1 39.5,35 Z" stroke="url(#cinnabar)" stroke-width="9.5"/>
    <path d="M39.5,35 H68.5 A4.5,4.5 0 0 1 73,39.5 V68.5 A4.5,4.5 0 0 1 68.5,73 H39.5 A4.5,4.5 0 0 1 35,68.5 V39.5 A4.5,4.5 0 0 1 39.5,35 Z" stroke="url(#gold)" stroke-width="6"/>

    <!-- strand B, turned 45 degrees, laid over strand A -->
    <path d="M57.18,30.31 L77.69,50.82 A4.5,4.5 0 0 1 77.69,57.18 L57.18,77.69 A4.5,4.5 0 0 1 50.82,77.69 L30.31,57.18 A4.5,4.5 0 0 1 30.31,50.82 L50.82,30.31 A4.5,4.5 0 0 1 57.18,30.31 Z" stroke="url(#cinnabar)" stroke-width="9.5"/>
    <path d="M57.18,30.31 L77.69,50.82 A4.5,4.5 0 0 1 77.69,57.18 L57.18,77.69 A4.5,4.5 0 0 1 50.82,77.69 L30.31,57.18 A4.5,4.5 0 0 1 30.31,50.82 L50.82,30.31 A4.5,4.5 0 0 1 57.18,30.31 Z" stroke="url(#gold)" stroke-width="6"/>

    <!-- strand A returns over strand B at every other crossing -->
    <path d="M39.5,35 H52.9 M73,39.5 V52.9 M68.5,73 H55.1 M35,68.5 V55.1" stroke="url(#cinnabar)" stroke-width="9.5"/>
    <path d="M39.5,35 H52.9 M73,39.5 V52.9 M68.5,73 H55.1 M35,68.5 V55.1" stroke="url(#gold)" stroke-width="6"/>
  </g>
</svg>
