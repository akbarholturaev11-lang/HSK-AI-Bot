<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* HSK AI palette + course mascot; the reference supplies the screen hierarchy. */
:root{--ink:#211D17;--ink2:#665D50;--paper:#FDF9F0;--card:#FFFFFF;--line:#EAE0CC;--cin:#E04A40;--cin2:#B23530;--cinbg:#FDEBE7;--gold:#E9A916;--goldbg:#FAF0D3;--jade:#2FA06A;--safe-t:max(env(safe-area-inset-top,0px),var(--tg-top,0px));--safe-b:max(env(safe-area-inset-bottom,0px),var(--tg-bottom,0px));--display:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cin2);outline-offset:4px}
button:disabled{cursor:default}
.han{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-weight:600}
.wrap{width:100%;max-width:520px;margin:0 auto;height:100vh;height:var(--app-height,100dvh);padding:var(--safe-t) max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:14px 20px 4px;flex-shrink:0}
.bk{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink2);border-radius:12px;flex-shrink:0}
.icon{width:24px;height:24px;display:block;flex-shrink:0}
.pbar{flex:1;height:8px;background:var(--line);border-radius:20px;overflow:hidden}
.pbar>i{position:relative;display:block;height:100%;background:var(--cin);border-radius:20px;width:50%;transition:width .3s ease}

.step-count{font-size:12px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
#stage{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;display:flex;flex-direction:column;padding-bottom:8px}
.guide{display:flex;align-items:center;gap:16px;padding:22px 24px 16px;flex-shrink:0}
.panda{width:90px;height:100px;flex-shrink:0}
.bub{position:relative;flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px 18px}
.bub:before{content:"";position:absolute;width:14px;height:14px;background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);left:-8px;top:calc(50% - 7px)}
.bub h1{font-family:var(--display);font-size:21px;line-height:1.35;font-weight:600;letter-spacing:-.35px}
.body{padding:0 24px 16px}
.helper{font-size:13px;line-height:1.5;color:var(--ink2);margin:0 0 17px}
.choices{display:grid;gap:10px}
.lv{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);transition:background .18s,border-color .18s,transform .15s}
.lv:active:not(:disabled){transform:scale(.99)}
.lv .glyph{width:42px;height:42px;display:grid;place-items:center;flex-shrink:0;color:var(--cin2)}
.lv .ot{flex:1;min-width:0}
.lv .hd{font-family:var(--display);font-size:15px;font-weight:500;line-height:1.4;display:block}
.lv small{display:block;font-size:12px;color:var(--ink2);line-height:1.4;margin-top:4px}
.lv .chk{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--card);flex-shrink:0}
.chk .icon{width:14px;height:14px;visibility:hidden}
.lv.sel{border-color:var(--cin);background:#FFF3EF}
.lv.sel .hd{color:var(--cin2)}
.lv.sel .chk{background:var(--cin);border-color:var(--cin)}
.lv.sel .chk .icon{visibility:visible}
.level-bars{display:flex;align-items:flex-end;gap:3px;height:30px}
.level-bars i{display:block;width:5px;border-radius:3px;background:var(--line)}
.level-bars i.on{background:var(--cin)}
.goal-icon{width:36px;height:36px;display:grid;place-items:center;color:var(--ink2);transition:color .18s}
.goal-icon .icon{width:25px;height:25px;stroke-width:1.6}
.lv.sel .goal-icon{color:var(--cin2)}
.chosen{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin:0 0 17px;line-height:1.5}
.chosen .icon{width:16px;height:16px;color:var(--jade)}
.chosen b{font-weight:600;color:var(--ink)}
.footer{flex-shrink:0;padding:16px 24px calc(20px + var(--safe-b));border-top:1px solid var(--line);background:var(--paper)}
.footer-note{text-align:center;font-size:12px;line-height:1.5;color:var(--ink2);margin:0 0 12px}
.cta{width:100%;min-height:54px;padding:14px 16px;background:var(--cin);color:#fff;border:none;border-radius:13px;font-family:var(--display);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 0 var(--cin2);transition:transform .15s,box-shadow .15s}
.cta:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.cta:disabled{opacity:.65;box-shadow:0 2px 0 var(--cin2)}
.error{font-size:13px;line-height:1.45;color:var(--cin2);text-align:center;margin:0 0 12px}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 30px 28px;min-height:420px}
.welcome .hello{flex:none;padding:14px 22px;margin-bottom:27px;font-family:var(--display);font-size:17px;font-weight:500;line-height:1.5}
.hello:before{left:calc(50% - 8px);top:auto;bottom:-8px;transform:rotate(-45deg)}
.welcome .big{width:190px;height:202px;margin-bottom:23px}
.welcome h1{font-family:var(--display);font-size:38px;font-weight:650;letter-spacing:-1px;line-height:1.15;color:var(--cin);margin:0 0 14px}
.welcome p{font-size:16px;color:var(--ink2);line-height:1.65;max-width:330px}
@media(min-width:700px){.wrap{border-left:1px solid var(--line);border-right:1px solid var(--line)}.guide{padding-top:30px}.welcome .big{width:220px;height:233px}}
@media(max-width:360px){.top{padding-inline:12px;gap:10px}.guide{padding:15px 16px;gap:12px}.panda{width:70px;height:80px}.bub{padding:14px}.bub h1{font-size:19px}.body{padding-inline:16px}.lv{padding:12px;gap:10px}.lv .hd{font-size:15px}.footer{padding-inline:16px}.welcome{padding-inline:24px}}
@media(max-height:700px){.welcome{min-height:350px;padding-top:24px;padding-bottom:16px}.welcome .big{width:144px;height:153px;margin-bottom:16px}.welcome .hello{margin-bottom:18px}.welcome h1{font-size:34px}.welcome p{font-size:14px}.guide{padding-top:12px;padding-bottom:12px}.footer{padding-top:12px;padding-bottom:calc(14px + var(--safe-b))}}
.pd-breathe{animation:pdBreathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
.pd-bounce{animation:pdBounce .7s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pdBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02) translateY(-1px)}}
@keyframes pdBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.03)}}
.pd-blink{animation:pdBlink 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pdBlink{0%,90%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}}
.pd-twinkle{animation:pdTwinkle 1.1s ease-in-out infinite}
@keyframes pdTwinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.stage-enter{animation:stageEnter .24s ease-out both}
@keyframes stageEnter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pd-writing-arm{transform-origin:70px 70px;animation:pdWave 1.2s .2s ease-in-out both}
@keyframes pdWave{0%,100%{transform:rotate(0)}22%,62%{transform:rotate(-13deg)}42%,82%{transform:rotate(7deg)}}
.panda.is-pleased .pd-core{animation:pdNod .55s ease-in-out}
.panda.is-pleased .pd-writing-arm{animation:pdWave .75s ease-in-out}
.pd-smile{display:none}.panda.is-pleased .pd-open-eyes{display:none}.panda.is-pleased .pd-smile{display:block}
@keyframes pdNod{0%,100%{transform:translateY(0)}35%{transform:translateY(-3px) rotate(-2deg)}65%{transform:translateY(1px) rotate(1deg)}}
.lv.sel .chk{animation:checkPop .25s ease-out}
@keyframes checkPop{0%{transform:scale(.65)}65%{transform:scale(1.14)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.pd-blink{transform:scaleY(0)}}
</style>
</head>

  {k:"daily_communication",g:"聊",hd:{ru:"Общаться в жизни",uz:"Kundalik muloqot",tj:"Муоширати ҳаррӯза"},
    s:{ru:"Больше речи и произношения",uz:"Ko'proq gapirish va talaffuz",tj:"Бештар сухан ва талаффуз"}},
  {k:"travel",g:"游",hd:{ru:"Путешествия",uz:"Sayohat",tj:"Сафар"},
    s:{ru:"Живые ситуации и слова в дороге",uz:"Yo'ldagi holatlar va so'zlar",tj:"Ҳолатҳо ва калимаҳои роҳ"}},
  {k:"work_china",g:"工",hd:{ru:"Работа с Китаем",uz:"Ish uchun xitoy tili",tj:"Забони чинӣ барои кор"},
    s:{ru:"Вежливая рабочая речь",uz:"Ishchan, hurmatli nutq",tj:"Сухани кории боэҳтиром"}},
  {k:"study_china",g:"学",hd:{ru:"Учёба в Китае",uz:"Xitoyda o'qish",tj:"Таҳсил дар Чин"},
    s:{ru:"Упор на курс и словарный запас",uz:"Kursga va so'z boyligiga urg'u",tj:"Таъкид ба курс ва луғат"}}
];
var step=0,sel="beginner",goalSel="hsk_exam",submitting=false;
var INIT_DATA=(tg&&tg.initData)||"";
var ONB_SESSION_ID=(function(){try{var k="hsk_v3_onb_session_id",v=sessionStorage.getItem(k);if(!v){v="onb-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);sessionStorage.setItem(k,v)}return v}catch(e){return"onb-"+Date.now()}})();
function apiHeaders(){return{"Content-Type":"application/json","X-Telegram-Init-Data":INIT_DATA}}
function postJson(url,body,signal){return fetch(url,{method:"POST",headers:apiHeaders(),body:JSON.stringify(body),keepalive:true,signal:signal})}
function trackOnboardingEvent(event,payload){
  if(!INIT_DATA)return Promise.resolve({ok:false,skipped:true});
  payload=payload||{};
  payload.event=event;
  payload.source=payload.source||"course_v3_onboarding";
  payload.level=payload.level||sel;
  payload.session_id=ONB_SESSION_ID;
  payload.language=LANG;
  return postJson("/api/miniapp/event",payload).then(function(r){return r.json()}).catch(function(){return{ok:false}});
}
function onboardingPayload(){
  /* Kunlik vaqt va "nimaga urg'u beraylik" onboardingda SO'RALMAYDI — ular
     birinchi darsdan keyin so'raladi, o'shanda javob ma'noli bo'ladi.
     Shu sababli bu yerda default qiymat ketadi va keyin yangilanadi. */
  var dailyMinutes=10,startMode="lesson_1";
  /* V1 da placement/continue tanlovi yo'q. Eski cache beginner Starter'ni
     chetlab o'tkazmasligi uchun boshlanish nuqtasi qat'iy lesson_1. */
  try{localStorage.removeItem("hsk_v3_start_mode")}catch(e){}
  return {
    level:sel,
    goal:goalSel,
    daily_minutes:dailyMinutes,
    daily_time:dailyMinutes,
    start_mode:startMode,
    start_point:startMode,
    activation_variant:"direct_start_v1",
    language:LANG,
    timezone_offset_minutes:-new Date().getTimezoneOffset()
  };
}
function trv(o){return typeof o==="string"?o:(o[LANG]||o.ru)}
function levelTitle(level){return level.k==="beginner"?L.beginner:trv(level.hd)}
function levelGlyph(index){
  return '<span class="level-bars" aria-hidden="true">'+[0,1,2,3,4].map(function(n){return '<i class="'+(n<=index?'on':'')+'" style="height:'+(9+n*5)+'px"></i>'}).join("")+'</span>';
}
function optionRow(key,title,subtitle,glyph,selected,handler){
  return '<button type="button" class="lv'+(selected?' sel':'')+'" data-key="'+key+'" aria-pressed="'+selected+'" onclick="'+handler+'(\''+key+'\')">'
    +'<span class="glyph" aria-hidden="true">'+glyph+'</span><span class="ot"><span class="hd">'+title+'</span><small>'+subtitle+'</small></span><span class="chk">'+icon("check")+'</span></button>';
}
function render(){
  var st=document.getElementById("stage"),cta=document.getElementById("cta"),backButton=document.getElementById("back");
  document.getElementById("top").style.display=step===0?"none":"flex";
  document.getElementById("error").hidden=true;
  backButton.innerHTML=icon("back");backButton.setAttribute("aria-label",L.back);
  document.getElementById("footer-note").textContent=L.welcomeNote;
  document.getElementById("footer-note").hidden=step!==0;
  if(step===0){
    st.innerHTML='<div class="welcome"><div class="bub hello">'+L.hello+'</div><div class="big">'+panda("happy")+'</div><h1 id="question" tabindex="-1">HSK AI</h1><p>'+L.boot+'</p></div>';
    cta.textContent=L.start;
  }else{
    var progress=document.getElementById("progress");
    progress.setAttribute("aria-valuenow",String(step));progress.setAttribute("aria-label",L.progress);
    document.getElementById("prog").style.width=(step*50)+"%";
    document.getElementById("step-count").textContent=step+" / 2";
    var rows,summary="";
    if(step===1){
      rows=LV.map(function(l,index){return optionRow(l.k,levelTitle(l),l.k==="beginner"?L.beginnerSub:trv(l.s),levelGlyph(index),sel===l.k,"pick")}).join("");
    }else{
      var level=LV.filter(function(l){return l.k===sel})[0];
      summary='<div class="chosen">'+icon("check")+'<span>'+L.selected+': <b>'+levelTitle(level)+'</b></span></div>';
      rows=GOALS.map(function(o){return optionRow(o.k,trv(o.hd),trv(o.s),'<span class="goal-icon '+o.k+'">'+icon(o.k)+'</span>',goalSel===o.k,"pickGoal")}).join("");
    }
    st.innerHTML='<div class="guide"><div class="panda">'+panda("happy")+'</div><div class="bub"><h1 id="question" tabindex="-1">'+(step===1?L.ask:L.askGoal)+'</h1></div></div>'
      +'<div class="body"><p class="helper">'+(step===1?L.levelHint:L.goalHint)+'</p>'+summary+'<div class="choices" role="group" aria-labelledby="question">'+rows+'</div></div>';
    cta.innerHTML=(step===1?L.cont:L.first)+icon("arrow");
  }
  st.scrollTop=0;
  st.classList.remove("stage-enter");void st.offsetWidth;st.classList.add("stage-enter");
}
var pandaReactionTimer=null;
function selectChoice(k){
  document.querySelectorAll(".lv").forEach(function(button){var selected=button.dataset.key===k;button.classList.toggle("sel",selected);button.setAttribute("aria-pressed",String(selected))});
  var guide=document.querySelector(".panda");
  if(guide){clearTimeout(pandaReactionTimer);guide.classList.remove("is-pleased");void guide.offsetWidth;guide.classList.add("is-pleased");pandaReactionTimer=setTimeout(function(){guide.classList.remove("is-pleased")},800)}
  try{if(tg&&tg.HapticFeedback)tg.HapticFeedback.selectionChanged()}catch(e){}
}
function pick(k){if(submitting||!LV.some(function(l){return l.k===k}))return;sel=k;selectChoice(k)}
function pickGoal(k){if(submitting||!GOALS.some(function(o){return o.k===k}))return;goalSel=k;selectChoice(k)}
function focusQuestion(){var question=document.getElementById("question");if(question)question.focus({preventScroll:true})}
function nextBtn(){if(submitting)return;if(step<2){step++;render();focusQuestion()}else{finish()}}
function back(){if(submitting)return;if(step>0){step--;render();focusQuestion()}}
function setSubmitting(value){
  submitting=value;
  document.querySelectorAll(".lv,#back,#cta").forEach(function(button){button.disabled=value});
  document.getElementById("stage").setAttribute("aria-busy",String(value));
}
function finish(){
  if(submitting)return;setSubmitting(true);
  var cta=document.getElementById("cta");cta.textContent=L.saving;document.getElementById("error").hidden=true;
  var moved=false;
  function go(result){
    if(moved)return;moved=true;
    var launch=result&&result.ok?result:{};
    try{localStorage.setItem("hsk_v3_onb","1");localStorage.setItem("hsk_v3_learner_level",sel);localStorage.setItem("hsk_v3_level",String(launch.level||(sel==="beginner"?"hsk1":sel)))}catch(e){}
    var query=new URLSearchParams(params.toString());
    query.set("lang",LANG);query.set("level",String(launch.level||(sel==="beginner"?"hsk1":sel)));query.set("tab",String(launch.tab||"course"));query.set("onboarded","1");
    if(launch.foundation_required)query.set("foundation","1");else query.delete("foundation");
    var lesson=Number(launch.lesson||1);
    if(lesson>0&&!launch.placement){query.set("lesson",String(lesson));query.set("autostart","1")}
    location.href="/course-v3.html?"+query.toString();
  }
  function fail(){setSubmitting(false);cta.textContent=L.retry;var error=document.getElementById("error");error.textContent=L.saveError;error.hidden=false}
  if(!INIT_DATA){go({ok:true,level:sel==="beginner"?"hsk1":sel,lesson:1,tab:"course",foundation_required:sel==="beginner"});return}
  /* A slow connection must not leave the learner trapped in the busy state.
     Ignore late responses too, including browsers without AbortController. */
  var controller=window.AbortController?new AbortController():null,expired=false;
  var timeout=setTimeout(function(){expired=true;if(controller)controller.abort();fail()},12000);
  postJson("/api/miniapp/onboarding",onboardingPayload(),controller?controller.signal:undefined)
    .then(function(response){return response.json().then(function(data){if(!response.ok||!data.ok)throw new Error(data.error||"onboarding_failed");return data})})
    .then(function(result){if(!expired){clearTimeout(timeout);go(result)}})
    .catch(function(){if(!expired){clearTimeout(timeout);fail()}});
}
trackOnboardingEvent("onboarding_started",{dedupe_key:"started:"+ONB_SESSION_ID,event_id:"started:"+ONB_SESSION_ID});
render();
</script>
</body>
</html>
