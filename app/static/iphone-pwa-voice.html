<title>HSK AI Voice</title>
<!-- HSK AI Voice V8 (iPhone PWA). The styles below are the V8 reference 1:1. -->
<style>
:root{--red:#E04A40;--deep:#B23530;--paper:#FDF9F0;--surface:#252525;--muted:#8e8e8e;--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);--vh:100dvh}
*{box-sizing:border-box}html{background:#000;height:100%;overflow:hidden;overscroll-behavior:none}body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:#000;color:#fff;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:3px}
#app{position:relative;width:100%;max-width:430px;height:var(--vh);max-height:100dvh;margin:auto;overflow:clip;background:#000;touch-action:pan-x;isolation:isolate}
@media(min-width:480px){body{display:grid;place-items:center;background:#0c0c0c}#app{height:min(900px,96vh);max-height:none;border:1px solid #262626;border-radius:44px;box-shadow:0 20px 75px #000}}
.top{position:absolute;z-index:20;top:calc(10px + var(--safe-top));left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 17px;pointer-events:none}
.circle{border:1px solid #3a3a3a;background:linear-gradient(140deg,#303030,#171717);color:#fff;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.1);pointer-events:auto}
.circle.topbtn{width:49px;height:49px}.circle svg{width:25px;height:25px;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke:currentColor;stroke-width:2.4}
.circle.on{background:linear-gradient(140deg,#303030,#171717);border-color:#3a3a3a}
#orb{--orb-w:173px;position:absolute;z-index:5;left:50%;top:45.2%;width:var(--orb-w);height:var(--orb-w);transform:translate(-50%,-50%);border-radius:50%;overflow:visible;cursor:grab;touch-action:none;transition:top 660ms cubic-bezier(.23,1,.32,1),width 660ms cubic-bezier(.23,1,.32,1),height 660ms cubic-bezier(.23,1,.32,1);user-select:none;-webkit-user-select:none;outline:none}
#orb::before{content:"";display:block;position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 50% 56%,rgba(233,101,81,.16),transparent 68%);transform:scale(1.3);pointer-events:none;filter:blur(10px)}
#orb canvas{position:relative;width:100%;height:100%;border-radius:50%;display:block;box-shadow:0 0 1px 1px rgba(255,255,255,.04);animation:float 3.4s ease-in-out infinite;pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.018)}}
#app.chat #orb,#app.typing #orb{--orb-w:80px;top:calc(100% - 142px - var(--safe-bottom))}
#app.chat #orb canvas,#app.typing #orb canvas{animation-name:floatSmall}
@keyframes floatSmall{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#orb.dragging{transition:none;cursor:grabbing}
#dialogue{position:absolute;z-index:2;inset:calc(85px + var(--safe-top)) 0 calc(212px + var(--safe-bottom)) 0;overflow:auto;padding:7px 18px 10px;display:flex;flex-direction:column;gap:30px;opacity:0;transform:translateY(-13px);pointer-events:none;transition:opacity 300ms ease,transform 350ms ease;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#dialogue::-webkit-scrollbar{display:none}#app.chat #dialogue,#app.typing #dialogue{opacity:1;transform:translateY(0);pointer-events:auto}
.msg{font-size:18px;line-height:1.55;letter-spacing:-.1px;overflow-wrap:anywhere;max-width:100%;flex:0 0 auto}.msg.ai{color:#fff}.msg.user{align-self:flex-end;max-width:85%;background:#7d2925;border-radius:23px;padding:13px 17px;color:#fff}
.msg .sub{color:#c2c2c2;font-size:14px;line-height:1.42;margin-top:4px}.msg .sub:not(.native){display:none}.msg .han{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.msg .sub.native{color:#ddd}.msg .han{font-weight:500}.msg .sep{opacity:.68}.msg .smallLabel{font-size:11px;letter-spacing:.8px;color:#aaa;text-transform:uppercase;margin-bottom:4px;display:none}
#app.chat #dialogue{mask-image:linear-gradient(to bottom,transparent 0%,#000 9%,#000 97%,transparent 100%)}
#app.typing #dialogue{bottom:calc(175px + var(--safe-bottom))}
.footer{position:absolute;z-index:18;bottom:calc(16px + var(--safe-bottom));left:17px;right:17px;height:53px;display:flex;align-items:center;gap:9px}
.composer{border-radius:30px;min-width:0;flex:1;height:53px;background:linear-gradient(#292929,#212121);border:1px solid #434343;box-shadow:inset 0 1px rgba(255,255,255,.09);display:flex;align-items:center;padding:0 8px 0 9px;gap:6px}
#plus{border:none;flex:0 0 34px;width:34px;height:39px;background:transparent;color:#fff;display:grid;place-items:center;padding:0}#plus svg{width:25px;height:25px;stroke:currentColor;stroke-width:2.3;stroke-linecap:round}
#prompt{width:100%;min-width:0;flex:1;border:0;background:transparent;color:#fff;font-size:17px;outline:none;padding:0 2px;font-weight:400;text-overflow:ellipsis}
#prompt::placeholder{color:#828282}
#send{border:none;flex:0 0 36px;width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:none;place-items:center;transition:background .2s}
#send.ready{display:grid}#send svg{width:25px;height:25px;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;fill:none}
.footbtn{width:53px;height:53px;border-radius:50%}.footbtn svg{width:25px;height:25px}
#close{background:#fff;border-color:#fff;color:#000}#close svg{width:26px;height:26px}
#mutedMuted{display:none}#micmuted.off #mutedMuted{display:none}#micmuted.off #micnormal{display:block}
#micmuted:not(.off) #mutedMuted{display:block}#micmuted:not(.off) #micnormal{display:none}
/* Voice status is anchored to the orb, so it follows either focus or transcript mode. */
#orbStatus{position:absolute;left:50%;top:calc(100% + 17px);width:max-content;max-width:min(330px,91vw);transform:translate(-50%,-4px);opacity:0;pointer-events:none;color:#aaa;font-size:14px;font-weight:500;line-height:1.3;text-align:center;white-space:normal;transition:opacity .22s ease,transform .22s ease;text-shadow:0 1px 2px #000;}
#orbStatus.visible{opacity:1;transform:translate(-50%,0)}
#orbStatus.urgent{color:#d9b4ae}
#app.chat #orbStatus{top:calc(100% + 7px);font-size:12px;max-width:min(350px,92vw)}
#app.typing #orbStatus{top:calc(100% + 4px);font-size:11px}
#app.ended #orbStatus{display:none}
#settingsLayer .sheet{max-height:80%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheetLayer{z-index:30;position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .25s}.sheetLayer.open{opacity:1;pointer-events:auto}.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}.sheet{position:absolute;bottom:0;left:0;right:0;background:#1c1c1c;border:1px solid #3a3a3a;border-bottom:0;border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.22,1,.36,1);padding:16px 20px calc(22px + var(--safe-bottom));box-shadow:0 -20px 50px #0008}.sheetLayer.open .sheet{transform:translateY(0)}
.grip{width:40px;height:5px;border-radius:5px;background:#696969;margin:0 auto 18px}.sheet h3{font-weight:620;margin:0 0 19px;font-size:19px}.rowSet{width:100%;padding:13px 2px;display:flex;align-items:center;justify-content:space-between;border:0;border-bottom:1px solid #343434;background:transparent;color:#fff;text-align:left;font-size:15px}.rowSet span{color:#bbb}.seg{display:flex;gap:5px}.seg button{background:#303030;color:#ccc;border:1px solid transparent;border-radius:14px;padding:8px 10px;font-size:13px}.seg button.active{background:#752923;color:#fff;border-color:#aa443d}.toggle{width:43px;height:26px;border-radius:22px;background:#555;border:0;position:relative;transition:background .2s}.toggle::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;left:3px;top:3px;transition:left .2s}.toggle.active{background:var(--red)}.toggle.active::after{left:20px}.closeSheet{width:100%;margin-top:22px;background:#333;border:0;border-radius:16px;color:#fff;height:48px}
/* Replaced by side drawer below (V4). */
#topicsLayer .scrim{background:rgba(0,0,0,.55)}
#topicsLayer .topicsSheet{height:80%;max-height:80%;padding:12px 0 calc(16px + var(--safe-bottom));display:flex;flex-direction:column;background:#171717;border-color:#363636;overflow:hidden}
#topicsLayer .grip{margin-bottom:10px;flex-shrink:0}
.topicsHeader{display:flex;align-items:center;justify-content:space-between;padding:6px 21px 16px;flex-shrink:0}
.topicsHeader h3{font-size:20px;margin:0;font-weight:650}
.topicDismiss{background:#2c2c2c;border:1px solid #3a3a3a;border-radius:50%;color:#fff;width:35px;height:35px;display:grid;place-items:center;padding:0}
.topicDismiss svg{stroke:currentColor;fill:none;stroke-width:2.3;width:18px;height:18px}
.topicScroll{overflow-y:auto;flex:1;padding:0 17px 18px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.topicCaption{font-size:12px;color:#929292;font-weight:600;letter-spacing:.25px;padding:11px 6px 8px}
.currentTopic{border-radius:19px;background:#2a2221;border:1px solid #65352f;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 1px 14px}
.currentTopic strong{font-size:16px;font-weight:620}.currentTopic p{font-size:13px;color:#c5aaa5;margin:5px 0 0}
.currentTopic .currentTick{font-size:12px;color:#f1ada4;white-space:nowrap}
.topicList{display:flex;flex-direction:column;gap:3px}
.topicChoice{width:100%;border:0;background:transparent;color:#fff;padding:13px 11px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.topicChoice:active{background:#303030}.topicChoice.selected{background:#292121}
.topicChoice .topicTitle{display:block;font-size:16px;font-weight:560}.topicChoice .topicSub{display:block;font-size:13px;color:#a9a9a9;margin-top:3px}.topicChoice .topicCheck{color:#eb7669;font-size:21px;font-weight:700}
.topicDivider{align-self:center;color:#bba7a4;font-size:12px;border-bottom:1px solid #353535;width:100%;text-align:center;padding:9px 0 3px}
@media(max-height:600px){#topicsLayer .topicsSheet{height:80%;max-height:80%}}
.addOptions{display:flex;gap:8px;flex-wrap:wrap}.addOptions button{background:#2d2d2d;border:1px solid #4b4b4b;color:#fff;border-radius:18px;padding:12px 14px;flex:1 1 45%;font-size:14px}
.endModal{position:absolute;z-index:35;inset:0;display:none;align-items:center;justify-content:center;background:#000b;padding:20px}.endModal.show{display:flex}.endCard{background:#202020;border:1px solid #393939;border-radius:24px;padding:22px;width:min(330px,100%);text-align:center}.endCard h3{font-size:19px;font-weight:620}.endCard p{font-size:14px;color:#aaa}.endActions{display:flex;gap:10px;margin-top:20px}.endActions button{height:44px;flex:1;border:0;border-radius:14px;background:#333;color:#fff}.endActions button.danger{background:var(--red)}
#app.ended #orb{opacity:0;pointer-events:none}#app.ended .footer,#app.ended .top{display:none}#app.ended #topicBackdrop{opacity:0;transform:scale(1.1)}#app.ended #dialogue{opacity:1;transform:translateY(0);pointer-events:auto;bottom:calc(178px + var(--safe-bottom));mask-image:linear-gradient(to bottom,transparent 0%,#000 9%,#000 97%,transparent 100%)}.restart{display:none;position:absolute;z-index:2;left:20px;right:20px;bottom:calc(16px + var(--safe-bottom));max-width:420px;margin:0 auto;flex-direction:column;gap:10px}.restart button{height:48px;padding:0 22px;border:0;border-radius:24px;color:#fff;font-size:16px}#restart{background:var(--red)}#exitEnded{background:#333}.restart p{color:#aaa;margin:0 0 6px;text-align:center;font-size:14px}#app.ended .restart{display:flex}
#app.typing #orb{top:calc(100% - 125px - var(--safe-bottom));--orb-w:62px;opacity:.82}#app.typing #dialogue{bottom:calc(158px + var(--safe-bottom))}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* Voice V4: editorial minimalism, real scenario photos, no demo controls */
#voiceScreen{position:absolute;inset:0;z-index:1;background:#000;transform-origin:left center;transition:transform .4s cubic-bezier(.22,1,.36,1),border-radius .4s,filter .4s;will-change:transform;overflow:hidden}
#topicBackdrop{position:absolute;inset:-4%;z-index:0;pointer-events:none;opacity:0;transform:scale(1.08);transition:opacity .58s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
#topicBackdropMedia{position:absolute;inset:-7%;background-position:center;background-size:cover;background-repeat:no-repeat;filter:blur(13px) saturate(1.10) brightness(.78);transform:scale(1.14);opacity:.95;transition:transform .82s cubic-bezier(.22,1,.36,1),opacity .58s ease,background-image .45s ease}
#topicBackdropWash{position:absolute;inset:0;background:radial-gradient(ellipse at 48% 34%,rgba(255,252,242,.13),transparent 43%),radial-gradient(ellipse at 58% 49%,rgba(248,170,134,.06),transparent 46%),linear-gradient(180deg,rgba(6,7,9,.06),rgba(7,7,9,.29) 46%,rgba(1,2,4,.60) 75%,rgba(0,0,0,.80));opacity:.92;backdrop-filter:blur(2px) saturate(1.08);-webkit-backdrop-filter:blur(2px) saturate(1.08)}
#app.backdropEnabled:not(.chat):not(.typing) #topicBackdrop{opacity:.81;transform:scale(1)}

#app.chat #topicBackdrop,#app.typing #topicBackdrop{opacity:0;transform:scale(1.1)}

#app.drawerOpen #voiceScreen{transform:translateX(80%) scale(.967);border-radius:26px 0 0 26px;filter:brightness(.57);pointer-events:none;box-shadow:-8px 0 25px rgba(0,0,0,.45)}
#topicsLayer{z-index:33}

#topicsLayer .topicsSheet{position:absolute;inset:0 auto 0 0;width:80%;height:100%;max-height:none;padding:calc(19px + var(--safe-top)) 0 calc(15px + var(--safe-bottom));border:0;border-radius:0 24px 24px 0;background:#101011;display:flex;flex-direction:column;transform:translateX(-104%);transition:transform .4s cubic-bezier(.22,1,.36,1);box-shadow:15px 0 48px #0009;overflow:hidden}
#topicsLayer.open .topicsSheet{transform:translateX(0)}
.topicsHeader{padding:8px 20px 13px;gap:12px}
.brandSmall{font-size:25px;font-weight:720;letter-spacing:-1.25px}.brandSmall span{color:#f16d5b}
.dismissX{width:34px;height:34px;flex:0 0 34px;border:1px solid #444;background:#303033;border-radius:50%;display:grid;place-items:center;color:#fff;cursor:pointer}
.dismissX svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.topicScroll{padding:0 12px 10px;scrollbar-width:none}
.topicScroll::-webkit-scrollbar{display:none}
.topicHeadline{font-size:21px;font-weight:650;margin:9px 8px 24px;letter-spacing:-.4px}
.topicCaption{padding:11px 8px 9px;font-size:10px;font-weight:730;color:#79797b;letter-spacing:1.15px}
.currentTopic{margin:0 1px 15px;background:#29201f;border:1px solid #5c3531;padding:9px 10px;border-radius:17px;justify-content:unset;gap:10px}
.currentCopy{min-width:0;flex:1}.currentCopy strong{display:block;font-size:14px;line-height:1.3}.currentCopy p{margin-top:4px;color:#bb9e9a;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activePin{width:7px;height:7px;background:#e46a5c;border-radius:50%;flex:0 0 7px;box-shadow:0 0 8px #e46a5c90}

.topicPhoto img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) brightness(.82)}

/* Browser demo needs no fake AI. Live modes retain exact V4 positions. */
#dialogue .sub.pinyin:not([hidden]){display:block}

#orbStatus{max-width:min(340px,94vw)}

/* Voice V8: compact resting footer (full screen sits it lower, so it stays
   small), gentle spring expansion only while the keyboard is up. */
.footer{height:40px;left:20px;right:20px;bottom:calc(14px + var(--safe-bottom));gap:6px;
  transition:left 390ms cubic-bezier(.2,1.19,.32,1),right 390ms cubic-bezier(.2,1.19,.32,1),height 390ms cubic-bezier(.2,1.19,.32,1),bottom 390ms cubic-bezier(.2,1.19,.32,1),gap 390ms ease}
.composer{height:40px;padding:0 7px 0 6px;gap:4px;
  transition:height 390ms cubic-bezier(.2,1.19,.32,1),padding 390ms cubic-bezier(.2,1.19,.32,1),border-color .22s ease}
#plus{width:27px;flex-basis:27px;height:32px;transition:width .36s cubic-bezier(.2,1.19,.32,1),flex-basis .36s cubic-bezier(.2,1.19,.32,1)}
#plus svg{width:20px;height:20px}
#prompt{font-size:16px}
.footbtn{width:40px;height:40px;flex:0 0 40px;transition:width 390ms cubic-bezier(.2,1.19,.32,1),height 390ms cubic-bezier(.2,1.19,.32,1),flex-basis 390ms cubic-bezier(.2,1.19,.32,1)}
.footbtn svg{width:20px;height:20px}
#close svg{width:22px;height:22px}
#send{display:none;width:40px;height:40px;flex:0 0 40px;border:1px solid var(--red);background:var(--red);color:#fff}
#send.ready{display:none}

{id:'free',key:'voiceV8.topicFree',zh:'自由聊天',py:'Zìyóu liáotiān'},
{id:'daily',key:'voiceV8.topicDaily',zh:'日常生活',py:'Rìcháng shēnghuó'},

/* Visible area: inside the course frame the soft keyboard only shrinks the
   parent's visual viewport, so measure the frame against that viewport. */
function viewportBox(){
 try{const pv=EMBEDDED&&window.frameElement&&window.parent.visualViewport;if(pv){const top=window.frameElement.getBoundingClientRect().top,start=Math.max(0,pv.offsetTop-top),end=Math.min(innerHeight,pv.offsetTop+pv.height-top);if(end-start>160)return {top:start,height:end-start}}}catch(_){}
 const v=window.visualViewport;return {top:v?Math.max(0,v.offsetTop):0,height:v?v.height:innerHeight};
}
function vh(){const box=viewportBox();let h=box.height,shift=box.top;if(innerWidth>480){h=Math.min(900,Math.round(innerHeight*.96));shift=0}app.style.setProperty('--vh',Math.round(h)+'px');app.style.transform=shift>1?`translateY(${Math.round(shift)}px)`:''}
const viewportTargets=[window,window.visualViewport];try{if(EMBEDDED&&window.parent.visualViewport)viewportTargets.push(window.parent.visualViewport)}catch(_){}

bindViewport(true);vh();
function scrollBottom(){dialogue.scrollTop=dialogue.scrollHeight}
function setMode(next){if(next!=='focus'&&next!=='chat')return;mode=next;app.classList.toggle('chat',next==='chat');if(next==='chat')setTimeout(scrollBottom,180)}
function toggleMode(){setMode(mode==='focus'?'chat':'focus')}
let reboundTimer=0;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function finishOrbDrag(dy,dt,cancel=false){if(!drag)return;drag=null;orb.classList.remove('dragging');orb.classList.remove('rebounding');void orb.offsetWidth;orb.style.transform='translate(-50%,-50%)';if(!reduceMotion){orb.classList.add('rebounding');clearTimeout(reboundTimer);reboundTimer=setTimeout(()=>{orb.classList.remove('rebounding');orb.style.removeProperty('--stretch-x');orb.style.removeProperty('--stretch-y')},590)}else{orb.style.removeProperty('--stretch-x');orb.style.removeProperty('--stretch-y')}
if(!cancel){if(dy>55)setMode('chat');else if(dy< -55)setMode('focus');else if(Math.abs(dy)<12&&dt<460&&mode==='chat')setMode('focus')}}
orb.addEventListener('pointerdown',e=>{if(app.classList.contains('ended')||e.button!==0)return;clearTimeout(reboundTimer);orb.classList.remove('rebounding');orb.style.removeProperty('--stretch-x');orb.style.removeProperty('--stretch-y');drag={x:e.clientX,y:e.clientY,at:performance.now(),id:e.pointerId};orb.setPointerCapture(e.pointerId);orb.classList.add('dragging')});

orb.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;finishOrbDrag(e.clientY-drag.y,performance.now()-drag.at)});

function setState(next,message=''){state=next;noticeText=message;renderStatus()}
function renderStatus(){const el=$('orbStatus');if(!el)return;const value=noticeText||t(state);el.textContent=value;el.classList.toggle('visible',!!value);el.classList.toggle('urgent',['offline','slow','mic','fail','login'].includes(state))}

function hydrateUiPrefs(){try{const pv=localStorage.getItem('hsk_voice_pinyin');const tv=localStorage.getItem('hsk_voice_translation');const bv=localStorage.getItem('hsk_voice_backdrop');if(pv!==null)pinyin=pv==='1';if(tv!==null)showTranslation=tv!=='0';if(bv!==null)showBackdrop=bv!=='0'}catch(_){}}

function applyLocale(next){const value=normalizeLang(next);if(value)lang=value;window.LANG=lang;document.documentElement.lang=lang==='tj'?'tg':lang;
 for(const el of document.querySelectorAll('[data-i18n]'))el.textContent=msg(el.dataset.i18n);

function layer(id,open){document.querySelectorAll('.sheetLayer.open').forEach(el=>{if(el.id!==id){el.classList.remove('open');el.setAttribute('aria-hidden','true')}});const el=$(id);el.classList.toggle('open',open);el.setAttribute('aria-hidden',String(!open));if(id==='topicsLayer'){app.classList.toggle('drawerOpen',open);$('history').setAttribute('aria-expanded',String(open))}}

function sceneThumb(topicId){const frame=document.createElement('div');frame.className='topicPhoto';const glyph=document.createElement('span');glyph.textContent=sceneGlyphs[topicId]||sceneGlyphs.free;frame.appendChild(glyph);const img=document.createElement('img');img.src=scenePhoto(topicId);img.alt='';img.loading='lazy';img.onerror=()=>img.remove();frame.appendChild(img);return frame}
function renderTopics(){const target=topics.find(x=>x.id===currentTopic)||topics[0];$('currentTopicTitle').textContent=msg(target.key);$('currentTopicSubtitle').textContent=target.zh+' · '+target.py;const old=$('currentTopicPhoto');if(old&&old.dataset.topic!==target.id){const img=sceneThumb(target.id);img.id='currentTopicPhoto';img.dataset.topic=target.id;old.replaceWith(img)}const list=$('topicList');list.replaceChildren();for(const topic of topics){if(topic.id===currentTopic)continue;const b=document.createElement('button');b.type='button';b.className='topicChoice';b.dataset.topic=topic.id;const copy=document.createElement('span');copy.className='topicCopy';const n=document.createElement('span');n.className='topicTitle';n.textContent=msg(topic.key);const sub=document.createElement('span');sub.className='topicSub';sub.textContent=topic.zh+' · '+topic.py;copy.append(n,sub);const arrow=document.createElement('span');arrow.className='topicCheck';arrow.textContent='›';b.append(sceneThumb(topic.id),copy,arrow);list.appendChild(b)}updateTopicBackdrop()}
$('topicList').addEventListener('click',async e=>{const b=e.target.closest('[data-topic]');if(!b||busy)return;const target=topics.find(x=>x.id===b.dataset.topic);if(!target||target.id===currentTopic)return;layer('topicsLayer',false);const wasActive=!!(sessionId||recording);if(sessionId)await endSession({quiet:true});currentTopic=target.id;dialogue.replaceChildren();renderTopics();app.classList.remove('ended');setMode('focus');if(quota===0)noQuotaState();else{setState('ready');if(wasActive)autoStart()}showToast(msg('voiceV8.topicChanged'))});

function sendIcon(){const ready=!!prompt.value.trim();const button=$('send');button.classList.toggle('ready',ready);button.disabled=!ready||busy;button.setAttribute('aria-hidden',String(!typing));button.tabIndex=typing&&ready?0:-1;if(!button.firstElementChild)button.innerHTML='<svg viewBox="0 0 24 24"><path d="m12 19 0-14M6 11l6-6 6 6"/></svg>'}
prompt.addEventListener('input',sendIcon);prompt.addEventListener('focus',()=>{typing=true;setMode('chat');app.classList.add('typing');sendIcon();setTimeout(scrollBottom,140)});prompt.addEventListener('blur',()=>{typing=false;app.classList.remove('typing');keyboardWasSeen=false;sendIcon();syncSafeArea(false)});
/* Full screen inside the course frame: env() is 0 in an iframe, so the
   parent's insets are measured where the frame meets the screen edges. With
   the soft keyboard up the composer sits on the keyboard, not on a home
   indicator gap. */

// HSK cinnabar orb: continuously flowing pigments with elastic touch deformation.

const ctx=canvas.getContext('2d',{alpha:true});
const noise=document.createElement('canvas');noise.width=64;noise.height=64;
const nx=noise.getContext('2d');const ndata=nx.createImageData(64,64);
for(let i=0;i<ndata.data.length;i+=4){const v=144+Math.random()*105;ndata.data[i]=v;ndata.data[i+1]=v;ndata.data[i+2]=v;ndata.data[i+3]=Math.round(Math.random()*22)}
nx.putImageData(ndata,0,0);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastW=0,lastDraw=0;
function render(ms){
 if(!reduced)requestAnimationFrame(render);
 if(!reduced&&ms-lastDraw<32)return;
 if(reduced&&lastDraw)return;
 // A hidden frame (still opening or already closing) has no orb box yet:

 if(width<8){if(reduced)requestAnimationFrame(render);return}
 lastDraw=ms;

 if(size!==lastW){canvas.width=size;canvas.height=size;lastW=size}
 const c=size/2,r=c-.75*dpr,t=reduced?1.2:ms*.00083;
 const active=state==='speaking'||state==='listening'?1.16:1;
 ctx.clearRect(0,0,size,size);ctx.save();ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.clip();
 const bg=ctx.createLinearGradient(size*(.15+.12*Math.sin(t*.42)),0,size*(.78+.1*Math.cos(t*.38)),size);
 bg.addColorStop(0,'#B63738');bg.addColorStop(.29,'#DB554C');bg.addColorStop(.62,'#F18E72');bg.addColorStop(1,'#FFF5DF');ctx.fillStyle=bg;ctx.fillRect(0,0,size,size);
 function blob(x,y,rad,color){let g=ctx.createRadialGradient(x,y,rad*.04,x,y,rad);g.addColorStop(0,color);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(x-rad,y-rad,rad*2,rad*2)}
 blob(size*(.25+.12*Math.sin(t*.91)),size*(.17+.10*Math.cos(t*.51)),size*.74,'rgba(121,13,28,.58)');
 blob(size*(.82+.1*Math.cos(t*.78)),size*(.40+.10*Math.sin(t*.83)),size*.73,'rgba(205,43,46,.58)');
 blob(size*(.30+.18*Math.sin(t*.63+1)),size*(.78+.10*Math.sin(t*.51)),size*.66,'rgba(255,251,234,.76)');
 blob(size*(.63+.20*Math.sin(t*.48)),size*(.58+.08*Math.cos(t*.74)),size*.45,'rgba(255,225,189,.4)');
 function crest(base,amp,phase,rate,color){ctx.beginPath();ctx.moveTo(-size*.17,size*1.14);for(let i=-.17;i<=1.18;i+=.022){const y=base+amp*(Math.sin(i*9.8+t*rate+phase)*.7+Math.sin(i*16.6-t*.69+phase)*.23+Math.sin(i*4.1+t*.51)*.2);ctx.lineTo(i*size,y*size)}ctx.lineTo(size*1.19,size*1.17);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
 ctx.filter=`blur(${Math.max(1,Math.round(size*.045))}px)`;

 crest(.68,.095*active,2.15,-1.1,'rgba(255,254,244,.53)');

 ctx.strokeStyle='rgba(255,242,228,.12)';ctx.lineWidth=size*.026;ctx.stroke();ctx.globalCompositeOperation='source-over';
 let glaze=ctx.createRadialGradient(size*.43,size*.39,size*.03,c,c,size*.73);glaze.addColorStop(0,'rgba(255,255,255,.06)');glaze.addColorStop(.77,'rgba(255,255,255,0)');glaze.addColorStop(1,'rgba(54,6,17,.27)');ctx.fillStyle=glaze;ctx.fillRect(0,0,size,size);
 ctx.globalAlpha=.09;ctx.fillStyle=ctx.createPattern(noise,'repeat');ctx.fillRect(0,0,size,size);ctx.globalAlpha=1;ctx.restore();
 ctx.strokeStyle='rgba(255,234,220,.27)';ctx.lineWidth=1.1*dpr;ctx.beginPath();ctx.arc(c,c,r-.8,0,Math.PI*2);ctx.stroke();
}
