   foydalanuvchi aylanayotgan spinnerdan boshqa hech narsa ko'rmaydi. */
const API_TIMEOUT_MS=45000;
const SUBMIT_TIMEOUT_MS=120000;
function api(path,body,timeoutMs){
  const limit=timeoutMs||API_TIMEOUT_MS;
  const controller=typeof AbortController==="function"?new AbortController():null;
  const timer=controller?setTimeout(()=>controller.abort(),limit):null;
  const clear=()=>{if(timer)clearTimeout(timer)};
  return fetch(path,{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Telegram-Init-Data":INIT_DATA},
    body:JSON.stringify(body||{}),
    signal:controller?controller.signal:undefined
  }).catch(error=>{
    clear();
    /* Tarmoq xatosi brauzerdan inglizcha keladi ("Failed to fetch") —
       foydalanuvchiga o'z tilidagi sabab ko'rsatiladi. */
    throw apiError(error&&error.name==="AbortError"?"request_timeout":"network_error");
  }).then(async response=>{
    clear();
    const data=await response.json().catch(()=>({ok:false,error:"bad_json"}));
    if(!response.ok||!data.ok)throw apiError(data.error||"api_error",data.support_url,data.reason);
    return data;
  });
}
/* Xato matni bilan birga KODI ham saqlanadi: ekranda admin kontaktini
   ko'rsatish yoki ko'rsatmaslik shu kodga qarab hal qilinadi. */
function apiError(code,supportUrl,reason){
  const error=new Error(errorText(code));
  error.code=code;
  if(supportUrl)error.supportUrl=supportUrl;
  if(reason)error.reason=reason;
  return error;
}
function errorText(code){
  const text=tr();
  const errors={
    invalid_telegram_init_data:text.invalidTelegram,
    payment_details_missing:text.paymentDetailsMissing,
    admin_notification_failed:text.adminNotificationFailed,
    qr_not_ready:text.qrMissing,
    payment_invalid_plan:text.offerExpired,
    access_start_first:text.invalidTelegram,
    invalid_screenshot:text.screenshotInvalid,
    user_blocked:text.userBlocked,
    payment_submit_failed:text.serverError,
    /* JSON o'rniga gateway HTML sahifasi qaytgan holat (502/504). */
    bad_json:text.serverError,
    network_error:text.networkError,
    request_timeout:text.timeoutError,
    api_error:text.error
  };
  return errors[code]||text.error;
}

    }else{
      const input=document.createElement("textarea");
      input.value=value;
      input.setAttribute("readonly","");
      input.style.position="fixed";
      input.style.left="-9999px";
      document.body.appendChild(input);

      const copied=document.execCommand("copy");
      input.remove();

      card_country:state.method==="visa"?state.country:null,
      screenshot_data_url:state.screenshotDataUrl
    },SUBMIT_TIMEOUT_MS);
    state.pending=Boolean(data.already_pending);
    state.pendingPayment=data.already_pending?data:null;
    state.done=!state.pending;
    try{sessionStorage.removeItem("hsk_subscription_attempt_v1")}catch(e){}
    state.step=0;
  }catch(error){
    /* Server rasmni rad etsa — sababi (format yoki hajm) bo'yicha aynan
       nima qilish kerakligi aytiladi va bu qator toast o'chgach ham qoladi. */
    const note=error&&error.code==="invalid_screenshot"?serverScreenshotNote(error):"";
    toast(note||error.message||tr().error);
    if(note){
      state.screenshotDataUrl="";
      state.screenshotName="";
      state.screenshotNote=note;
    }
    offerSupport(error);
  }finally{
    setBusy(false);
    render();
  }
}

function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("read"));
    reader.onload=()=>resolve(String(reader.result||""));
    reader.readAsDataURL(file);
  });
}
/* Telefon rasmi canvasda siqiladi. Asosiy chek — 8MB server chegarasi emas,
   YUKLASH VAQTI: sekin mobil internetda 300KB dan katta so'rov gateway
   timeoutiga borib "Xatolik yuz berdi" bo'lib qaytardi. Shuning uchun
   pog'onali siqish: karta raqami o'qiladigan eng kichik hajm tanlanadi. */
const SCREENSHOT_TARGET_CHARS=300*1024;
/* Server chegarasi DEKODLANGAN baytda o'lchanadi (MAX_SCREENSHOT_BYTES),
   base64 satri esa ~1.33 barobar uzun — shuning uchun bu yerda ham bayt. */
const SCREENSHOT_MAX_BYTES=8*1024*1024;
/* Siqish ishlaganda hajm ~300KB dan oshmaydi. Bundan kattasi — canvas
   siqa olmagan holat, ya'ni yuborish sekin internetda uzoq davom etadi. */
const SCREENSHOT_HEAVY_BYTES=600*1024;
const SCREENSHOT_STEPS=[[1280,0.72],[1100,0.65],[900,0.6],[720,0.55]];
function allowedShot(dataUrl){
  return /^data:image\/(jpeg|jpg|png|webp);base64,/i.test(dataUrl||"");
}
function compressDataUrl(dataUrl){
  return new Promise(resolve=>{
    const img=new Image();
    img.onerror=()=>resolve(dataUrl);
    img.onload=()=>{
      try{
        let best="";
        for(const step of SCREENSHOT_STEPS){
          const max=step[0],quality=step[1];
          const scale=Math.min(1,max/Math.max(img.width,img.height));
          const w=Math.max(1,Math.round(img.width*scale));
          const h=Math.max(1,Math.round(img.height*scale));
          const canvas=document.createElement("canvas");
          canvas.width=w;canvas.height=h;
          const ctx=canvas.getContext("2d");
          if(!ctx)break;
          ctx.drawImage(img,0,0,w,h);
          const out=canvas.toDataURL("image/jpeg",quality);
          if(!out||out.length<=60)break;
          best=out;
          if(out.length<=SCREENSHOT_TARGET_CHARS)break;
        }
        if(!best){resolve(dataUrl);return}
        /* Kichik rasm qayta kodlanganda kattalashib ketishi mumkin —
           faqat allowed formatdagi asl nusxa kichik bo'lsa o'sha qoladi. */
        resolve(allowedShot(dataUrl)&&dataUrl.length<best.length?dataUrl:best);
      }catch(e){resolve(dataUrl);}
    };
    img.src=dataUrl;
  });
}
/* Rasm rad etilganda sabab AYNAN aytiladi: format, hajm yoki o'qish
   xatosi — har biri o'z matni va nima qilish kerakligi bilan. */
function rejectScreenshot(note){
  state.screenshotDataUrl="";
  state.screenshotName="";
  state.screenshotNote=note;
  toast(note);
  render();
}
$("#receiptInput").addEventListener("change",async event=>{
  const file=event.target.files?.[0];
  if(!file)return;
  const text=tr();
  if(!file.type.startsWith("image/")){
    rejectScreenshot(text.screenshotFormat.replace("{type}",file.type||"?"));
    event.target.value="";
    return;
  }
  try{
    const raw=await readFileAsDataUrl(file);
    const shot=await compressDataUrl(raw);
    /* Server faqat jpeg/png/webp va 8MB gacha qabul qiladi. Ilgari bunday
       rasm faqat "Фиристодан" bosilgandan keyin, umumiy xato matni bilan
       rad etilardi — endi sabab darhol va aniq aytiladi. */
    if(!allowedShot(shot)){
      rejectScreenshot(text.screenshotFormat.replace("{type}",file.type||"?"));
      return;
    }
    if(dataUrlBytes(shot)>SCREENSHOT_MAX_BYTES){
      rejectScreenshot(text.screenshotTooBig.replace("{size}",formatBytes(dataUrlBytes(shot))));
      return;
    }
    state.screenshotDataUrl=shot;
    state.screenshotName=file.name;
    state.screenshotNote="";
    trackSubscriptionStage("payment_receipt_selected");
    render();
  }catch(err){
    rejectScreenshot(text.screenshotReadFailed);
  }finally{
    event.target.value="";
  }
});
render();
loadOverview();
