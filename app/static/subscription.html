<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>HSK AI Pro</title>
<style>
:root{
  color-scheme:light;
  --bg:#ffffff;
  --card:#f6f8f7;
  --line:#e3e8e6;
  --line2:#cbd5d1;
  --text:#14201b;
  --muted:#687770;
  --accent:#0e9a64;
  --accent-ink:#0a7a4f;
  --accent-soft:#e9f7f0;
  --accent-line:#bfe6d3;
  --gold:#f5b93f;
  --gold-soft:#fff7e6;
  --gold-line:#f3d9a4;
  --gold-ink:#8a5a00;
  --radius:18px;
  --radius-sm:13px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
body{overflow-x:hidden;position:relative}
button,input{font:inherit}
button{border:0;color:inherit;background:none;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.98)}
.app{position:relative;z-index:1;min-height:100dvh;max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 15px calc(110px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;flex-direction:column;gap:4px}
.kicker{font-size:11px;color:var(--accent-ink);font-weight:800;text-transform:uppercase;letter-spacing:.14em}
h1{font-size:27px;line-height:1.06;font-weight:900;letter-spacing:-.01em}
.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.help-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--accent-ink)}
.status{display:none;margin:0 0 12px;border:1px solid var(--gold-line);border-radius:var(--radius-sm);background:var(--gold-soft);padding:11px 13px;color:var(--gold-ink);font-size:12px;line-height:1.4;font-weight:750}
.status.show{display:block}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}
.steps i{height:5px;border-radius:999px;background:var(--line);transition:.3s}
.steps i.active{background:var(--accent)}
.screen{display:none;animation:fade .36s cubic-bezier(.22,.61,.36,1)}
.screen.active{display:block}
.hero{position:relative}
.hero h2{position:relative;font-size:22px;line-height:1.12;letter-spacing:-.01em;font-weight:900}
.hero p{position:relative;margin-top:9px;color:var(--muted);font-size:13px;line-height:1.5}
.discount{position:relative;display:flex;flex-direction:column;gap:11px;margin-top:14px;border:1px solid var(--gold-line);border-radius:var(--radius);background:var(--gold-soft);padding:14px;overflow:hidden;animation:fade .4s ease}
.discount.used{border-color:var(--line);background:var(--card)}
.discount-row{position:relative;display:flex;align-items:center;gap:13px}
.discount-badge{flex:0 0 auto;min-width:58px;height:58px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#ffd27d,#ffba4d);color:#2a1c00;font-size:18px;font-weight:950}
.discount.used .discount-badge{background:var(--line);color:var(--muted)}
.discount-body{flex:1;min-width:0}
.discount-body strong{display:block;font-size:14px;font-weight:900;line-height:1.25}
.discount-body span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.38}
.discount-bar{position:relative;height:6px;border-radius:999px;background:var(--gold-line);overflow:hidden}
.discount-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .6s cubic-bezier(.22,.61,.36,1)}
.discount-btn{position:relative;height:46px;border-radius:13px;border:1px solid var(--accent);background:var(--bg);color:var(--accent-ink);font-weight:850;font-size:13px;transition:.18s}
.discount-btn:active{background:var(--accent-soft)}
.benefits{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.benefit{position:relative;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);padding:12px;min-height:78px}
.benefit strong{display:block;font-size:13px;line-height:1.28;font-weight:850}
.benefit span{display:block;margin-top:6px;color:var(--muted);font-size:12px;line-height:1.35}
.section{margin-top:16px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:9px}
.section h3{font-size:15px;font-weight:900}
.section small{color:var(--accent-ink);font-size:12px;font-weight:850;text-align:right}
.value-copy{margin:-1px 0 10px;color:var(--muted);font-size:12px;line-height:1.45;font-weight:750}
.value-copy:empty,#payText:empty{display:none}
#payText:empty+.quote-card{margin-top:0}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.plan{position:relative;min-height:130px;text-align:left;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);padding:14px;display:flex;flex-direction:column;justify-content:space-between;transition:.18s}
.plan.selected,.choice.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.plan.wide{grid-column:1/-1;min-height:auto}
.plan-note{margin-top:6px;color:var(--muted);font-size:12px;font-weight:800}
.renewal-summary{display:grid;gap:5px;margin-top:12px;border:1px solid var(--accent-line);border-radius:var(--radius-sm);background:var(--accent-soft);padding:12px 13px}
.renewal-summary strong{font-size:13px;line-height:1.35;font-weight:850;color:var(--text)}
.renewal-summary span{font-size:12px;line-height:1.4;color:var(--muted)}
.plan-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plan-name{font-size:13px;color:var(--muted);font-weight:850}
.badge{display:inline-flex;align-items:center;justify-content:center;min-height:21px;border-radius:999px;padding:2px 8px;background:var(--gold-soft);color:var(--gold-ink);font-size:10px;line-height:1.12;font-weight:900;border:1px solid var(--gold-line)}
.price{display:inline-block;font-size:30px;line-height:1;font-weight:950;letter-spacing:-.02em;margin-top:12px;color:var(--text)}
.price.long{font-size:23px}
.price small{font-size:12px;color:var(--muted);font-weight:850;margin-left:4px}
.old-price{display:none;margin-top:9px;color:var(--muted);font-size:12px;text-decoration:line-through}
.discounted .old-price{display:block}
.list{display:grid;gap:9px}
.choice{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);padding:0 14px;text-align:left;transition:.18s}
.choice strong{display:block;font-size:14px;line-height:1.25;font-weight:850;color:var(--text)}
.choice span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}
.choice .choice-tx{flex:1;min-width:0;margin-top:0;color:inherit}
.method-current{width:100%;min-height:66px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);padding:0 14px;text-align:left}
.method-current .chevron{flex:0 0 26px;color:var(--accent-ink);font-size:22px;line-height:1;text-align:center;font-weight:850}
.method-current .choice-tx{flex:1;min-width:0}
.method-current .choice-tx strong{display:block;font-size:14px;line-height:1.25;font-weight:850;color:var(--text)}
.method-current .choice-tx span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}
.method-options{display:none;margin-top:9px}
.method-options.show{display:grid;gap:9px}
.country-flag{flex:0 0 auto;width:46px;height:34px;border-radius:0;display:grid;place-items:center;background:transparent;font-size:38px;line-height:1;overflow:visible;box-shadow:none;font-style:normal}
.dot{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);transition:.18s}
.selected .dot{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--bg);background:var(--accent)}
.quote-card{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:16px;margin-top:14px;overflow:hidden}
.quote-label{position:relative;color:var(--accent-ink);font-size:12px;font-weight:850}
.quote-amount{position:relative;margin-top:8px;font-size:36px;line-height:1;font-weight:950;letter-spacing:-.02em}
.quote-amount small{font-size:15px;color:var(--muted);font-weight:850;margin-left:6px}
.quote-old{display:none;position:relative;margin-top:8px;color:var(--muted);font-size:12px;line-height:1.25;font-weight:850;text-decoration:line-through}
.quote-old.show{display:block}
.meta{display:grid;gap:8px;margin-top:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);padding:11px 13px}
.row span{color:var(--muted);font-size:12px;font-weight:800}
.row strong{font-size:13px;text-align:right;line-height:1.28;font-weight:850}
.paybox{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);padding:16px}
.paybox h4{font-size:15px;margin-bottom:8px;font-weight:900}
.paybox p,.paybox pre{color:var(--muted);font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.detail-hint{display:block;width:100%;margin-bottom:11px;color:var(--muted);font-size:12px;line-height:1.45;text-align:left}
.detail-hint-text{display:block}
.detail-hint.collapsed .detail-hint-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.detail-hint-more{display:block;margin-top:4px;color:var(--accent-ink);font-size:11px;font-weight:900}
.detail-list{display:grid;gap:9px}
.detail-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);padding:11px 12px;min-height:48px}
.detail-row span{min-width:0;color:var(--text);font-size:13px;line-height:1.38;font-weight:750;word-break:break-word}
.detail-row.copyable{border-color:var(--accent-line);background:var(--accent-soft)}
.copy-detail{height:34px;min-width:66px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:950;padding:0 10px}
.detail-empty{border:1px dashed var(--line2);border-radius:var(--radius-sm);padding:16px;color:var(--muted);font-size:13px;line-height:1.45;text-align:center;background:var(--card)}
.retry-inline{display:inline-flex;align-items:center;justify-content:center;min-height:38px;margin-top:11px;padding:0 14px;border:1px solid var(--accent-line);border-radius:999px;background:var(--bg);color:var(--accent-ink);font-size:13px;font-weight:850}
.qr{display:flex;align-items:center;justify-content:center;width:100%;min-height:220px;border:1px dashed var(--line2);border-radius:var(--radius-sm);background:#fff;margin-top:11px;overflow:hidden;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.qr-tappable{cursor:pointer}
.qr-tappable:active{transform:scale(.99)}
.qr img{display:block;max-width:100%;max-height:280px}
.qr.empty{background:var(--card);color:var(--muted);font-size:13px;text-align:center;padding:20px}
.qr-hint{margin-top:9px;text-align:center;color:var(--muted);font-size:12px;line-height:1.35}
.qr-actions{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-4px);transition:grid-template-rows .2s ease,opacity .2s ease,transform .2s ease}
.qr-actions.show{grid-template-rows:1fr;opacity:1;transform:translateY(0)}
.qr-actions-inner{overflow:hidden}
.qr-download{width:100%;height:46px;margin-top:10px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-size:14px;font-weight:950}
.qr-preview{position:fixed;inset:0;z-index:28;display:none;background:var(--bg);padding:calc(18px + env(safe-area-inset-top,0px)) 15px calc(88px + env(safe-area-inset-bottom,0px))}
.qr-preview.show{display:flex;flex-direction:column}
.qr-preview-head{width:100%;max-width:520px;margin:0 auto 12px}
.qr-preview-head h3{font-size:18px;line-height:1.2;font-weight:950}
.qr-preview-body{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:520px;margin:0 auto}
.qr-preview-frame{display:grid;place-items:center;width:100%;max-width:430px;aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:12px;box-shadow:0 12px 40px rgba(20,32,27,.1)}
.qr-preview-frame img{display:block;width:100%;height:100%;object-fit:contain}
.qr-preview-bottom{position:fixed;left:0;right:0;bottom:0;z-index:29;padding:11px 15px calc(11px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.qr-preview-bottom-inner{max-width:520px;margin:0 auto}
.qr-preview-back{width:100%;height:54px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-weight:950}
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:9px;margin-top:14px;min-height:150px;border:2px dashed var(--line2);border-radius:var(--radius);background:var(--card);padding:22px 16px;cursor:pointer;transition:.18s}
.upload input{display:none}
.upload:active{transform:scale(.99)}
.upload-plus{display:flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:50%;background:var(--accent-soft);border:1.5px solid var(--accent-line);color:var(--accent);font-size:38px;font-weight:300;line-height:1;transition:.18s}
.upload strong{display:block;font-size:15px;font-weight:850}
.upload span{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.upload.ready{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.upload.ready .upload-plus{background:var(--accent);color:#fff;border-color:var(--accent)}
.done{display:grid;gap:14px;text-align:center;padding-top:54px;animation:fade .3s ease}
.done-mark{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:var(--accent);color:#fff;font-size:42px;font-weight:950;box-shadow:0 0 0 10px var(--accent-soft);animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
.done h2{font-size:25px;font-weight:900}
.done p{color:var(--muted);font-size:13px;line-height:1.5;max-width:320px;margin:0 auto}
.done-return{height:54px;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:15px;font-weight:950;margin:8px auto 0;padding:0 24px;min-width:190px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:11px 15px calc(11px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.bottom-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:96px 1fr;gap:9px}
.back,.cta{height:54px;border-radius:var(--radius);font-weight:950;font-size:15px;transition:.18s}
.back{background:var(--bg);border:1px solid var(--line);color:var(--text)}
.back.hide{display:none}
.back.hide+.cta{grid-column:1/3}
.cta{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(14,154,100,.22);letter-spacing:.01em}
.cta:disabled{opacity:.45;box-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(12px);max-width:calc(100% - 28px);border-radius:999px;background:var(--text);color:#fff;padding:11px 15px;font-size:13px;font-weight:850;opacity:0;pointer-events:none;transition:.2s ease;box-shadow:0 12px 30px rgba(20,32,27,.2);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet{position:fixed;inset:0;z-index:25;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet-backdrop{position:absolute;inset:0;background:rgba(20,32,27,.35);backdrop-filter:blur(4px);transform:none}
.sheet-panel{position:relative;width:100%;max-width:520px;border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;background:var(--bg);padding:17px 15px calc(17px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(20,32,27,.12);animation:sheetUp .22s ease}
.sheet-panel h3{font-size:17px;line-height:1.25;font-weight:900}
.sheet-panel p{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.45}
.invite-link{display:block;margin-top:10px;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--card);padding:10px 11px;color:var(--accent-ink);font-size:12px;line-height:1.4;word-break:break-all;user-select:all}
.sheet-actions{display:grid;gap:9px;margin-top:14px}
.sheet-actions button{min-height:50px;border-radius:var(--radius-sm);font-weight:900;font-size:14px}
.sheet-primary{background:var(--accent);color:#fff}
.sheet-secondary{border:1px solid var(--line2);background:var(--bg);color:var(--text)}
.sheet-close{color:var(--muted)}
.renewal-modal{position:fixed;inset:0;z-index:32;display:none;align-items:center;justify-content:center;padding:20px}
.renewal-modal.show{display:flex}
.renewal-backdrop{position:absolute;inset:0;background:rgba(20,32,27,.42);backdrop-filter:blur(4px)}
.renewal-card{position:relative;width:100%;max-width:430px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);padding:20px;box-shadow:0 18px 55px rgba(20,32,27,.2);animation:pop .2s ease}
.renewal-card h3{font-size:18px;line-height:1.25;font-weight:900}
.renewal-card p{margin-top:9px;color:var(--muted);font-size:13px;line-height:1.5}
.renewal-actions{display:grid;gap:8px;margin-top:16px}
.renewal-actions button{min-height:48px;border-radius:13px;font-size:14px;font-weight:900}
.renewal-confirm{background:var(--accent);color:#fff}
.renewal-edit{border:1px solid var(--line2);background:var(--bg);color:var(--text)}
.loading{position:fixed;inset:0;display:none;place-items:center;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);z-index:30}
.loading.show{display:grid}
.spinner{width:38px;height:38px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sheetUp{from{transform:translateY(18px);opacity:.7}to{transform:translateY(0);opacity:1}}
@media (min-width:620px){
  .app{padding-top:26px}
  .bottom{left:50%;right:auto;transform:translateX(-50%);width:520px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}
}
@media (max-width:374px){
  .app{padding-left:11px;padding-right:11px}
  .plans,.benefits{grid-template-columns:1fr}
  h1{font-size:24px}
  .quote-amount{font-size:31px}
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <div class="kicker" id="kicker" style="display:none">HSK AI</div>
      <h1 id="title">HSK AI Pro</h1>
    </div>
    <div class="top-actions">
      <button class="help-btn" type="button" id="helpBtn" aria-label="Yordam"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><path d="M3 14v4a2 2 0 0 0 2 2h2v-8H5a2 2 0 0 0-2 2Zm18 0v4a2 2 0 0 1-2 2h-2v-8h2a2 2 0 0 1 2 2Z"/><path d="M17 20c0 2-2 3-5 3h-2"/><rect x="8" y="21" width="3" height="2" rx="1"/></svg></button>
    </div>
  </header>

  <div class="status" id="status"></div>
  <div class="steps" id="steps"><i></i><i></i><i></i><i></i></div>

  <section class="screen active" data-screen="country">
    <div class="hero">
      <h2 id="countryTitle"></h2>
      <p id="countryText"></p>
      <div class="list section" id="countries"></div>
    </div>
  </section>

  <section class="screen" data-screen="plans">
    <section class="section">
      <div class="section-head">
        <h3 id="plansTitle"></h3>
      </div>
      <p class="value-copy" id="valueText"></p>
      <div class="plans" id="plans"></div>
      <div class="renewal-summary" id="renewalSummary" style="display:none">
        <strong id="renewalCurrent"></strong>
        <span id="renewalNext"></span>
      </div>

function $(selector){return document.querySelector(selector)}
function $$(selector){return Array.from(document.querySelectorAll(selector))}
function tr(){return I18N[state.lang]||I18N.uz}
function normalizeMode(value){
  const mode=String(value||"subscription").toLowerCase();
  return MODE_ORDER.includes(mode)?mode:"subscription";
}
function positiveParam(value){
  const number=Number.parseInt(value||"",10);
  return Number.isFinite(number)&&number>0?number:null;
}
function normalizeLang(value){
  const lang=String(value||"").toLowerCase();
  if(lang==="tg"||lang==="tg-cyrl")return "tj";
  if(["uz","ru","tj"].includes(lang))return lang;
  return "uz";
}
function money(amount){
  const raw=String(amount??"").trim();
  const numeric=Number(raw.replace(/\s/g,""));
  if(Number.isFinite(numeric))return numeric.toLocaleString("ru-RU");
  return raw||"...";
}
function planName(text,plan){
  const labels=text.planLabels||{};
  return ({"10_days":labels.ten,"1_month":labels.month,"3_months":labels.quarter,"hsk30_unlock":labels.hsk30||"HSK 3.0"})[plan]||plan;
}
function renewalDates(){
  if(!state.overview?.access?.is_paid)return null;
  const expiry=new Date(state.overview.access.expires_at||"");
  const days=({"10_days":10,"1_month":30,"3_months":90})[state.plan];
  if(!Number.isFinite(expiry.getTime())||!days)return null;
  const locale=({uz:"uz-UZ",ru:"ru-RU",tj:"tg-TJ"})[state.lang]||"uz-UZ";
  const format=date=>new Intl.DateTimeFormat(locale,{day:"numeric",month:"short",year:"numeric"}).format(date);
  return {current:format(expiry),next:format(new Date(expiry.getTime()+days*86400000))};
}
function planBadge(text,plan){
  const labels=text.planLabels||{};
  return ({"10_days":labels.fast,"1_month":labels.best,"3_months":labels.quarterBadge,"hsk30_unlock":""})[plan]||labels.best;
}
function priceInfo(method=state.method,plan=state.plan){
  const real=state.overview?.prices?.[method]?.[plan];
  if(real)return real;
  return state.preview?mockOverview().prices?.[method]?.[plan]||null:null;

/* Sekin internetda so'rov cheksiz osilib qolmasin: timeout bo'lmasa
   foydalanuvchi aylanayotgan spinnerdan boshqa hech narsa ko'rmaydi. */
const API_TIMEOUT_MS=45000;
const SUBMIT_TIMEOUT_MS=120000;
function api(path,body,timeoutMs){
  const limit=timeoutMs||API_TIMEOUT_MS;
  const controller=typeof AbortController==="function"?new AbortController():null;
  const timer=controller?setTimeout(()=>controller.abort(),limit):null;
  const clear=()=>{if(timer)clearTimeout(timer)};
  return fetch(path,{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Telegram-Init-Data":INIT_DATA},
    body:JSON.stringify(body||{}),
    signal:controller?controller.signal:undefined
  }).catch(error=>{
    clear();
    /* Tarmoq xatosi brauzerdan inglizcha keladi ("Failed to fetch") —
       foydalanuvchiga o'z tilidagi sabab ko'rsatiladi. */
    throw apiError(error&&error.name==="AbortError"?"request_timeout":"network_error");
  }).then(async response=>{
    clear();
    const data=await response.json().catch(()=>({ok:false,error:"bad_json"}));
    if(!response.ok||!data.ok)throw apiError(data.error||"api_error",data.support_url,data.reason);
    return data;
  });
}
/* Xato matni bilan birga KODI ham saqlanadi: ekranda admin kontaktini
   ko'rsatish yoki ko'rsatmaslik shu kodga qarab hal qilinadi. */
function apiError(code,supportUrl,reason){
  const error=new Error(errorText(code));
  error.code=code;
  if(supportUrl)error.supportUrl=supportUrl;
  if(reason)error.reason=reason;
  return error;
}
function errorText(code){
  const text=tr();
  const errors={
    invalid_telegram_init_data:text.invalidTelegram,
    payment_details_missing:text.paymentDetailsMissing,
    admin_notification_failed:text.adminNotificationFailed,
    qr_not_ready:text.qrMissing,
    payment_invalid_plan:text.offerExpired,
    access_start_first:text.invalidTelegram,
    invalid_screenshot:text.screenshotInvalid,
    user_blocked:text.userBlocked,
    payment_submit_failed:text.serverError,
    /* JSON o'rniga gateway HTML sahifasi qaytgan holat (502/504). */
    bad_json:text.serverError,
    network_error:text.networkError,
    request_timeout:text.timeoutError,
    api_error:text.error
  };
  return errors[code]||text.error;
}

      $("#countries").innerHTML=`<div class="detail-empty"><span>${text.pricesUnavailable}</span><br><button class="retry-inline" type="button" data-retry-overview>${text.retryPrices}</button></div>`;
    }else{

    return;
  }
  $("#countries").innerHTML=regions.map(region=>{

    return `<button class="choice ${selected}" type="button" data-region="${region}">
      <i class="country-flag">${REGION_FLAGS[region]}</i>

    </button>`;
  }).join("");
}
function renderPay(text){
  const quote=state.quote||(state.preview?mockQuote():null);
  /* Sarlavha va umumiy matn olib tashlandi: faqat yopiq darsdan kelganlarga
     «to'lov tasdiqlangach darsingiz ochiladi» matni qoladi. */
  $("#payText").textContent=isLockedLessonSource()?text.lockedPayText:"";

  }
  $("#amountValue").textContent=money(quote.pay_amount);
  $("#amountCurrency").textContent=quote.pay_currency||"";
  const oldAmount=quote.pay_base_amount??quote.base_amount;
  const oldCurrency=quote.pay_base_currency||quote.base_currency||quote.pay_currency||"";
  const hasOldAmount=Boolean(quote.discount_applied&&oldAmount&&(`${oldAmount}`!==`${quote.pay_amount}`||oldCurrency!==quote.pay_currency));
  $("#amountOld").textContent=hasOldAmount?`${money(oldAmount)} ${oldCurrency}`:"";
  $("#amountOld").classList.toggle("show",hasOldAmount);
  const rows=[[text.rows.plan,planName(text,state.plan)]];
  if(state.method==="visa"){
    rows.push([text.rows.bank,CARD_BANK_NAMES[cardBank()]]);
    if(state.country!=="tj"&&quote.exchange_rate)rows.push([text.rows.rate,quote.exchange_rate]);
  }
  $("#summaryRows").innerHTML=rows.map(row=>`<div class="row"><span>${row[0]}</span><strong>${row[1]}</strong></div>`).join("");
  if(state.method==="visa"){
    /* Faqat quote'dagi rekvizit: overview'dagisi boshqa bankniki bo'lishi mumkin. */
    $("#paymentBox").innerHTML=renderPaymentDetails(quote.payment_details||"",text);
  }else if(quote.qr?.available&&quote.qr?.image_data_url){
    $("#paymentBox").innerHTML=`<h4>${text.qrTitle}</h4>
      <button class="qr qr-tappable" type="button" data-qr-toggle aria-label="${escapeAttr(text.downloadQr)}">
        <img src="${quote.qr.image_data_url}" alt="QR">
      </button>
      <p class="qr-hint">${text.qrTapHint}</p>
      <div class="qr-actions ${state.qrActionsOpen?"show":""}">
        <div class="qr-actions-inner">
          <button class="qr-download" type="button" data-open-qr-preview>${text.downloadQr}</button>
        </div>
      </div>`;
  }else{
    $("#paymentBox").innerHTML=`<h4>${text.qrTitle}</h4><div class="qr empty">${text.qrMissing}</div>`;
  }
  renderUploadBox(text);
}
/* Screenshot qatori: tanlangan rasmning HAQIQIY hajmi, yoki rad etilgan
   bo'lsa — sababi va nima qilish kerakligi. Toast 2 soniyada yo'qoladi,
   bu qator esa foydalanuvchi boshqa rasm tanlagunicha turadi. */
function renderUploadBox(text){
  const hasShot=Boolean(state.screenshotDataUrl);
  $("#uploadTitle").textContent=state.screenshotName?text.uploaded.replace("{name}",state.screenshotName):text.uploadTitle;
  $("#uploadText").textContent=state.screenshotNote||(hasShot?screenshotSizeNote(text):text.uploadText);
  $("#uploadPlus").textContent=hasShot?"✓":"+";
  $("#uploadBox").classList.toggle("ready",hasShot);
}
function screenshotSizeNote(text){
  const bytes=dataUrlBytes(state.screenshotDataUrl);
  const size=formatBytes(bytes);
  /* Siqishdan keyin ham og'ir qolgan rasm sekin internetda uzoq ketadi —
     foydalanuvchi buni yuborishdan OLDIN bilsin. */
  const template=bytes>SCREENSHOT_HEAVY_BYTES?text.screenshotHeavy:text.screenshotReady;
  return template.replace("{size}",size);
}
function dataUrlBytes(dataUrl){
  const base64=String(dataUrl||"").split(",")[1]||"";
  if(!base64)return 0;
  const padding=base64.endsWith("==")?2:(base64.endsWith("=")?1:0);
  return Math.max(0,Math.floor(base64.length*3/4)-padding);
}
function dataUrlMime(dataUrl){
  const match=/^data:([^;,]+)/i.exec(String(dataUrl||""));
  return match?match[1]:"";
}
function formatBytes(bytes){
  if(bytes>=1024*1024)return (bytes/1048576).toFixed(1)+" MB";
  return Math.max(1,Math.round(bytes/1024))+" KB";
}
function currentQrImage(){
  return state.quote?.qr?.image_data_url||"";
}
function renderQrPreview(text){
  const image=currentQrImage();
  const visible=Boolean(state.qrPreviewOpen&&image);
  $("#qrPreview").classList.toggle("show",visible);
  $("#qrPreview").setAttribute("aria-hidden",visible?"false":"true");
  $("#qrPreviewTitle").textContent=text.qrTitle;
  $("#qrPreviewImg").src=visible?image:"";
  $("#qrPreviewBackBtn").textContent=text.back;
}
function escapeHtml(value){
  return String(value||"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
}
function escapeAttr(value){
  return escapeHtml(value).replace(/`/g,"&#96;");
}
function paymentDetailRows(details){
  return String(details||"")
    .split(/\n+/)
    .map(line=>line.trim())
    .filter(Boolean)
    .map(line=>{
      const match=line.match(/\+?\d[\d\s\-()]{7,}\d/);
      const copyValue=match?match[0].replace(/\D/g,""):"";
      return {line,copyValue:copyValue.length>=8?copyValue:""};
    });
}
function cardInstructionText(text){
  const hints=text.cardHints||{};
  if(state.country!=="tj")return hints.foreign||text.detailsHint;
  if(cardBank()==="alif")return hints.alif||text.detailsHint;
  return hints.tj||text.detailsHint;
}
function renderPaymentDetails(details,text){
  const rows=paymentDetailRows(details);
  if(!rows.length){
    return `<h4>${text.detailsTitle}</h4><div class="detail-empty">${text.noDetails}</div>`;
  }
  const instruction=escapeHtml(cardInstructionText(text));
  /* Tojikiston kartasi (DC City / Alif) yo'riqnomasi qisqa va qadamma-qadam —
     doim to'liq ko'rinadi. Boshqa davlat kartasiniki uzun, u yig'iq turadi. */
  const hint=state.country==="tj"
    ?`<div class="detail-hint"><span class="detail-hint-text">${instruction}</span></div>`
    :`<button class="detail-hint ${state.detailHintOpen?"":"collapsed"}" type="button" data-detail-hint-toggle>
      <span class="detail-hint-text">${instruction}</span>
      <span class="detail-hint-more">${escapeHtml(state.detailHintOpen?(text.showLess||"Less"):(text.showMore||"More"))}</span>
    </button>`;
  return `<h4>${text.detailsTitle}</h4>
    ${hint}
    <div class="detail-list">
      ${rows.map(row=>`<div class="detail-row ${row.copyValue?"copyable":""}">
        <span>${escapeHtml(row.line)}</span>
        ${row.copyValue?`<button class="copy-detail" type="button" data-copy-detail data-copy-value="${escapeAttr(row.copyValue)}">${text.copyValue}</button>`:""}
      </div>`).join("")}
    </div>`;
}

  const node=$("#toast");

  clearTimeout(window.toastTimer);

}

/* To'lov so'rovi yiqilganda foydalanuvchi ekranda admin kontaktini ko'rsin:
   aks holda u nima bo'lganini hech kimga ayta olmay chiqib ketadi va admin
   nosozlikdan xabarsiz qoladi. O'zi darhol tuzata oladigan holat (boshqa
   rasm tanlash) bundan mustasno. */
const SUPPORT_SKIP_CODES=["invalid_screenshot"];
/* Server rad etgan rasm: sabab kodi `reason` da keladi. */
function serverScreenshotNote(error){
  const text=tr();
  const bytes=dataUrlBytes(state.screenshotDataUrl);
  /* Hajm chegaradan kichik bo'lsa "juda katta" deyish foydalanuvchini
     chalg'itadi — unda umumiy matn qoladi. */
  if(error&&error.reason==="too_big"&&bytes>SCREENSHOT_MAX_BYTES){
    return text.screenshotTooBig.replace("{size}",formatBytes(bytes));
  }
  if(error&&error.reason==="format"){
    return text.screenshotFormat.replace("{type}",dataUrlMime(state.screenshotDataUrl)||"?");
  }
  return text.screenshotInvalid;
}
function offerSupport(error){
  const code=(error&&error.code)||"";
  if(SUPPORT_SKIP_CODES.indexOf(code)>=0)return;
  if(error&&error.supportUrl)state.supportUrl=error.supportUrl;
  if(!state.supportUrl)return;
  const reason=(error&&error.message)||tr().error;
  /* Kod ham qo'shiladi: foydalanuvchi xabarni adminga yuborganda qaysi
     nosozlik bo'lgani taxmin qilinmaydi, aniq ko'rinadi. */
  state.supportReason=code?`${reason} [${code}]`:reason;
  state.supportOpen=true;
}
async function copyText(value,successMessage,failedMessage){
  if(!value){toast(tr().error);return false}
  try{
    if(navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(value);
    }else{
      const input=document.createElement("textarea");
      input.value=value;
      input.setAttribute("readonly","");
      input.style.position="fixed";
      input.style.left="-9999px";
      document.body.appendChild(input);
      input.select();
      const copied=document.execCommand("copy");
      input.remove();
      if(!copied)throw new Error("copy_failed");
    }
    toast(successMessage);
    return true;
  }catch(error){
    toast(failedMessage);
    return false;
  }
}
async function copyReferralLink(link){
  const copied=await copyText(link,tr().copied,tr().copyFailed);

async function submitPayment(){
  if(!state.screenshotDataUrl){
    toast(tr().needScreenshot);
    return;
  }
  if(!state.preview&&!state.quote){
    toast(state.quoteError||tr().quoteError);
    return;
  }
  if(state.preview){
    toast(tr().previewSubmit);
    return;
  }
  setBusy(true);
  try{
    const data=await api(API.submit,{
      ...contextPayload(),
      plan_type:state.plan,
      payment_method:state.method,
      card_country:state.method==="visa"?state.country:null,
      card_bank:state.method==="visa"?cardBank():null,
      screenshot_data_url:state.screenshotDataUrl
    },SUBMIT_TIMEOUT_MS);
    state.pending=Boolean(data.already_pending);
    state.pendingPayment=data.already_pending?data:null;
    state.done=!state.pending;
    try{sessionStorage.removeItem("hsk_subscription_attempt_v1")}catch(e){}
    state.step=0;
  }catch(error){
    /* Server rasmni rad etsa — sababi (format yoki hajm) bo'yicha aynan
       nima qilish kerakligi aytiladi va bu qator toast o'chgach ham qoladi. */
    const note=error&&error.code==="invalid_screenshot"?serverScreenshotNote(error):"";
    toast(note||error.message||tr().error);
    if(note){
      state.screenshotDataUrl="";
      state.screenshotName="";
      state.screenshotNote=note;
    }
    offerSupport(error);
  }finally{
    setBusy(false);
    render();
  }
}

function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("read"));
    reader.onload=()=>resolve(String(reader.result||""));
    reader.readAsDataURL(file);
  });
}
/* Telefon rasmi canvasda siqiladi. Asosiy chek — 8MB server chegarasi emas,
   YUKLASH VAQTI: sekin mobil internetda 300KB dan katta so'rov gateway
   timeoutiga borib "Xatolik yuz berdi" bo'lib qaytardi. Shuning uchun
   pog'onali siqish: karta raqami o'qiladigan eng kichik hajm tanlanadi. */
const SCREENSHOT_TARGET_CHARS=300*1024;
/* Server chegarasi DEKODLANGAN baytda o'lchanadi (MAX_SCREENSHOT_BYTES),
   base64 satri esa ~1.33 barobar uzun — shuning uchun bu yerda ham bayt. */
const SCREENSHOT_MAX_BYTES=8*1024*1024;
/* Siqish ishlaganda hajm ~300KB dan oshmaydi. Bundan kattasi — canvas
   siqa olmagan holat, ya'ni yuborish sekin internetda uzoq davom etadi. */
const SCREENSHOT_HEAVY_BYTES=600*1024;
const SCREENSHOT_STEPS=[[1280,0.72],[1100,0.65],[900,0.6],[720,0.55]];
function allowedShot(dataUrl){
  return /^data:image\/(jpeg|jpg|png|webp);base64,/i.test(dataUrl||"");
}
function compressDataUrl(dataUrl){
  return new Promise(resolve=>{
    const img=new Image();
    img.onerror=()=>resolve(dataUrl);
    img.onload=()=>{
      try{
        let best="";
        for(const step of SCREENSHOT_STEPS){
          const max=step[0],quality=step[1];
          const scale=Math.min(1,max/Math.max(img.width,img.height));
          const w=Math.max(1,Math.round(img.width*scale));
          const h=Math.max(1,Math.round(img.height*scale));
          const canvas=document.createElement("canvas");
          canvas.width=w;canvas.height=h;
          const ctx=canvas.getContext("2d");
          if(!ctx)break;
          ctx.drawImage(img,0,0,w,h);
          const out=canvas.toDataURL("image/jpeg",quality);
          if(!out||out.length<=60)break;
          best=out;
          if(out.length<=SCREENSHOT_TARGET_CHARS)break;
        }
        if(!best){resolve(dataUrl);return}
        /* Kichik rasm qayta kodlanganda kattalashib ketishi mumkin —
           faqat allowed formatdagi asl nusxa kichik bo'lsa o'sha qoladi. */
        resolve(allowedShot(dataUrl)&&dataUrl.length<best.length?dataUrl:best);
      }catch(e){resolve(dataUrl);}
    };
    img.src=dataUrl;
  });
}
/* Rasm rad etilganda sabab AYNAN aytiladi: format, hajm yoki o'qish
   xatosi — har biri o'z matni va nima qilish kerakligi bilan. */
function rejectScreenshot(note){
  state.screenshotDataUrl="";
  state.screenshotName="";
  state.screenshotNote=note;
  toast(note);
  render();
}
$("#receiptInput").addEventListener("change",async event=>{
  const file=event.target.files?.[0];
  if(!file)return;
  const text=tr();
  if(!file.type.startsWith("image/")){
    rejectScreenshot(text.screenshotFormat.replace("{type}",file.type||"?"));
    event.target.value="";
    return;
  }
  try{
    const raw=await readFileAsDataUrl(file);
    const shot=await compressDataUrl(raw);
    /* Server faqat jpeg/png/webp va 8MB gacha qabul qiladi. Ilgari bunday
       rasm faqat "Фиристодан" bosilgandan keyin, umumiy xato matni bilan
       rad etilardi — endi sabab darhol va aniq aytiladi. */
    if(!allowedShot(shot)){
      rejectScreenshot(text.screenshotFormat.replace("{type}",file.type||"?"));
      return;
    }
    if(dataUrlBytes(shot)>SCREENSHOT_MAX_BYTES){
      rejectScreenshot(text.screenshotTooBig.replace("{size}",formatBytes(dataUrlBytes(shot))));
      return;
    }
    state.screenshotDataUrl=shot;
    state.screenshotName=file.name;
    state.screenshotNote="";
    trackSubscriptionStage("payment_receipt_selected");
    render();
  }catch(err){
    rejectScreenshot(text.screenshotReadFailed);
  }finally{
    event.target.value="";
  }
});
