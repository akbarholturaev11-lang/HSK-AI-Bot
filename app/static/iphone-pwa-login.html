<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HSK AI</title>
<link rel="stylesheet" href="/course_v3_data/design-tokens.css">
<style>
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--hsk-paper);color:var(--hsk-ink);font-family:var(--hsk-font-ui);-webkit-font-smoothing:antialiased}
.shell{min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.head{width:100%;max-width:390px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:19px;font-weight:650;color:var(--hsk-cinnabar-ink)}
.language{min-width:72px;height:36px;background:var(--hsk-card-surface);border:1px solid var(--hsk-divider);color:var(--hsk-ink);border-radius:18px;padding:0 12px;font:500 13px var(--hsk-font-ui)}
main{width:100%;max-width:390px;margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 0 24px}
.sign{width:84px;height:84px;display:grid;place-items:center;border-radius:24px;background:var(--hsk-cinnabar-soft);color:var(--hsk-cinnabar-ink);font-size:48px;font-weight:650;margin-bottom:30px}
h1{font-size:28px;line-height:1.15;margin:0 0 12px;font-weight:650}
.actions{width:100%;display:grid;gap:12px;margin-top:40px}
.provider{height:48px;border:1px solid var(--hsk-divider);background:var(--hsk-paper-raised);color:var(--hsk-ink);border-radius:14px;font:600 14px var(--hsk-font-ui);cursor:pointer}
.provider:focus-visible,.language:focus-visible{outline:3px solid var(--hsk-jade);outline-offset:3px}
.provider:disabled{opacity:.55;cursor:default}
#status{font-size:13px;line-height:1.5;color:var(--hsk-ink-secondary);margin:28px 0 0;min-height:20px}
#status[role="alert"]{color:var(--hsk-cinnabar-ink)}
[hidden]{display:none!important}
</style>
<script defer src="/course_v3_data/hsk-common-i18n.js"></script>
<script defer src="/iphone-pwa-login.js"></script>
</head><body><div class="shell">
<header class="head"><div class="brand">HSK AI</div>
<select id="language" class="language" aria-label="Language">
<option value="uz">UZ</option><option value="ru">RU</option><option value="tj">TJ</option>
</select></header>
<main>
<div class="sign" aria-hidden="true">学</div>
<h1 id="title">HSK AI</h1>
<div class="actions" id="actions" hidden>
<button type="button" class="provider" data-provider="google"></button>
<button type="button" class="provider" data-provider="apple"></button>
</div>
<p id="status" aria-live="polite"></p>
</main></div></body></html>
