<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/course_v3_data/hsk-course-i18n.js?v=20261020-779fc95f8460"></script>
  <meta name="theme-color" content="#FDF9F0">
  <title>Tayyor gaplar · HSK AI</title>
  <link rel="stylesheet" href="/course_v3_data/design-tokens.css?v=20261005-section-title">
  <style>
    :root {
      color-scheme: light;
      --paper: var(--hsk-paper);
      --card: var(--hsk-paper-raised);
      --ink: var(--hsk-ink);
      --ink-soft: var(--hsk-ink-secondary);
      --ink-muted: var(--hsk-ink-disabled);
      --line: var(--hsk-divider);
      --accent-ink: var(--hsk-cinnabar-ink);
      --accent-soft: var(--hsk-cinnabar-soft);
      --gold: var(--hsk-gold);
      --gold-ink: var(--hsk-gold-ink);
      --gold-soft: var(--hsk-gold-soft);
      --focus: var(--hsk-cinnabar);
      font-family: var(--hsk-font-ui);
      background: var(--paper);
      color: var(--ink);
    }
    :root[data-hsk-theme="dark"] {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: var(--paper); }
    body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    /* The parent Mini App owns the native Telegram safe top inset. */
    html.hsk-embedded body { padding-top: 0; }
    html.hsk-embedded .page { padding-top: 8px; }
    button, input { font: inherit; }
    button { color: inherit; }
    .page { width: min(100%, 620px); min-height: 100dvh; margin: 0 auto; padding: 12px 19px 28px; }
    .search { position: relative; display: block; }
    .search-icon { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: var(--ink-muted); font-size: 20px; pointer-events: none; }
    .search input { width: 100%; height: 49px; padding: 0 14px 0 43px; border: 1px solid var(--line); border-radius: 14px; outline: 0; background: var(--card); color: var(--ink); font-size: 16px; }
    .search input::placeholder { color: var(--ink-muted); }
    .search input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 17%, transparent); }
    .filters { display: flex; gap: 7px; overflow-x: auto; padding: 14px 1px 7px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; min-height: 35px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink-soft); font-size: 12px; font-weight: 650; white-space: nowrap; cursor: pointer; }
    .chip[aria-pressed="true"] { border-color: var(--hsk-cinnabar); background: var(--accent-soft); color: var(--accent-ink); }
    .count { padding: 4px 1px 9px; color: var(--ink-muted); font-size: 11px; font-weight: 650; letter-spacing: .045em; }
    .list { display: grid; gap: 9px; }
    .phrase { min-width: 0; padding: 15px 15px 12px; border: 1px solid var(--line); border-radius: 15px; background: var(--card); }
    .phrase-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .hanzi { margin: 0; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 27px; font-weight: 620; line-height: 1.4; overflow-wrap: anywhere; }
    .save { flex: 0 0 auto; width: 37px; height: 37px; margin: -4px -5px 0 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink-muted); font-size: 22px; line-height: 1; cursor: pointer; }
    .save[aria-pressed="true"] { color: var(--gold); }
    .pinyin { margin: 2px 0 0; color: var(--accent-ink); font-size: 13px; font-weight: 680; line-height: 1.45; overflow-wrap: anywhere; }
    .translation { margin: 6px 0 0; color: var(--ink-soft); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    .phrase-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 11px; padding-top: 9px; border-top: 1px solid var(--line); }
    .category { overflow: hidden; color: var(--ink-muted); font-size: 10px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .copy { flex: 0 0 auto; min-height: 32px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--ink-soft); font-size: 11px; font-weight: 700; cursor: pointer; }
    .empty, .error { padding: 43px 18px; border: 1px dashed var(--line); border-radius: 15px; color: var(--ink-soft); text-align: center; font-size: 13px; line-height: 1.5; }
    .error button { display: inline-block; margin-top: 12px; padding: 9px 15px; border: 0; border-radius: 10px; background: var(--ink); color: var(--paper); font-weight: 680; cursor: pointer; }
    .toast { position: fixed; z-index: 2; left: 50%; bottom: calc(21px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 12px; background: var(--ink); color: var(--paper); font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .16s, transform .16s; }
    .toast.on { transform: translate(-50%, 0); opacity: 1; }
    [hidden] { display: none !important; }
    @media (min-width: 600px) { .page { padding-right: 24px; padding-left: 24px; } .list { gap: 11px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <label class="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="query" type="search" autocomplete="off" enterkeyhint="search" maxlength="100">
    </label>
    <nav class="filters" id="filters" aria-label="Phrase categories"></nav>
    <div class="count" id="count" aria-live="polite"></div>
    <section class="list" id="list" aria-label="Phrases"></section>
    <div class="empty" id="empty" hidden></div>
    <div class="error" id="error" hidden></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (function () {
      "use strict";

      document.documentElement.classList.toggle("hsk-embedded",new URLSearchParams(location.search).get("embedded")==="1");
      var LANGUAGE = new URLSearchParams(location.search).get("lang") || "uz";
      if (!["uz", "ru", "tj"].includes(LANGUAGE)) LANGUAGE = "uz";
      var UI = {
        uz: {title:"Tayyor gaplar", search:"Xitoycha, pinyin yoki tarjima bo‘yicha qidiring", all:"Barchasi", saved:"Saqlanganlar", count:"{shown} / {total} ta gap", save:"Saqlash", savedOne:"Saqlandi", removed:"Saqlanganlardan olib tashlandi", copy:"Nusxalash", copied:"Nusxalandi", empty:"Bu qidiruvga mos gap topilmadi. Boshqa so‘z bilan qidiring.", noSaved:"Saqlangan gaplaringiz shu yerda ko‘rinadi.", loadError:"Gaplar jamlanmasi yuklanmadi. Internetga ulaning va qayta urinib ko‘ring.", retry:"Qayta urinish", storageError:"Saqlash imkoni bo‘lmadi. Telefon sozlamalarini tekshiring." },
        ru: {title:"Готовые фразы", search:"Поиск по китайскому, пиньиню или переводу", all:"Все фразы", saved:"Сохранённые", count:"{shown} из {total} фраз", save:"Сохранить", savedOne:"Сохранено", removed:"Удалено из сохранённых", copy:"Копировать", copied:"Скопировано", empty:"По этому запросу ничего не найдено. Попробуйте другие слова.", noSaved:"Сохранённые фразы появятся здесь.", loadError:"Не удалось загрузить фразы. Подключитесь к интернету и попробуйте ещё раз.", retry:"Повторить", storageError:"Не удалось сохранить. Проверьте настройки телефона." },
        tj: {title:"Ибораҳои омода", search:"Ҷустуҷӯ бо чинӣ, пинйин ё тарҷума", all:"Ҳама", saved:"Нигоҳдоштаҳо", count:"{shown} аз {total} ҷумла", save:"Нигоҳ доштан", savedOne:"Нигоҳ дошта шуд", removed:"Аз нигоҳдоштаҳо бардошта шуд", copy:"Нусха бардоштан", copied:"Нусха бардошта шуд", empty:"Барои ин ҷустуҷӯ ҷумла ёфт нашуд. Калимаи дигарро ҷӯед.", noSaved:"Ибораҳои нигоҳдоштаатон дар ин ҷо намоиш мешаванд.", loadError:"Ибораҳо бор нашуданд. Ба интернет пайваст шуда, боз кӯшиш кунед.", retry:"Аз нав кӯшиш кардан", storageError:"Захира карда нашуд. Танзимоти телефонро санҷед." }
      };
      /* UI-only local bundle; original UI[lang] values remain complete fallbacks. */
      var PHRASE_UI=(window.HSKAI_COURSE_I18N&&window.HSKAI_COURSE_I18N[LANGUAGE])||{};
      Object.keys(UI[LANGUAGE]).forEach(function(key){
        var value=PHRASE_UI["readyPhrases."+key];
        if(typeof value==="string"&&value)UI[LANGUAGE][key]=value;
      });
      var text = UI[LANGUAGE];
      var theme = new URLSearchParams(location.search).get("theme");
      if (theme === "dark") {
        document.documentElement.dataset.hskTheme = "dark";
        document.querySelector('meta[name="theme-color"]').content = "#002F49";
      }
      document.documentElement.lang = LANGUAGE;

      var elements = {
        query: document.getElementById("query"),
        filters: document.getElementById("filters"),
        count: document.getElementById("count"),
        list: document.getElementById("list"),
        empty: document.getElementById("empty"),
        error: document.getElementById("error"),
        toast: document.getElementById("toast")
      };
      var catalog = null;
      var currentFilter = "all";
      var savedIds = readSavedIds();
      var toastTimer = 0;

      // Keep the page named for assistive technologies without a redundant visible hero.
      document.title = text.title + " · HSK AI";
      document.querySelector(".page").setAttribute("aria-label", text.title);
      elements.query.placeholder = text.search;
      elements.query.setAttribute("aria-label", text.search);
      elements.filters.setAttribute("aria-label", text.all);
      elements.list.setAttribute("aria-label", text.title);

      function readSavedIds() {
        try {
          var value = JSON.parse(localStorage.getItem("hsk_ai_ready_phrases:v1") || "[]");
          return new Set(Array.isArray(value) ? value.filter(function (id) { return typeof id === "string"; }) : []);
        } catch (_) { return new Set(); }
      }

      function persistSavedIds() {
        try {
          localStorage.setItem("hsk_ai_ready_phrases:v1", JSON.stringify(Array.from(savedIds)));
          return true;
        } catch (_) {
          announce(text.storageError);
          return false;
        }
      }

      function announce(message) {
        elements.toast.textContent = message;
        elements.toast.classList.add("on");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { elements.toast.classList.remove("on"); }, 1600);
      }

      function normalize(value) {
        return String(value || "")
          .toLocaleLowerCase(LANGUAGE)
          .normalize("NFD")
          .replace(/\p{M}/gu, "")
          .replace(/[’‘ʻ`´]/g, "'")
          .replace(/[^\p{L}\p{N}一-鿿]/gu, "");
      }

      function queryTerms(value) {
        return String(value || "").trim().split(/\s+/).map(normalize).filter(Boolean);
      }

      function searchableFields(phrase) {
        return [phrase.zh, phrase.pinyin.replace(/ü/gi, "v")]
          .concat(Object.keys(phrase.translations).map(function (lang) { return phrase.translations[lang]; }))
          .map(normalize)
          .filter(Boolean);
      }

      function rank(phrase, terms) {
        var fields = searchableFields(phrase);
        var matches = terms.map(function (term) {
          if (fields.some(function (field) { return field === term; })) return 0;
          if (fields.some(function (field) { return field.indexOf(term) === 0; })) return 1;
          if (fields.some(function (field) { return field.indexOf(term) !== -1; })) return 2;
          return -1;
        });
        return matches.some(function (match) { return match < 0; }) ? -1 : Math.max.apply(null, matches);
      }

      function makeButton(className, label, handler) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = className;
        button.textContent = label;
        button.setAttribute("aria-label", label);
        button.addEventListener("click", handler);
        return button;
      }

      function createFilter(id, label) {
        var chip = makeButton("chip", label, function () {
          currentFilter = id;
          renderFilters();
          renderPhrases();
        });
        chip.setAttribute("aria-pressed", String(currentFilter === id));
        elements.filters.appendChild(chip);
      }

      function renderFilters() {
        elements.filters.replaceChildren();
        createFilter("all", text.all);
        createFilter("saved", text.saved);
        catalog.categories.forEach(function (category) {
          createFilter(category.id, category.labels[LANGUAGE]);
        });
      }

      function createPhraseCard(phrase, category) {
        var card = document.createElement("article");
        card.className = "phrase";
        var top = document.createElement("div");
        top.className = "phrase-top";
        var hanzi = document.createElement("p");
        hanzi.className = "hanzi";
        hanzi.lang = "zh";
        hanzi.textContent = phrase.zh;
        var isSaved = savedIds.has(phrase.id);
        var save = makeButton("save", isSaved ? "★" : "☆", function () {
          var wasSaved = savedIds.has(phrase.id);
          if (wasSaved) savedIds.delete(phrase.id); else savedIds.add(phrase.id);
          if (!persistSavedIds()) {
            if (wasSaved) savedIds.add(phrase.id); else savedIds.delete(phrase.id);
            return;
          }
          announce(wasSaved ? text.removed : text.savedOne);
          renderPhrases();
        });
        save.setAttribute("aria-label", isSaved ? text.savedOne : text.save);
        save.setAttribute("aria-pressed", String(isSaved));
        top.append(hanzi, save);

        var pinyin = document.createElement("p");
        pinyin.className = "pinyin";
        pinyin.textContent = phrase.pinyin;
        var translation = document.createElement("p");
        translation.className = "translation";
        translation.textContent = phrase.translations[LANGUAGE];
        var bottom = document.createElement("div");
        bottom.className = "phrase-bottom";
        var categoryLabel = document.createElement("span");
        categoryLabel.className = "category";
        categoryLabel.textContent = category.labels[LANGUAGE];
        var copy = makeButton("copy", text.copy, function () {
          copyText(phrase.zh).then(function () { announce(text.copied); }).catch(function () { announce(text.copy); });
        });
        bottom.append(categoryLabel, copy);
        card.append(top, pinyin, translation, bottom);
        return card;
      }

      function renderPhrases() {
        var query = queryTerms(elements.query.value);
        var visible = catalog.phrases.map(function (phrase, position) {
          return { phrase: phrase, rank: query.length ? rank(phrase, query) : 0, position: position };
        }).filter(function (item) {
          if (item.rank < 0) return false;
          if (currentFilter === "saved") return savedIds.has(item.phrase.id);
          return currentFilter === "all" || item.phrase.category_id === currentFilter;
        }).sort(function (a, b) {
          if (!query.length) return a.position - b.position;
          return a.rank - b.rank || a.position - b.position;
        });

        elements.list.replaceChildren();
        elements.count.textContent = text.count.replace("{shown}", String(visible.length)).replace("{total}", String(catalog.phrases.length));
        elements.empty.hidden = visible.length > 0;
        if (!visible.length) elements.empty.textContent = currentFilter === "saved" && !query ? text.noSaved : text.empty;
        visible.forEach(function (item) {
          var category = catalog.categories.find(function (entry) { return entry.id === item.phrase.category_id; });
          if (category) elements.list.appendChild(createPhraseCard(item.phrase, category));
        });
      }

      function copyText(value) {
        if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(value);
        return new Promise(function (resolve, reject) {
          var field = document.createElement("textarea");
          field.value = value;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          var copied = false;
          try { copied = document.execCommand("copy"); } catch (_) { copied = false; }
          field.remove();
          if (copied) resolve(); else reject(new Error("Clipboard unavailable"));
        });
      }

      function goBack() {
        if (new URLSearchParams(location.search).get("embedded") === "1" && window.parent !== window && window.parent.RESOURCE) {
          window.parent.RESOURCE.close(); return;
        }
        try { sessionStorage.setItem("hsk_v3_resource_return", "1"); } catch (_) {}
        if (new URLSearchParams(location.search).get("from") === "course-v3" && history.length > 1) {
          history.back();
          return;
        }
        location.replace("/course-v3.html?tab=mashq&lang=" + encodeURIComponent(LANGUAGE));
      }

      elements.query.addEventListener("input", renderPhrases);
      /* Edge swipe exits the phrasebook; category-chip horizontal scrolling remains available. */
      var edgeSwipe = null;
      document.addEventListener("touchstart", function (ev) {
        if (document.documentElement.classList.contains("hsk-embedded")) return;
        if (ev.touches.length !== 1 || ev.target.closest(".filters")) { edgeSwipe = null; return; }
        var t = ev.touches[0];
        edgeSwipe = t.clientX <= 28 ? { x: t.clientX, y: t.clientY } : null;
      }, { passive: true });
      document.addEventListener("touchend", function (ev) {
        if (document.documentElement.classList.contains("hsk-embedded")) return;
        var start = edgeSwipe; edgeSwipe = null;
        if (!start || !ev.changedTouches.length) return;
        var t = ev.changedTouches[0], dx = t.clientX - start.x, dy = t.clientY - start.y;
        if (dx >= 85 && Math.abs(dx) > Math.abs(dy) * 1.5) goBack();
      }, { passive: true });
      document.addEventListener("touchcancel", function () { edgeSwipe = null; }, { passive: true });
      function syncPhraseTelegramChrome() {
        var color = getComputedStyle(document.documentElement).getPropertyValue("--hsk-paper").trim() || "#FDF9F0";
        try {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", color);
          var app = window.Telegram && window.Telegram.WebApp;
          if (!app) return;
          if (typeof app.setHeaderColor === "function") app.setHeaderColor(color);
          if (typeof app.setBackgroundColor === "function") app.setBackgroundColor(color);
        } catch (_) {}
      }
      try {
        var webApp = window.Telegram && window.Telegram.WebApp;
        if (new URLSearchParams(location.search).get("embedded") !== "1") {
          if (webApp && webApp.ready) webApp.ready();
          syncPhraseTelegramChrome();
        }
        if (new URLSearchParams(location.search).get("embedded") !== "1" && webApp && webApp.BackButton) {
          webApp.BackButton.show();
          webApp.BackButton.onClick(goBack);
          window.addEventListener("pagehide", function () {
            if (typeof webApp.BackButton.offClick === "function") webApp.BackButton.offClick(goBack);
            webApp.BackButton.hide();
          }, { once: true });
        }
      } catch (_) { /* Standalone preview outside Telegram. */ }
      window.addEventListener("pageshow", function () {
        if (new URLSearchParams(location.search).get("embedded") === "1") return;
        syncPhraseTelegramChrome();
        try {
          var webApp = window.Telegram && window.Telegram.WebApp;
          if (webApp && webApp.BackButton) webApp.BackButton.show();
        } catch (_) {}
      });
      document.addEventListener("visibilitychange", function () {
        if (new URLSearchParams(location.search).get("embedded") !== "1" && document.visibilityState === "visible") syncPhraseTelegramChrome();
      });

      function loadCatalog() {
        elements.error.hidden = true;
        fetch("/course_v3_data/ready-phrases-v1.json", { cache: "force-cache" })
          .then(function (response) { if (!response.ok) throw new Error("phrasebook unavailable"); return response.json(); })
          .then(function (data) {
            if (!data || !Array.isArray(data.categories) || !Array.isArray(data.phrases)) throw new Error("phrasebook has invalid data");
            catalog = data;
            renderFilters();
            renderPhrases();
          })
          .catch(function () {
            elements.error.replaceChildren();
            var message = document.createElement("p");
            message.textContent = text.loadError;
            var retry = makeButton("retry", text.retry, loadCatalog);
            retry.id = "retry";
            elements.error.append(message, retry);
            elements.error.hidden = false;
          });
      }

      loadCatalog();
    })();
  </script>
</body>
</html>
