<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>AI Voice</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#211D17;--ink2:#665D50;--ink3:#A89E8E;--paper:#FDF9F0;--card:#FFFFFF;--line:#EAE0CC;--cin:#E04A40;--cin2:#B23530;--cinbg:#FDEBE7;--gold:#E9A916;--jade:#2FA06A;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#CDB792;font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--ink)}
button{font-family:inherit;border:none;background:none;color:inherit}
.han{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-weight:600;letter-spacing:1px}
.wrap{max-width:480px;margin:0 auto;height:100vh;height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column;padding-top:var(--safe-t)}
.bg{position:absolute;inset:0;z-index:0}
.bg svg{width:100%;height:100%}

/* ---- top bar ---- */
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 6px;flex:0 0 auto}
.ic{width:36px;height:36px;border-radius:50%;background:rgba(251,247,239,.82);border:1px solid rgba(120,95,60,.3);color:#5b4a33;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.tinfo{flex:1;min-width:0;text-align:center}
.tinfo .tn{font-size:15px;font-weight:600;color:#3c2f1d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tinfo .tc{font-size:12px;color:#5b4a33;margin-top:1px}

/* ---- panda stage: ~1/3 of screen ---- */
.stage{position:relative;z-index:2;flex:0 0 auto;height:clamp(170px,33vh,258px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px}
.charwrap{height:100%;aspect-ratio:1/1;max-width:100%;display:flex;align-items:center;justify-content:center}
.charwrap svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(60,44,20,.25))}
.mouth{transform-box:fill-box;transform-origin:center}
.speaking .mouth{animation:talk .34s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1.05)}}
.pd-breathe{animation:pdBreathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pdBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02) translateY(-2px)}}
.pd-blink{animation:pdBlink 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pdBlink{0%,90%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}}
.st{position:relative;z-index:2;flex:0 0 auto;min-height:18px;text-align:center;font-size:13px;line-height:1.35;padding:0 18px;color:#4a3c28;text-shadow:0 1px 0 rgba(255,250,240,.55)}

/* ---- chat ---- */
.chat{position:relative;z-index:2;flex:1 1 auto;min-height:96px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:6px 0 0;padding:14px 14px 6px;background:rgba(251,247,239,.9);backdrop-filter:blur(8px);border:none;border-top:1px solid rgba(120,95,60,.2);border-radius:22px 22px 0 0;box-shadow:0 -8px 20px rgba(60,44,20,.13);display:flex;flex-direction:column;gap:9px}
.hint0{text-align:center;font-size:13px;color:var(--ink2);padding:14px 8px}
.msg{display:flex;max-width:100%}
.msg.me{justify-content:flex-end}
.bub{max-width:84%;border-radius:15px;padding:9px 12px;line-height:1.4}
.msg.ai .bub{background:var(--card);border:1px solid var(--line);border-top-left-radius:6px}
.msg.me .bub{background:var(--cin);color:#fff;border-top-right-radius:6px}
.bub .zh{font-size:19px;color:var(--ink)}
.bub .py{font-size:13px;color:var(--cin2);font-weight:500;margin-top:3px}
.bub .tr{font-size:13px;color:var(--ink2);margin-top:2px}
.nosub .bub .py,.nosub .bub .tr{display:none}
.bub .ut{font-size:15px}
.bub .fx{font-size:12.5px;margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.32);color:#FFE7E4}
.bub .fx b{font-weight:600}
.rep{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;color:var(--ink3);padding:2px 0}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:#b3a382;animation:bl .9s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

/* ---- bottom dock ---- */
.dock{position:relative;z-index:3;flex:0 0 auto;margin:0;padding:10px 14px calc(14px + var(--safe-b));background:rgba(251,247,239,.96);backdrop-filter:blur(8px);border:none;border-top:1px solid rgba(120,95,60,.13)}
.tipbar{display:flex;justify-content:center;margin-bottom:9px}
.tip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--cin2);background:var(--cinbg);border:1px solid rgba(194,64,58,.2);border-radius:999px;padding:7px 14px}
.tip[hidden]{display:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sq{width:48px;height:48px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-size:21px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.micwrap{flex:1;display:flex;justify-content:center}
.mic{position:relative;width:78px;height:78px;border-radius:50%;background:var(--cin);color:#fff;border:3px solid rgba(251,247,239,.7);font-size:31px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.mic.rec{background:var(--cin2);transform:scale(1.06)}
.mic.rec:after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--cin);animation:pr 1.2s ease-out infinite}
@keyframes pr{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.mic[disabled]{opacity:.45}
.holdhint{text-align:center;font-size:11.5px;color:var(--ink3);margin-top:7px;height:14px}

/* ---- keyboard panel ---- */
.kb{display:none;gap:8px;align-items:flex-end}
.kb.on{display:flex}
.row.off{display:none}
.kb textarea{flex:1;min-height:46px;max-height:96px;resize:none;font-family:inherit;font-size:16px;line-height:1.35;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.kb textarea:focus{outline:none;border-color:rgba(194,64,58,.5)}
.kbsend{width:46px;height:46px;border-radius:14px;background:var(--cin);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.kbsend[disabled]{opacity:.4}
.kbclose{width:46px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-size:20px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}

/* ---- bottom sheet (settings / hints) ---- */
.sheet{position:absolute;inset:0;z-index:20;display:none}
.sheet.on{display:block}
.sheet .ov{position:absolute;inset:0;background:rgba(33,25,15,.5)}
.sheet .pane{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + var(--safe-b));max-height:76%;overflow-y:auto}
.sheet h4{font-size:16px;font-weight:600;margin-bottom:12px}
.sgrip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.srow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:8px;font-size:15px;color:var(--ink)}
.srow i:first-child{font-size:19px;color:var(--ink2);flex:0 0 auto}
.srow .sv{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:500}
.hitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.hitem .hz{font-size:19px;color:var(--ink)}
.hitem .hp{font-size:12.5px;color:var(--cin2);font-weight:500;margin-top:2px}
.hitem .hm{font-size:12.5px;color:var(--ink2);margin-top:1px}
.hitem .hb{margin-left:auto;font-size:19px;color:var(--ink3);flex:0 0 auto;padding:4px}
.hgrp{font-size:12px;font-weight:600;color:var(--ink3);margin:12px 0 7px}
.hgrp:first-child{margin-top:0}

/* ---- done / paywall (unchanged logic) ---- */
.done{position:absolute;inset:0;background:rgba(33,25,15,.55);backdrop-filter:blur(3px);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;z-index:30}
.done.on{display:flex}
.dcard{background:var(--paper);border-radius:22px;padding:26px 22px;width:100%}
.done .b{width:100%;background:var(--cin);color:#fff;border-radius:14px;padding:15px;font-size:16px;font-weight:500;margin-top:18px}
.done .b2{width:100%;color:var(--ink2);font-size:14px;padding:12px 0 2px}
.done p{font-size:14px;color:var(--ink2);margin:6px 0 0}
.done h3{font-size:21px;font-weight:500;margin:6px 0 0}
.dchar{width:130px;height:130px;margin:0 auto}
.pwwhy{display:flex;align-items:flex-start;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-top:14px;font-size:12.5px;line-height:1.5;color:var(--ink2);text-align:left}
.pwwhy i{color:var(--gold);font-size:17px;flex-shrink:0;margin-top:1px}
.pwwhy[hidden]{display:none}
.badge{display:inline-flex;align-items:center;gap:6px;margin:12px auto 0;padding:8px 14px;border-radius:999px;background:rgba(47,125,94,.12);border:1px solid rgba(47,125,94,.26);color:var(--jade);font-size:14px;font-weight:600}
.stats{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stat .n{font-size:22px;font-weight:600;line-height:1.1}
.stat .l{font-size:11px;color:var(--ink2);margin-top:2px}
.stat.g .n{color:var(--jade)}
.stat.m .n{color:var(--cin2)}
.dtoggle{width:100%;border:1px solid var(--line);border-radius:13px;color:var(--ink2);font-size:14px;font-weight:500;padding:12px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.tx{display:none;text-align:left;margin-top:12px;max-height:230px;overflow-y:auto}
.tx.on{display:block}
.txr{border-radius:12px;padding:9px 11px;margin-bottom:7px;line-height:1.4}
.txr.g{background:rgba(47,125,94,.08);border:1px solid rgba(47,125,94,.2)}
.txr.m{background:var(--cinbg);border:1px solid rgba(194,64,58,.2)}
.txr .u{font-size:13px;color:var(--ink)}
.txr .u b{color:var(--ink3);font-weight:600}
.txr .fx{font-size:12.5px;color:var(--cin2);margin-top:4px}
.txr .fx b{font-weight:600}
.txr .ai{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.txr .ai .lbl{font-size:11px;color:var(--ink3);font-weight:600;margin-bottom:2px}
.txr .ai .azh{font-size:15px;color:var(--ink);line-height:1.4}
.txr .ai .apy{font-size:12.5px;color:var(--cin2);font-weight:500;margin-top:1px}
.txr .ai .atr{font-size:12.5px;color:var(--ink2);margin-top:1px}
.savednote{font-size:12px;color:var(--ink2);text-align:center;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:5px}
@media (max-height:640px){.stage{height:clamp(140px,26vh,190px)}.mic{width:66px;height:66px;font-size:27px}.sq{width:44px;height:44px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bg" id="bg"></div>

  <div class="top">
    <button class="ic" onclick="endCall()" aria-label="yopish"><i class="ti ti-x"></i></button>
    <div class="tinfo"><div class="tn" id="nm">阿宝 · Aobao</div><div class="tc" id="cnt">对话 1 / 7</div></div>
    <button class="ic" onclick="openSettings()" aria-label="sozlamalar"><i class="ti ti-settings"></i></button>
  </div>

  <div class="stage"><div class="charwrap speaking" id="char"></div></div>
  <div class="st" id="status"></div>

  <div class="chat" id="chat"><div class="hint0" id="chat0"></div></div>

  <div class="dock">
    <div class="tipbar"><button class="tip" id="tip" onclick="openHints()"><i class="ti ti-bulb"></i> <span id="tipt"></span></button></div>

      <button class="sq" onclick="openKb()" aria-label="klaviatura"><i class="ti ti-keyboard"></i></button>

      <div class="sq" style="visibility:hidden"></div>
    </div>
    <div class="kb" id="kbPanel">
      <button class="kbclose" onclick="closeKb()" aria-label="yopish"><i class="ti ti-microphone"></i></button>
      <textarea id="kbText" rows="1" maxlength="200"></textarea>
      <button class="kbsend" id="kbSend" onclick="sendText()" aria-label="yuborish"><i class="ti ti-send"></i></button>
    </div>
    <div class="holdhint" id="holdhint"></div>
  </div>

  <div class="sheet" id="setSheet"><div class="ov" onclick="closeSettings()"></div><div class="pane">
    <div class="sgrip"></div>
    <h4 id="setTitle"></h4>
    <button class="srow" onclick="swap()"><i class="ti ti-repeat"></i><span id="setPersona"></span><span class="sv" id="setPersonaV"></span></button>
    <button class="srow" onclick="toggleSub()"><i class="ti ti-badge-cc"></i><span id="setSub"></span><span class="sv" id="setSubV"></span></button>

  </div></div>

  <div class="sheet" id="hintSheet"><div class="ov" onclick="closeHints()"></div><div class="pane">
    <div class="sgrip"></div>
    <h4 id="hintTitle"></h4>
    <div id="hintBody"></div>
  </div></div>

  <div class="done" id="done"><div class="dcard">
    <div class="dchar" id="dchar"></div>
    <h3 id="dh"></h3><p id="dp"></p>
    <div class="badge" id="dbadge"><i class="ti ti-sparkles"></i> <span id="dbadget"></span></div>
    <div class="stats" id="dstats"></div>
    <button class="dtoggle" id="dtoggle" onclick="toggleDialog()"><i class="ti ti-messages" id="dtoggleic"></i> <span id="dtogglet"></span></button>
    <div class="tx" id="dtx"></div>
    <div class="savednote" id="dsaved"></div>
    <button class="b" onclick="reset()"><i class="ti ti-refresh"></i> <span id="db"></span></button>
    <button class="b2" onclick="goBack()" id="db2"></button>
  </div></div>

  <div class="done" id="paywall"><div class="dcard">
    <div class="dchar" id="pwchar"></div>
    <h3 id="pwh"></h3><p id="pwp"></p>
    <div class="pwwhy" id="pwwhy" hidden><i class="ti ti-info-circle"></i><span id="pwwhyt"></span></div>
    <button class="b" onclick="goPremium()"><i class="ti ti-crown"></i> <span id="pwb"></span></button>
    <button class="b2" onclick="goBack()" id="pwb2"></button>
  </div></div>
</div>

    var opts={audioBitsPerSecond:32000};if(mime)opts.mimeType=mime;
    try{mediaRecorder=new MediaRecorder(stream,opts)}catch(_){mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}
    mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size>0)chunks.push(e.data)};
    mediaRecorder.onstop=onStopped;mediaRecorder.start(250);recAt=Date.now();
    try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}
    mic.classList.add("rec");setChar("listen");setStatus(L.listening);setHold(L.releaseMic);
    clearTimeout(autoStop);autoStop=setTimeout(function(){holdAt=0;stopRecording()},MAX_REC_MS);
  }).catch(function(err){clog("mic_deny",(err&&err.name)||"",{});holdOk=false;mic.classList.remove("rec");setStatus(L.micDeny)});
}
function stopRecording(){
  clearTimeout(autoStop);mic.classList.remove("rec");holdOk=false;recAt=0;
  if(mediaRecorder&&mediaRecorder.state!=="inactive"){setChar("talk");setStatus(L.analyzing);setHold("");mediaRecorder.stop()}
}
function cancelRecording(){
  clearTimeout(autoStop);mic.classList.remove("rec");holdOk=false;recAt=0;chunks=[];
  try{if(mediaRecorder&&mediaRecorder.state!=="inactive"){mediaRecorder.onstop=null;mediaRecorder.stop()}}catch(e){}
  try{if(mediaStream)mediaStream.getTracks().forEach(function(t){t.stop()})}catch(e){}
  mediaStream=null;mediaRecorder=null;setChar("happy");
}
function stopHard(){clearTimeout(autoStop);holdAt=0;holdOk=false;recAt=0;try{if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop()}catch(e){}try{if(mediaStream)mediaStream.getTracks().forEach(function(t){t.stop()})}catch(e){}mediaStream=null}
function extFromMime(mt){mt=(mt||"").toLowerCase();if(/mp4|m4a|aac/.test(mt))return"mp4";if(/ogg/.test(mt))return"ogg";if(/mpeg|mp3/.test(mt))return"mp3";if(/wav/.test(mt))return"wav";return"webm"}
function onStopped(){
  var mt=(mediaRecorder&&mediaRecorder.mimeType)||"audio/webm";
  var blob=new Blob(chunks,{type:mt});
  try{if(mediaStream)mediaStream.getTracks().forEach(function(t){t.stop()})}catch(e){}mediaStream=null;
  if(blob.size<MIN_BYTES){setChar("happy");setStatus(L.tooShort);setHold(L.holdMic);return;}
  busy=true;micBusy(true);setChar("talk");setStatus(L.analyzing);addTyping();
  var _ext=extFromMime(blob.type||mt);
  var fd=new FormData();fd.append("initData",initData());fd.append("session_id",sess);fd.append("audio",blob,"voice."+_ext);
  fetch("/api/voice-practice/message",{method:"POST",body:fd}).then(jr)
    .then(function(o){busy=false;micBusy(false);dropTyping();var heard=(o&&o.j&&o.j.heard)||"";clog("mic_result",(o&&o.ok)?"ok":"fail",{mime:blob.type||mt,ext:_ext,size:blob.size,heard:(""+heard).slice(0,24)});if(!o.ok){onMsgError(o);return}renderReply(o.j)})
    .catch(function(){busy=false;micBusy(false);dropTyping();clog("mic_neterr","",{mime:blob.type||mt,ext:_ext,size:blob.size});setChar("happy");setStatus(L.sendErr);setHold(L.holdMic)});
}

/* ---- typed message ---- */
function sendText(){
  var t=$("kbText"),txt=(t.value||"").trim();
  if(busy||!txt)return;
  if(!started){startSession().then(function(ok){if(ok)sendText()});return;}
  t.value="";t.style.height="auto";syncSend();
  busy=true;micBusy(true);setChar("talk");setStatus(L.analyzing);
  addMe(txt,"");addTyping();
  var fd=new FormData();fd.append("initData",initData());fd.append("session_id",sess);fd.append("text",txt);
  fetch("/api/voice-practice/message",{method:"POST",body:fd}).then(jr)
    .then(function(o){busy=false;micBusy(false);dropTyping();if(!o.ok){onMsgError(o);return}renderReply(o.j,true)})
    .catch(function(){busy=false;micBusy(false);dropTyping();setChar("happy");setStatus(L.sendErr)});
}

function onMsgError(o){
  setChar("happy");setHold(L.holdMic);
  var code=o.j&&o.j.code;
  if(code==="LIMIT_EXCEEDED"){showPaywall();return;}
  if(code==="SESSION_NOT_FOUND"){started=false;sess=null;setStatus(L.sendErr);return;}
  setStatus(L.sendErr);
}
function renderReply(res,skipUser){
  if(!res){setStatus("");return;}
  turn=Number(res.turn_count)||turn+1;if(res.max_dialogs)maxDialogs=Number(res.max_dialogs);setCnt();
  if(!skipUser&&res.transcription)addMe(res.transcription,res.correction||"");
  else if(skipUser&&res.correction){var last=chatEl().querySelector(".msg.me:last-child .bub");
    if(last&&!last.querySelector(".fx")){var f=document.createElement("div");f.className="fx";f.innerHTML='<b>'+esc(L.fixLabel)+'</b> '+esc(res.correction);last.appendChild(f)}}
  addAi(res.chinese_reply||"",res.pinyin||"",res.translation||"");
  setChar("talk");setStatus(L.speaking);speak(res.chinese_reply||"");ring(persona==="li"?[523,659]:[587,740]);
  if(res.session_should_end){setTimeout(endCall,1300);return;}
  setTimeout(function(){if(started){setChar("happy");setStatus("");setHold(L.holdMic)}},1100);
}
function endCall(){
  closeSettings();closeHints();
  if(!started||!sess){showDoneResult({message_count:turn});return;}
  stopHard();stopSpeak();var sid=sess;started=false;sess=null;
  fetch("/api/voice-practice/session/end",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({initData:initData(),session_id:sid})}).then(function(r){return r.json()})
   .then(function(j){showDoneResult(j||{})})
   .catch(function(){showDoneResult({message_count:turn})});
}
function txRow(t){
  var good=!!t.good;
  var h='<div class="txr '+(good?"g":"m")+'"><div class="u"><b>'+L.heard+'</b> '+esc(t.user||"")+'</div>';
  if(!good&&t.correction)h+='<div class="fx"><b>'+L.fixLabel+'</b> '+esc(t.correction)+'</div>';
  if(t.assistant){
    h+='<div class="ai"><div class="lbl">'+esc(PERS[persona].name)+'</div>'
      +'<div class="azh han">'+esc(t.assistant)+'</div>';
    if(t.pinyin)h+='<div class="apy">'+esc(t.pinyin)+'</div>';
    if(t.translation)h+='<div class="atr">'+esc(t.translation)+'</div>';
    h+='</div>';
  }
  return h+'</div>';
}
function showDoneResult(j){
  j=j||{};
  var rw=j.reward||{};var xp=rw.xp_awarded||rw.xp||0;
  var count=Number(j.message_count)||turn||0;
  var tx=(j.transcript&&j.transcript.length)?j.transcript:[];
  var good=(typeof j.good_count==="number")?j.good_count:tx.filter(function(t){return t.good}).length;
  var bad=(typeof j.mistake_count==="number")?j.mistake_count:tx.filter(function(t){return !t.good}).length;
  $("dchar").innerHTML=chr("happy",persona);
  $("dh").textContent=L.doneTitle;
  $("dp").textContent=count+" "+L.replWord+(xp?(" · +"+xp+" XP"):"");
  $("dbadget").textContent=L.learnBadge;
  $("dstats").innerHTML='<div class="stat g"><div class="n">'+good+'</div><div class="l">'+L.statGood+'</div></div>'
    +'<div class="stat m"><div class="n">'+bad+'</div><div class="l">'+L.statMistake+'</div></div>';
  var body="";
  if(tx.length){tx.forEach(function(t){body+=txRow(t)})}
  $("dtx").innerHTML=body;$("dtx").classList.remove("on");
  var hasTx=tx.length>0;
  $("dtoggle").style.display=hasTx?"flex":"none";
  $("dtogglet").textContent=L.showDialog;$("dtoggleic").className="ti ti-messages";
  $("dsaved").innerHTML=bad>0
    ?('<i class="ti ti-bookmark"></i> '+esc(L.savedToMistakes))
    :(hasTx?('<i class="ti ti-circle-check"></i> '+esc(L.noMistakes)):"");
  $("db").textContent=L.again;$("db2").textContent=L.exit;
  $("done").classList.add("on");ring([659,784,988]);
}
function toggleDialog(){
  var tx=$("dtx"),on=tx.classList.toggle("on");
  $("dtogglet").textContent=on?L.hideDialog:L.showDialog;
  $("dtoggleic").className=on?"ti ti-chevron-up":"ti ti-messages";
}
function showPaywall(){
  $("pwchar").innerHTML=chr("happy",persona);
  $("pwh").textContent=L.limitTitle;$("pwp").textContent=L.limitSub;
  if(L.limitWhy){$("pwwhyt").textContent=L.limitWhy;$("pwwhy").hidden=false}else{$("pwwhy").hidden=true}
  $("pwb").textContent=L.premiumBtn;$("pwb2").textContent=L.exit;
  $("paywall").classList.add("on");
}
function goPremium(){location.href="/subscription.html?lang="+LANG}
function softReset(){
  started=false;sess=null;turn=0;lessonWords=[];reviewWords=[];
  closeKb();setName();setChar("happy");setStatus("");setHold(L.holdMic);chatClear();setCnt();
}
function reset(){$("done").classList.remove("on");softReset()}
function swap(){
  if(busy)return;
  stopHard();stopSpeak();closeSettings();
  if(sess){fetch("/api/voice-practice/session/end",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:initData(),session_id:sess})}).catch(function(){})}
  persona=(persona==="bao"?"li":"bao");softReset();
}
init();
</script>
