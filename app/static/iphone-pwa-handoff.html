<style>
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:var(--hsk-font-ui);background:var(--hsk-paper);color:var(--hsk-ink);-webkit-font-smoothing:antialiased}
.shell{min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 24px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.brand{width:100%;max-width:430px;min-height:38px;margin:0;display:flex;align-items:center;font-size:20px;font-weight:650;letter-spacing:-.3px}
.brand strong{color:var(--hsk-cinnabar);font-weight:inherit}
main{width:100%;max-width:430px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 0 48px}
.hero-panda{width:216px;height:216px;border-radius:50%;background:radial-gradient(circle,var(--hsk-cinnabar-soft) 0%,var(--hsk-paper) 74%);display:grid;place-items:center}
#panda{width:168px;height:185px}
#panda>.hsk-character{width:100%;height:100%}
/* Fixed slots: the message and the actions keep their place while the state
   changes, so nothing jumps between "signing in" and a choice. */
#status{min-height:72px;max-width:340px;margin:20px 0 0;font-size:17px;line-height:1.45;color:var(--hsk-ink)}
#status[data-busy="true"]{color:var(--hsk-ink-secondary)}
#actions{width:100%;min-height:124px;display:grid;gap:12px;align-content:start;margin-top:8px}
#actions button{width:100%;min-height:56px;border-radius:18px;border:1px solid var(--hsk-divider);background:var(--hsk-card-surface);color:var(--hsk-ink);font:600 16px var(--hsk-font-ui);cursor:pointer}
#actions button[data-primary="true"]{border-color:transparent;background:var(--hsk-cinnabar);color:#fff}
#actions button:active{transform:translateY(1px)}
#actions button:focus-visible{outline:3px solid var(--hsk-jade);outline-offset:3px}
#actions button[hidden]{display:none}
</style>
</head><body>
<div class="shell">
  <p class="brand">HSK&nbsp;<strong>AI</strong></p>
  <main>
    <div class="hero-panda"><div id="panda" aria-hidden="true"></div></div>
    <p id="status" role="status" aria-live="polite" data-busy="true"></p>
    <div id="actions">
      <button type="button" id="primary" data-primary="true" hidden></button>
      <button type="button" id="secondary" hidden></button>
    </div>
  </main>
</div>
