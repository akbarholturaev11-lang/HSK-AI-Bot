<title>HSK AI — Li</title>
<!-- Live Li onboarding visual shell, built from hash-verified user demo.
     Authentication, data readiness, persistence and trial use a verified
     platform adapter in li-onboarding-runtime.js. Reference remains in docs. -->
<style>
:root{
  --hsk-paper:#FDF9F0;--hsk-paper-raised:#FFFFFF;--hsk-card-surface:#FBF6ED;
  --hsk-ink:#211D17;--hsk-ink-secondary:#665D50;--hsk-divider:#EAE0CC;
  --hsk-cinnabar:#E04A40;--hsk-cinnabar-ink:#B23530;--hsk-cinnabar-soft:#FDEBE7;--hsk-on-cinnabar:#160C09;
  --hsk-gold-soft:#FAF0D3;--hsk-jade-soft:#E3F4EA;
  --hsk-font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--hsk-paper);color:var(--hsk-ink);font-family:var(--hsk-font-ui);-webkit-font-smoothing:antialiased}
button,select{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible{outline:3px solid var(--hsk-cinnabar-ink);outline-offset:3px}
button:disabled{cursor:default}
[hidden]{display:none!important}
/* Shared ink landscape, same asset/technique as app/static/assets/characters/hsk-scene-background.css */
body{isolation:isolate}

.wrap{width:100%;max-width:520px;margin:0 auto;height:100vh;height:100dvh;padding-top:var(--safe-t);display:flex;flex-direction:column;overflow:hidden}
.icon{width:24px;height:24px;display:block;flex-shrink:0}

.top{display:flex;align-items:center;gap:14px;padding:14px 20px 4px;min-height:62px;flex-shrink:0}
.bk{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--hsk-ink-secondary);border-radius:12px;flex-shrink:0}
.pbar{flex:1;height:8px;background:var(--hsk-divider);border-radius:20px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--hsk-cinnabar);border-radius:20px;transition:width .3s ease}
.spacer{flex:1}
.lang-control{height:38px;display:flex;align-items:center;gap:7px;padding:0 11px;border-radius:999px;background:var(--hsk-paper-raised);box-shadow:0 2px 7px rgba(33,29,23,.1);color:var(--hsk-ink-secondary)}
.lang-control .icon{width:18px;height:18px}
.language{border:0;background:transparent;color:var(--hsk-ink);font-weight:600;font-size:16px;min-width:42px}
.brand{font-size:20px;font-weight:650;letter-spacing:-.3px}
.brand strong{color:var(--hsk-cinnabar);font-weight:inherit}

#stage{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding-bottom:8px}

.bub{position:relative;background:var(--hsk-paper-raised);border:1px solid var(--hsk-divider);border-radius:18px;padding:15px 18px;font-size:17px;line-height:1.45}
.bub b{font-weight:650}
.guide{display:flex;align-items:center;gap:16px;padding:18px 24px 16px;flex-shrink:0}
.guide .panda{width:84px;height:94px;flex-shrink:0}
.guide .bub{flex:1}
.guide .bub:before{content:"";position:absolute;width:14px;height:14px;background:var(--hsk-paper-raised);border-left:1px solid var(--hsk-divider);border-bottom:1px solid var(--hsk-divider);transform:rotate(45deg);left:-8px;top:calc(50% - 7px)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 28px}
.center .bub{max-width:340px;margin-bottom:22px}
.center .bub:before{content:"";position:absolute;width:14px;height:14px;background:var(--hsk-paper-raised);border-left:1px solid var(--hsk-divider);border-bottom:1px solid var(--hsk-divider);transform:rotate(-45deg);left:calc(50% - 7px);bottom:-8px}
.center .panda{width:150px;height:164px}
.halo{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--halo,var(--hsk-cinnabar-soft)) 0%,rgba(253,249,240,0) 72%);display:grid;place-items:center;flex-shrink:0}
.halo--gold{--halo:var(--hsk-gold-soft)}.halo--jade{--halo:var(--hsk-jade-soft)}
.streak-scene{display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:2px 24px 10px;flex-shrink:0}
.streak-scene .flame{position:relative;width:118px;height:118px}
.streak-scene .flame svg{width:100%;height:100%}
.streak-scene .flame b{position:absolute;left:0;right:0;top:67%;transform:translateY(-50%);text-align:center;font-size:19px;letter-spacing:-.5px;font-weight:800;color:var(--hsk-cinnabar-ink)}
.streak-scene .panda{width:104px;height:114px}
.lv.plain{min-height:58px}
.lv.plain .glyph{display:none}
.lv .aside{font-size:13px;color:var(--hsk-ink-secondary);white-space:nowrap}
.lv.sel .aside{color:var(--hsk-cinnabar-ink)}
.focus-icon .icon{width:24px;height:24px;stroke-width:1.7;color:var(--hsk-ink-secondary)}
.lv.sel .focus-icon .icon{color:var(--hsk-cinnabar-ink)}
.time-num{font-size:20px;font-weight:750;color:var(--hsk-ink);font-variant-numeric:tabular-nums}
.lv.sel .time-num{color:var(--hsk-cinnabar-ink)}
.pro{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 28px 8px}
.pro{padding-top:0}.pro .halo{width:168px;height:168px;margin-top:6px}.pro .panda{width:124px;height:136px}
.pro h1{font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.4px;margin:6px 0 20px}
.pro h1 span{color:var(--hsk-cinnabar)}
.perks{list-style:none;display:grid;gap:16px;text-align:left;width:100%;max-width:340px}
.perks li{display:flex;align-items:center;gap:14px}
.perks .tile{width:44px;height:44px;border-radius:12px;background:var(--hsk-cinnabar-soft);color:var(--hsk-cinnabar-ink);display:grid;place-items:center;flex-shrink:0}
.perks b{display:block;font-size:16px;font-weight:650;line-height:1.3}
.perks small{display:block;font-size:13px;color:var(--hsk-ink-secondary);line-height:1.4;margin-top:2px}
.pro-note{font-size:13px;line-height:1.45;color:var(--hsk-ink-secondary);text-align:center}
.bub.q{font-size:21px;line-height:1.35;font-weight:650;letter-spacing:-.3px;padding:18px 22px}


.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 32px}
.loading .halo{margin-bottom:18px}
.loading .panda{width:140px;height:154px}
.loading h2{font-size:15px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--hsk-ink-secondary);margin-bottom:14px}
.loading p{font-size:16px;line-height:1.6;color:var(--hsk-ink-secondary);max-width:330px}

.body{padding:0 24px 16px}
.helper{font-size:13px;line-height:1.5;color:var(--hsk-ink-secondary);margin:0 0 14px}
.choices{display:grid;gap:10px}
.lv{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;text-align:left;background:var(--hsk-paper-raised);border:1px solid var(--hsk-divider);border-radius:14px;padding:13px 14px;color:var(--hsk-ink);transition:background .18s,border-color .18s,transform .15s}
.lv:active{transform:scale(.99)}
.lv .glyph{width:42px;height:42px;display:grid;place-items:center;flex-shrink:0;color:var(--hsk-cinnabar-ink)}
.lv .ot{flex:1;min-width:0}
.lv .hd{font-size:15px;font-weight:550;line-height:1.4;display:block}
.lv small{display:block;font-size:12px;color:var(--hsk-ink-secondary);line-height:1.4;margin-top:3px}
.chk{width:22px;height:22px;border-radius:50%;border:1px solid var(--hsk-divider);display:grid;place-items:center;color:var(--hsk-paper-raised);flex-shrink:0}
.multi .chk{border-radius:7px}
.chk .icon{width:14px;height:14px;visibility:hidden}
.lv.sel{border-color:var(--hsk-cinnabar);background:#FFF3EF}

var COMET='<div class="comet" aria-hidden="true"><svg viewBox="0 0 400 300" preserveAspectRatio="none"><path d="M0 18 L300 108 C352 124 372 176 344 214 C320 248 268 262 224 240 L0 96 Z" fill="#FDF9F0"/></svg></div>';
function restart(){clearTimeout(timer);trail=[];screen="account";render()}
function topBar(){
  var lang='<div class="lang-control">'+icon("globe")+'<select class="language" aria-label="UZ / RU / TJ" onchange="setLang(this.value)">'
    +["uz","ru","tj"].map(function(l){return '<option value="'+l+'"'+(l===LANG?" selected":"")+'>'+l.toUpperCase()+'</option>'}).join("")+'</select></div>';
  if(screen==="account")return '<div class="spacer"></div>'+lang;
  if(screen==="loadCourse"||screen==="loadLesson")return '<button type="button" class="bk li-loading-back" aria-label="'+t("back")+'" onclick="back()">'+icon("back")+'</button><div class="li-first-brand" aria-label="HSK AI">HSK AI</div><div class="spacer"></div>'+lang;
  if(screen==="pro")return '<button class="bk" type="button" aria-label="'+t("close")+'" onclick="go(\'end\')">'+icon("close")+'</button><div class="spacer"></div>';
  if(TRIAL_STEPS.indexOf(screen)>0)return stepper();
  if(screen==="trialIntro"||screen==="end")return "";
  var bk='<button class="bk" type="button" aria-label="'+t("back")+'" onclick="back()">'+icon("back")+'</button>';
  if(screen==="login"||screen==="signup")return bk+'<div class="spacer"></div>'+lang;
  var i=QUESTION_FLOW.indexOf(screen);
  if(i>=0)return bk+'<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="'+QUESTION_FLOW.length+'" aria-valuenow="'+(i+1)+'"><i style="width:'+((i+1)*100/QUESTION_FLOW.length)+'%"></i></div>';
  return bk+'<div class="spacer"></div>';
}
/* Li thinks while the question is open and writes the answer down once one is chosen. */
function guidePose(){
  if(screen==="level")return level?"write":"think";
  if(screen==="goal")return goals.length?"write":"think";
  if(screen==="focus")return focus?"write":"think";
  if(screen==="time")return minutes?"write":"think";
  return POSE[screen];
}
function guide(text){return '<div class="guide"><div class="panda" id="guidePanda">'+panda(guidePose())+'</div><div class="bub" aria-live="polite">'+text+'</div></div>'}
function row(key,title,sub,glyph,selected,handler){
  return '<button type="button" class="lv'+(selected?" sel":"")+'" aria-pressed="'+selected+'" onclick="'+handler+'(\''+key+'\')">'
    +'<span class="glyph" aria-hidden="true">'+glyph+'</span><span class="ot"><span class="hd">'+title+'</span>'+(sub?'<small>'+sub+'</small>':'')+'</span><span class="chk">'+icon("check")+'</span></button>';
}
function bars(n){return '<span class="level-bars">'+[0,1,2,3,4].map(function(b){return '<i class="'+(b<=n?"on":"")+'" style="height:'+(9+b*5)+'px"></i>'}).join("")+'</span>'}
function cta(label,handler,disabled,ghost){return '<button type="button" class="cta'+(ghost?" ghost":"")+'" onclick="'+handler+'"'+(disabled?" disabled":"")+'>'+label+'</button>'}
function loginScreen(mode){
  var signup=mode==="signup";
  return '<div class="login"><div class="hero-panda" aria-hidden="true"><div class="panda">'+panda(POSE[screen])+'</div></div>'
    +'<h1>'+(signup?t("signupTitle"):t("loginTitle"))+'</h1><p class="subtitle">'+(signup?t("signupSub"):t("loginSub"))+'</p>'
    +'<div class="actions">'+["telegram","google","apple"].map(function(p){
      return '<button type="button" class="provider" onclick="'+(signup?"go('pro')":"demoLogin()")+'"><span class="provider__icon">'+BRAND[p]+'</span><span class="provider__label">'+p.charAt(0).toUpperCase()+p.slice(1)+'</span><span class="provider__chevron">'+icon("chevron")+'</span></button>'}).join("")+'</div>'
    +'<p class="status" role="status">'+(demoStatus?t("demoNote"):"")+'</p>'
    +'<div class="tagline"><span>'+t("tagline")+'</span></div></div>';
}
function goalSay(){
  var k=lastGoal&&goals.indexOf(lastGoal)>=0?lastGoal:goals[goals.length-1];
  return k?tr(find(GOALS,k).say):t("askGoal");
}
function levelSay(){var l=find(levels(),level);return l?tr(l.say):t("ask")}

function render(animate){
  document.documentElement.lang=LANG==="tj"?"tg":LANG;
  var st=document.getElementById("stage"),top=document.getElementById("top"),ft=document.getElementById("footer"),html="",foot="";
  var dark=screen==="pro"||TRIAL_STEPS.indexOf(screen)>=0;
  document.body.classList.toggle("dark",dark);document.querySelector(".wrap").classList.toggle("dark",dark);
  top.innerHTML=topBar();top.hidden=!top.innerHTML;
  switch(screen){
    case "account":
      html='<div class="center"><h1 class="bub q">'+t("accountTitle")+'</h1>'+haloPanda()+'</div>';
      foot=cta(t("firstTime"),"go('hello')")+cta(t("haveAccount"),"go('login')",false,true);break;
    case "login": html=loginScreen("login");break;
    case "hello":
      html='<div class="center"><div class="bub">'+t("hello")+'</div>'+haloPanda()+'</div>';foot=cta(t("cont"),"go('intro')");break;
    case "intro":
      html='<div class="center"><div class="bub">'+t("intro")+'</div>'+haloPanda()+'</div>';foot=cta(t("cont"),"go('loadCourse')");break;
    case "loadCourse":
      html='<div class="loading li-progressive-stage" data-remote-section="tracks" aria-busy="true">'
        +'<div class="li-loading-head">'+guide(t("loadCourse"))+'</div>'
        +'<div class="body li-loading-body"><p class="helper">'+t("loadCourseText")+'</p>'
        +books()
        +'<div class="li-loading-options" role="status" aria-label="'+t("loadCourse")+'">'
        +'<span class="li-skel" aria-hidden="true"></span><span class="li-skel" aria-hidden="true"></span></div>'
        +'<div class="li-loading-lines" aria-hidden="true"><span class="li-skel"></span><span class="li-skel"></span></div>'
        +'</div></div>';
      break;
    case "version":
      html=guide(t("askVersion"))+'<div class="body">'+books()
        +'<div class="track-switch" role="group"><button type="button" class="'+(track==="hsk20"?"sel":"")+'" aria-pressed="'+(track==="hsk20")+'" onclick="setTrack(\'hsk20\')">HSK 2.0</button>'
        +'<button type="button" class="'+(track==="hsk30"?"sel":"")+'" aria-pressed="'+(track==="hsk30")+'" onclick="setTrack(\'hsk30\')">HSK 3.0</button></div>'
        +'<p class="track-note">'+t("versionHint")+'</p></div>';
      foot=cta(t("cont")+icon("arrow"),"go('level')");break;
    case "level":
      html=guide(levelSay())+'<div class="body"><p class="helper">'+t("levelHint")+'</p><div class="choices" role="group">'
        +levels().map(function(l,i){return row(l.k,tr(l.hd),tr(l.s),bars(track==="hsk30"?i+1:i),level===l.k,"pickLevel")}).join("")+'</div></div>';
      foot=cta(t("cont")+icon("arrow"),"go('goal')",!level);break;
    case "goal":
      html=guide(goalSay())+'<div class="body"><p class="helper">'+t("goalHint")+' '+t("multiHint")+'</p><div class="choices multi" role="group">'
        +GOALS.map(function(g){return row(g.k,tr(g.hd),tr(g.s),'<span class="goal-icon">'+icon(g.k)+'</span>',goals.indexOf(g.k)>=0,"toggleGoal")}).join("")+'</div></div>';
      foot=cta(t("cont")+icon("arrow"),"go('time')",!goals.length);break;
    case "time":
      html=guide(minutes?tr(find(TIMES,minutes).say):t("timeQ"))+'<div class="body"><p class="helper">'+t("timeSub")+'</p><div class="choices" role="group">'
        +TIMES.map(function(o){return row(String(o.k),o.k+' '+t("min"),"",'<span class="focus-icon">'+icon("clock")+'</span>',minutes===o.k,"pickTime")}).join("")+'</div></div>';
      foot=cta(t("cont")+icon("arrow"),"go('focus')",!minutes);break;
    case "focus":
      html=guide(focus?tr(find(FOCUS,focus).say):t("focusQ"))+'<div class="body"><p class="helper">'+t("focusSub")+'</p><div class="choices" role="group">'
        +FOCUS.map(function(o){return row(o.k,tr(o.hd),"",'<span class="focus-icon">'+icon(o.k)+'</span>',focus===o.k,"pickFocus")}).join("")+'</div></div>';
      foot=cta(t("cont")+icon("arrow"),"go('ready')",!focus);break;
    case "ready":
      html='<div class="center"><div class="bub">'+t("ready")+'</div>'+haloPanda()+'</div>';foot=cta(t("cont"),"go('loadLesson')");break;
    case "loadLesson":
      html='<div class="loading li-progressive-stage" data-remote-section="lesson" aria-busy="true">'
        +'<div class="li-loading-head">'+guide(t("loadLesson"))+'</div>'
        +'<div class="body li-loading-body"><p class="helper">'+t("loadLessonText")+'</p>'
        +'<span class="li-skel li-loading-card" aria-hidden="true"></span>'
        +'<div class="li-loading-lines" aria-hidden="true"><span class="li-skel"></span><span class="li-skel"></span></div>'
        +'<span class="li-skel li-loading-row" aria-hidden="true"></span></div></div>';
      break;
    case "habit":
      html='<div class="center"><div class="bub">'+t("habit")+'</div>'+haloPanda()+'</div>';foot=cta(t("cont"),"go('streak')");break;
    case "streak":
      var sg=streakGoal?find(STREAKS,streakGoal):null;
      html='<div class="center" style="flex:none;padding:18px 24px 8px"><div class="bub" style="margin-bottom:14px">'+(sg?tr(sg.say):t("streakQ"))+'</div></div>'
        +'<div class="streak-scene"><div class="flame">'+flame()+'<b>'+(streakGoal||7)+'</b></div><div class="panda" id="guidePanda">'+panda(streakGoal?"cheer":"point")+'</div></div>'
        +'<div class="body"><div class="choices" role="group">'
        +STREAKS.map(function(o){var on=streakGoal===o.k;return '<button type="button" class="lv plain'+(on?" sel":"")+'" aria-pressed="'+on+'" onclick="pickStreak('+o.k+')"><span class="glyph"></span><span class="ot"><span class="hd">'+o.k+' '+t("days")+'</span></span><span class="aside">'+tr(o.len)+'</span></button>'}).join("")+'</div></div>';
      foot=cta(t("streakCta"),"go('profile')",!streakGoal);break;
    case "pro":
      html='<div class="pro-offer"><h1>'+t("proTitle")+'</h1>'
        +'<div class="offer-hero">'+COMET+'<span class="twinkle" style="left:30%;top:8px">'+STAR+'</span><span class="twinkle sm" style="right:4%;top:150px">'+STAR+'</span>'
        +'<div class="flyer" aria-hidden="true">'+HSKCharacters.render("panda","celebrate")+'</div></div><ul class="perks">'
        +PERKS.map(function(x){return '<li><span class="tile">'+icon(x.i)+'</span><span><b>'+tr(x.t)+'</b></span></li>'}).join("")+'</ul></div>';
      foot=cta(t("proCta"),"go('trialIntro')");break;
    case "trialIntro":
      var star='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.8 7.6 16.4 11.2 24 12 16.4 12.8 12.8 16.4 12 24 11.2 16.4 7.6 12.8 0 12 7.6 11.2 11.2 7.6 12 0Z" fill="currentColor"/></svg>';
      html='<div class="pro-intro"><div class="pro-mark" role="img" aria-label="HSK AI Pro. '+t("trialOn").replace(/"/g,"")+'"><span class="tag">PRO</span><span class="name">HSK <strong>AI</strong></span></div>'
        +'<div class="comet" aria-hidden="true"><svg viewBox="0 0 400 300" preserveAspectRatio="none"><path d="M0 18 L300 108 C352 124 372 176 344 214 C320 248 268 262 224 240 L0 96 Z" fill="#FDF9F0"/></svg></div>'
        +'<span class="twinkle" style="left:42%;top:44%">'+star+'</span><span class="twinkle sm" style="left:6%;top:66%">'+star+'</span>'
        +'<div class="flyer" aria-hidden="true">'+HSKCharacters.render("panda","celebrate")+'</div></div>';
      foot=cta(t("letsGo"),"go('trial1')");break;
    case "trial1":
      html='<div class="trial"><h2>'+t("t1")+'</h2><p>'+t("t1s")+'</p><div class="scene">'
        +'<div class="phone" style="right:8px"><div class="in"><div class="ph-bar"><i></i></div><div class="ph-card"><div class="ph-han">'+t("hello1")+'</div><div class="ph-py">'+t("hello1py")+'</div><div class="ph-tr">'+t("hello1tr")+'</div></div>'
        +'<div class="ph-row">'+t("optB")+'</div><div class="ph-row">'+t("optA")+'</div></div></div>'
        +'<span class="no-ad" style="right:-2px;bottom:262px">'+icon("noad")+t("noAds")+'</span>'
        +'<div class="mate" style="left:-4px">'+HSKCharacters.render("rabbit","proud")+'</div></div></div>';
      foot=cta(t("cont"),"go('trial2')");break;
    case "trial2":
      html='<div class="trial"><h2>'+t("t2")+'</h2><p>'+t("t2s")+'</p><div class="scene">'
        +'<div class="phone" style="left:8px"><div class="in"><div class="ph-chat">'
        +'<div class="ph-msg"><b>你好！你好吗？</b><small>nǐ hǎo! nǐ hǎo ma?</small><small>'+t("voiceTr")+'</small></div>'
        +'<div class="ph-msg me"><b>我很好，谢谢！</b><small>wǒ hěn hǎo, xièxie!</small><small>'+t("voiceMe")+'</small></div></div>'
        +'<div class="ph-mic">'+icon("mic")+'</div></div></div>'
        +'<div class="mate" style="right:-6px">'+HSKCharacters.render("panda","talk")+'</div></div></div>';
      foot=cta(t("cont"),"go('trial3')");break;    case "trial3":
      html='<div class="trial"><h2>'+t("t3")+'</h2><p>'+t("t3s")+'</p><div class="scene">'
        +'<div class="phone" style="right:8px"><div class="in"><div class="ph-bar"><i style="width:70%"></i></div>'
        +'<div style="font-size:13px;font-weight:700;margin-bottom:4px">'+t("q1")+'</div>'
        +'<div class="ph-row">'+t("optA")+'</div><div class="ph-row ok">'+t("optOk")+' ✓</div><div class="ph-row">'+t("optB")+'</div></div></div>'
        +'<div class="mate" style="left:-8px">'+HSKCharacters.render("dragon","celebrate")+'</div></div></div>';
      foot=cta(t("gotIt"),"go('trialDone')");break;
    case "trialDone":
      html='<div class="trial" style="justify-content:center"><h2>'+t("trialDone")+'</h2><p>'+t("noCharge")+'</p>'
        +'<div class="done-hero">'+HSKCharacters.render("panda","proud")+'</div></div>';
      foot=cta(t("cont"),"go('end')");break;
    case "end":
      html='<div class="center"><div class="bub">'+t("endNote")+'</div>'+haloPanda()+'</div>';
      foot=cta(t("first"),"restart()");break;
    case "profile":
      html='<div class="center"><div class="bub">'+t("profile")+'</div>'+haloPanda()+'</div>';foot=cta(t("createAccount"),"go('signup')");break;
    case "signup": html=loginScreen("signup");break;
  }
  st.innerHTML=html;ft.innerHTML=foot;ft.hidden=!foot;ft.classList.toggle("list",["version","level","goal","time","focus","streak"].indexOf(screen)>=0);
  if(animate!==false){st.scrollTop=0;st.classList.remove("stage-enter");void st.offsetWidth;st.classList.add("stage-enter")}
}
function pleased(){var p=document.getElementById("guidePanda");if(!p)return;p.classList.add("is-pleased");setTimeout(function(){p.classList.remove("is-pleased")},800)}
function keepScroll(fn){var st=document.getElementById("stage"),y=st.scrollTop;fn();st.scrollTop=y}
function setTrack(v){if(track===v)return;track=v;level=null;render(false)}
function pickLevel(k){level=k;keepScroll(function(){render(false)});pleased()}
function toggleGoal(k){
  var i=goals.indexOf(k);
  if(i>=0){goals.splice(i,1);if(lastGoal===k)lastGoal=null}else{goals.push(k);lastGoal=k}
  keepScroll(function(){render(false)});if(i<0)pleased();
}
function pickTime(k){minutes=Number(k);keepScroll(function(){render(false)});pleased()}
function pickFocus(k){focus=k;keepScroll(function(){render(false)});pleased()}
function pickStreak(k){streakGoal=k;keepScroll(function(){render(false)});pleased()}
function demoLogin(){
  // Reference-only action deliberately disabled in the live page.
  // Authenticated provider flow is supplied by li-onboarding-runtime.js.
  return false;
}
render();
</script>
