<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDF9F0">
<title>HSK AI</title>
<link rel="icon" href="/assets/hsk-ai-avatar.webp" type="image/webp">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --ink:#211D17;--ink2:#665D50;--ink3:#A89E8E;--paper:#FDF9F0;--card:#FFFFFF;--line:#EAE0CC;
  --cin:#E04A40;--cin2:#B23530;--cinbg:#FDEBE7;--gold:#E9A916;--goldbg:#FAF0D3;--jade:#2FA06A;--jadebg:#E3F4EA;
  --flame:#FF9600;--flamebg:#FFEFD6;--blue:#2E86C1;--bluebg:#E8F2FA;--overlay:#171310;--shadow:#E4D9C4;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  /* --read — O'QISH kengligi: dars oqimi, varaqlar, mashq ekranlari va
     pastki menyu doim shu kenglikda qoladi. Telegram Desktop'da ham matn
     ustuni cho'zilmasligi kerak.
     --shell — ilova QOBIG'I: keng ekranda kengayadi va bo'sh joyni yon
     ustunga beradi (mobil kartalarni cho'zib emas). */
  --read:480px;--shell:480px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif}
.han{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-weight:600;letter-spacing:1px}
.wrap{max-width:var(--shell);margin:0 auto;min-height:100vh;position:relative;padding-top:var(--safe-t)}
.scr{display:none;padding-bottom:calc(82px + var(--safe-b))}
.scr.on{display:block}
button{cursor:pointer}
/* top */
.htop{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;position:sticky;top:var(--safe-t);background:var(--paper);z-index:4}
.lvpill{display:flex;align-items:center;gap:6px;background:var(--cin);color:#fff;font-size:13px;font-weight:500;padding:7px 13px;border-radius:20px;border:none;font-family:inherit}
.chip{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:500}
.langsw{margin-left:auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.langsw button{background:none;border:none;font:inherit;font-size:12px;padding:6px 9px;color:var(--ink2)}
.langsw button.on{background:var(--cin);color:#fff;font-weight:500}
.pwrap{display:flex;align-items:center;gap:10px;padding:0 16px 6px}
.pbar{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--cin);border-radius:6px;transition:width .4s}
.pwrap small{font-size:12px;color:var(--ink2);font-weight:500}
/* ---------- Bugungi reja tasmasi ----------
   Ataylab YANGI QAVAT emas, bitta ixcham qator: yo'lakcha (asosiy mahsulot)
   pastga siljimasin. Chapda kunlik XP, o'ngda 1-4 vazifa chipi. Chiplar
   gorizontal suriladi, ya'ni ekran kengligi cheklamaydi. */
.today{display:flex;align-items:center;gap:8px;padding:2px 0 8px 16px}
.today-l{display:flex;align-items:center;gap:4px;flex-shrink:0;font-size:12px;color:var(--ink2);font-weight:500}
.today-l i{font-size:14px;color:var(--cin)}
.today-l b{color:var(--ink);font-weight:600}
.today-c{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-right:16px}
.today-c::-webkit-scrollbar{display:none}
.tchip{display:flex;align-items:center;gap:4px;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 10px;font-size:12.5px;font-weight:500;font-family:inherit;color:var(--ink)}
.tchip i{font-size:14px;color:var(--ink3)}
.tchip.done{background:var(--paper);border-style:dashed;color:var(--ink3)}
.tchip.done i{color:var(--jade)}
.tchip.lock{opacity:.55}
.tchip.lock i{color:var(--ink3)}
/* unit + path */
.uban{display:flex;align-items:center;gap:10px;margin:8px 16px 0;background:var(--ink);color:#fff;border-radius:14px;padding:11px 14px}
.uban.lock{background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.uban .un{font-size:11px;letter-spacing:1.5px;opacity:.7;text-transform:uppercase}
.uban .utt{font-size:14px;font-weight:500}.uban .ic{margin-left:auto;font-size:18px;opacity:.85}
.path{position:relative;padding:8px 0 2px}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.prow{position:relative;height:84px;display:flex;justify-content:center}
.nodewrap{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px}
.node{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;border:none;position:relative;font-family:inherit;color:#fff}
.node .ring{position:absolute;inset:-6px;border-radius:50%;border:3px solid transparent}
.node.done{background:var(--jade);box-shadow:0 4px 0 #245f47}
.node.current{background:var(--cin);box-shadow:0 4px 0 var(--cin2)}
.node.current .ring{border-color:var(--cin);animation:pl 1.6s ease-out infinite}
@keyframes pl{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.node.locked{background:var(--line);color:var(--ink3);box-shadow:0 4px 0 #d8d2c4}
.node.chest{background:var(--goldbg);color:var(--gold);box-shadow:0 4px 0 #d8c79a;border:2px solid var(--gold)}
.node.boss{background:var(--cinbg);color:var(--cin);box-shadow:0 4px 0 #e8cfc9;border:2px solid var(--cin)}
.nlabel{font-size:12px;font-weight:500;color:var(--ink2)}.nlabel.mut{color:var(--ink3)}
.nnum{display:block;font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:.02em;margin-top:1px}
.bubble{position:absolute;top:-42px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--cin);color:var(--cin2);font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;white-space:nowrap}
.bubble:after{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:#fff;border-right:1px solid var(--cin);border-bottom:1px solid var(--cin)}
.pmasc{position:absolute;top:50%;width:72px;height:72px;margin-top:-36px;pointer-events:none;animation:pmascBob 3.4s ease-in-out infinite;z-index:1;opacity:.95}
.pmasc svg{width:100%;height:100%;display:block;opacity:.8;animation:pmascNod 4.6s ease-in-out infinite;transform-origin:50% 90%}
.pmasc:after{content:"";position:absolute;left:50%;bottom:-7px;width:34px;height:8px;margin-left:-17px;background:radial-gradient(closest-side,rgba(33,29,23,.16),rgba(33,29,23,0));border-radius:50%;animation:pmascShadow 3.4s ease-in-out infinite}
@keyframes pmascBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pmascNod{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes pmascShadow{0%,100%{transform:scaleX(1);opacity:.16}50%{transform:scaleX(.78);opacity:.09}}
.pmasc-bub{position:absolute;top:-28px;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:11px;font-weight:500;line-height:1;padding:6px 11px;border-radius:14px;white-space:nowrap;box-shadow:0 3px 8px rgba(33,29,23,.12)}
.pmasc.l .pmasc-bub{left:0}.pmasc.r .pmasc-bub{right:0}
.pmasc-bub:after{content:"";position:absolute;bottom:-5px;width:8px;height:8px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.pmasc.l .pmasc-bub:after{left:20px}.pmasc.r .pmasc-bub:after{right:20px}
.pd-breathe{animation:pdBreathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
.pd-bounce{animation:pdBounce .7s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pdBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02) translateY(-1px)}}
@keyframes pdBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.03)}}
.pd-blink{animation:pdBlink 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pdBlink{0%,90%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}}
.pd-twinkle{animation:pdTwinkle 1.1s ease-in-out infinite}
@keyframes pdTwinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.pd-mouth.pd-talk{animation:pdTalk .42s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pdTalk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
/* Parvoz pozasi: tana shamolda biroz cho'ziladi, plash hilpiraydi */
.pd-fly{animation:pdFly 1.15s ease-in-out infinite;transform-origin:50% 20%}
@keyframes pdFly{0%,100%{transform:scaleY(1.02) scaleX(.99)}50%{transform:scaleY(1.05) scaleX(.97) translateY(-2px)}}
.pd-cape{animation:pdCape .9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 4%}
@keyframes pdCape{0%,100%{transform:skewX(5deg) scaleY(1)}35%{transform:skewX(-6deg) scaleY(1.06)}70%{transform:skewX(3deg) scaleY(.96)}}
.pd-arms{animation:pdArms 1.15s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pdArms{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.pd-char{overflow:visible;filter:drop-shadow(0 10px 14px rgba(33,29,23,.18))}
.pd-ground{transform-origin:50% 50%;animation:pdGround 2.6s ease-in-out infinite}
.pd-core{transform-box:fill-box;transform-origin:50% 96%;filter:drop-shadow(0 3px 0 rgba(33,29,23,.08))}
.pd-limbs{filter:drop-shadow(0 2px 0 rgba(0,0,0,.16))}
.pd-shell,.pd-face3d{filter:drop-shadow(0 2px 0 rgba(33,29,23,.12))}
.pd-face-shine{opacity:.72}
.pd-face-depth,.pd-body-depth{opacity:.34}
.pd-mood-talk .pd-limbs{animation:pdCoachWave .9s ease-in-out infinite;transform-box:fill-box;transform-origin:60% 62%}
.pd-mood-celebrate .pd-core{filter:drop-shadow(0 5px 0 rgba(33,29,23,.10)) drop-shadow(0 12px 16px rgba(233,169,22,.14))}
@keyframes pdGround{0%,100%{transform:scaleX(1);opacity:.22}50%{transform:scaleX(.78);opacity:.12}}
@keyframes pdCoachWave{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(70px + var(--safe-b));padding-bottom:var(--safe-b);background:var(--card);border-top:1px solid var(--line);display:flex;align-items:flex-start;padding-top:8px;max-width:var(--read);margin:0 auto;z-index:8}
.nav button{flex:1;background:none;border:none;font-family:inherit;color:var(--ink3);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:var(--cin)}
.nav button i{font-size:21px}
.nav .center{position:relative;top:-20px}
.nav .center .fab{width:58px;height:58px;border-radius:50%;background:var(--cin);border:4px solid var(--card);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.nav .center .lbl{margin-top:4px;color:var(--cin);font-weight:500}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(20,17,13,.5);display:none;align-items:flex-end;z-index:50;max-width:var(--read);margin:0 auto}
.sheet.on{display:flex}
.si{background:var(--paper);border-radius:24px 24px 0 0;padding:8px 18px calc(22px + var(--safe-b));width:100%;position:relative;max-height:88vh;overflow-y:auto}
.grip{width:40px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 14px}
.sx{position:absolute;right:14px;top:14px;background:none;border:none;color:var(--ink2);font-size:22px}
.shead{text-align:center;margin-bottom:14px}
.shead .zh{font-size:34px;line-height:1}
.shead .py{font-size:15px;color:var(--cin2);font-weight:500;margin-top:5px}
.shead .tr{font-size:13px;color:var(--ink2);margin-top:2px}
.shead .stars{color:var(--gold);font-size:15px;margin-top:6px;letter-spacing:2px}
.pmeta{font-size:12px;color:var(--ink2);font-weight:500;margin:0 2px 8px;display:flex;justify-content:space-between}
.secs{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.sec{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.sec .si2{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.sec.done .si2{background:var(--jadebg);color:var(--jade)}
.sec.cur{border-color:var(--cin);background:var(--cinbg)}.sec.cur .si2{background:var(--cin);color:#fff}
.sec.lock{color:var(--ink3)}.sec.lock .si2{background:var(--paper);color:var(--ink3)}
.sec b{flex:1;font-weight:400}.sec.cur b{font-weight:500;color:var(--cin2)}
.scta{width:100%;background:var(--cin);color:#fff;border:none;border-radius:14px;padding:15px;font-family:inherit;font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.scta.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
/* lesson overlay flow */
.flow{position:fixed;inset:0;background:var(--paper);z-index:30;display:none;flex-direction:column;max-width:var(--read);margin:0 auto}
.flow.on{display:flex}
.adov{position:fixed;inset:0;z-index:82;background:#15120f;display:none;max-width:var(--read);margin:0 auto;color:#fff}
.adov.on{display:flex;flex-direction:column}
.adbox{min-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(14px + var(--safe-t)) 14px calc(16px + var(--safe-b));gap:12px}
.adtop{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:rgba(255,255,255,.78);font-weight:600}
.adcount{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:7px 10px;white-space:nowrap}
.advideo-wrap{position:relative;min-height:0;height:100%;display:block}
.advideo{width:100%;height:100%;min-height:320px;max-height:none;object-fit:contain;background:#000;border-radius:16px;border:1px solid rgba(255,255,255,.12)}
.advisit{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.24);color:#fff;border-radius:20px;padding:7px 12px;font-size:12px;font-weight:600;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.adstatus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:16px;background:rgba(0,0,0,.58);color:#fff;font-size:14px;font-weight:600;line-height:1.35}
.adstatus[hidden]{display:none!important}
.admeta{display:grid;gap:8px}
.admeta b{font-size:15px;font-weight:600}.admeta small{font-size:12px;color:rgba(255,255,255,.68);line-height:1.4}
.adcta{width:100%;border:none;border-radius:14px;padding:15px;font-family:inherit;font-size:15px;font-weight:600;background:#fff;color:#211D17;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
.adcta:disabled{background:rgba(255,255,255,.14);color:rgba(255,255,255,.62)}
.adcta:active:not(:disabled){transform:translateY(1px)}
.adsub{display:grid;gap:11px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:18px 16px;box-shadow:0 12px 34px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08)}
.adsub[hidden]{display:none!important}
.adsub-t{margin:2px 0 4px;font-size:15px;line-height:1.42;color:#fff;text-align:center;font-weight:700;letter-spacing:-.01em}
.adsub-benefits{display:grid;gap:10px;margin:0 0 4px;padding:13px 13px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:15px}
.adben{display:flex;align-items:center;gap:11px;font-size:14px;line-height:1.35;color:rgba(255,255,255,.95);text-align:left}
.adben i{color:#7BE0B3;font-size:20px;flex-shrink:0}
.adsub-pay{background:linear-gradient(180deg,#ffffff,#f1eee9);color:#211D17;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.5) inset}
.adcta.ghost{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.16);font-weight:600}
/* reklamalar tugagach: toza promo ekran (reklama blok qoldiqlarisiz) */
#adov.done .adtop{display:none}
#adov.done .adbox{grid-template-rows:minmax(0,1fr) auto}
#adov.done #ad-video-wrap{display:none!important}
#adov.done .admeta>b,#adov.done .admeta>small,#adov.done #ad-cta{display:none}
#adov.done .adsub-benefits{display:none}
#adov.done .adsub{gap:8px;padding:14px}
#adov.done .adsub-t{font-size:14px;margin:0 0 2px}
#adov.done .adsub-pay,#adov.done .adcta.ghost{padding:12px;font-size:14px;border-radius:12px}
.adpromo{position:relative;height:100%;min-height:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px;background:radial-gradient(120% 90% at 50% 0,rgba(194,64,58,.22),transparent 62%),rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.10);border-radius:18px;overflow:hidden}
#adov.done .adpromo{display:flex}
.adpromo-slide{display:flex;flex-direction:column;align-items:center;animation:promoIn .5s ease}
@keyframes promoIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.adpromo-ic{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:35px;color:#fff;background:linear-gradient(160deg,#D6493C,#9A2F2B);box-shadow:0 14px 34px rgba(194,64,58,.42);margin-bottom:20px}
.adpromo-t{font-size:20px;font-weight:800;letter-spacing:-.02em;color:#fff;margin:0 0 9px;max-width:300px;line-height:1.25}
.adpromo-s{font-size:14px;line-height:1.5;color:rgba(255,255,255,.74);max-width:290px;margin:0}
.adpromo-dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:6px}
.adpromo-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22);transition:width .3s,background .3s}
.adpromo-dots i.on{width:18px;border-radius:6px;background:#D6493C}
/* "nega bu oyna chiqdi" sabab qatori (paywall ichida, promodan yuqorida) */
.paywhy{display:flex;align-items:flex-start;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:10px;font-size:12.5px;line-height:1.5;color:var(--ink2);text-align:left}
.paywhy i{color:var(--gold);font-size:17px;flex-shrink:0;margin-top:1px}
/* sheet/paywall ichidagi promo (och fon) */
.spromo{position:relative;text-align:center;background:var(--cinbg);border:1px solid var(--line);border-radius:16px;padding:20px 16px 30px;margin-bottom:10px;overflow:hidden}
.spromo-slide{display:flex;flex-direction:column;align-items:center;animation:promoIn .5s ease}
.spromo-ic{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:27px;color:#fff;background:linear-gradient(160deg,var(--cin),var(--cin2));box-shadow:0 10px 24px rgba(194,64,58,.30);margin-bottom:14px}
.spromo-t{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin:0 0 6px;line-height:1.25;max-width:280px}
.spromo-s{font-size:13px;line-height:1.45;color:var(--ink2);max-width:280px;margin:0}
.spromo-dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:5px}
.spromo-dots i{width:5px;height:5px;border-radius:50%;background:var(--line);transition:width .3s,background .3s}
.spromo-dots i.on{width:16px;border-radius:6px;background:var(--cin)}
/* sales_value_v1: treatment paywall is a single outcome card, not a carousel */
.sales-offer{display:grid;gap:11px}
.sales-offer-head{text-align:center;padding:2px 8px 0}.sales-offer-mark{width:54px;height:54px;border-radius:16px;background:var(--cin);border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:27px;margin:0 auto 10px}
.sales-offer-head h2{font-size:21px;line-height:1.28;margin:0;color:var(--ink)}.sales-offer-head p{font-size:13px;line-height:1.5;color:var(--ink2);margin:7px 0 0}
.sales-proof,.sales-next{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px}
.sales-proof-label,.sales-next-label{display:block;color:var(--cin2);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}

.sales-bridge-kicker{justify-self:center;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);border-radius:999px;padding:6px 11px;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.levelup .sales-bridge-wrap h2{text-align:center;font-size:24px;line-height:1.25;margin:0;color:#fff}.levelup .sales-bridge-sub{text-align:center;font-size:13px;line-height:1.45;color:rgba(255,255,255,.72);max-width:330px;margin:0 auto 2px}
.levelup .sales-proof{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}.levelup .sales-proof-label,.levelup .sales-next-label{color:var(--gold)}
.levelup .sales-outcome-row{background:rgba(255,255,255,.055)}.levelup .sales-zh{color:#fff}.levelup .sales-py{color:#F6C75B}.levelup .sales-tr{color:rgba(255,255,255,.7)}
.levelup .sales-next{background:rgba(224,74,64,.16);border-color:rgba(255,255,255,.14)}.levelup .sales-next h3{color:#fff}.levelup .sales-secondary{width:100%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;border-radius:13px;padding:13px;font-family:inherit;font-size:14px;font-weight:650}
.levelup.sales-bridge .lu-cta{font-weight:700}
.lu-rays{position:absolute;top:130px;left:50%;width:520px;height:520px;transform:translate(-50%,-50%);opacity:.5;animation:luspin 28s linear infinite}
@keyframes luspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.lu-panda{width:92px;height:92px;position:absolute;top:56px;right:40px;z-index:2}
.lu-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;z-index:2}
/* Parvoz sahnasi: yer, daraxtlar, bulutlar, osmon va shamol */
.lu-sky{position:absolute;inset:0;overflow:hidden;z-index:4;display:none;opacity:0;pointer-events:none;transition:opacity .4s}
.levelup.cine .lu-sky{display:block}
.sky-world{position:absolute;left:0;right:0;top:0;height:300%;will-change:transform;
  background:linear-gradient(180deg,#08122A 0%,#123A63 16%,#2E7BB5 40%,#74B9E0 64%,#B7DFF4 82%,#E9F5FC 91%,#F3FAFE 100%)}
.sky-cloud{position:absolute;filter:drop-shadow(0 4px 6px rgba(30,70,110,.14))}
.sky-cloud svg{width:100%;height:auto;display:block}
.sky-ground{position:absolute;left:-4%;right:-4%;bottom:0;height:10%;
  background:linear-gradient(180deg,#6FBF8D 0%,#4C9C6C 34%,#3B7F57 100%);border-radius:46% 54% 0 0/9% 9% 0 0}
.sky-tree{position:absolute;bottom:100%;margin-bottom:-6px}
.sky-tree svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 3px rgba(30,60,40,.22))}
.sky-shadow{position:absolute;left:50%;bottom:100%;width:96px;height:22px;margin:0 0 -12px -48px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(24,52,36,.5),rgba(24,52,36,0))}
.sky-wind{position:absolute;inset:0;opacity:0}
.sky-wind i{position:absolute;width:2px;border-radius:2px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(255,255,255,0));animation:windFall 1s linear infinite}
@keyframes windFall{from{transform:translateY(-45vh)}to{transform:translateY(125vh)}}
/* Kinematik kirish: yaqin kadrda faqat panda — boshqa hech narsa ko'rinmaydi */
.lu-cine{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;z-index:6;display:none}
/* Parvozda panda ufq chizig'ida — yerda turgandek */
.levelup.cine.flying .lu-cine{top:auto;bottom:30%;margin:0 0 -46px -150px}
.lu-cine .cine-pd{position:relative;width:100%;height:100%;will-change:transform}
.levelup.cine .lu-cine{display:block}
.levelup.cine .lu-stage,.levelup.cine .lu-cta,.levelup.cine .lu-rays,.levelup.cine .lu-panda{opacity:0;pointer-events:none}
.levelup .lu-stage,.levelup .lu-cta,.levelup .lu-rays,.levelup .lu-panda{transition:opacity .4s}
/* Chang o'tirgach — sahna qismlari navbat bilan ochiladi */
.lu-stage.rev>*{animation:luReveal .5s both}
.lu-stage.rev>*:nth-child(2){animation-delay:.09s}
.lu-stage.rev>*:nth-child(3){animation-delay:.17s}
.lu-stage.rev>*:nth-child(4){animation-delay:.25s}
.lu-stage.rev>*:nth-child(5){animation-delay:.32s}
@keyframes luReveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.lu-emb{width:138px;height:138px;border-radius:34px;background:var(--cin);border:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:6px;transform:scale(0);transition:transform .5s cubic-bezier(.2,1.5,.4,1)}
.lu-emb.in{transform:scale(1)}
.lu-emb small{font-size:13px;color:rgba(255,255,255,.8)}.lu-emb b{font-size:50px;font-weight:600;line-height:1}.lu-emb .h2{font-size:58px}
.levelup h2{font-size:26px;font-weight:500;margin:14px 0 6px;color:#fff}
.levelup p{font-size:15px;color:rgba(255,255,255,.78);margin:0 0 18px;max-width:280px}
.lu-rewards{display:flex;gap:10px}
.lu-rw{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:11px 14px;text-align:center;min-width:72px}
.lu-rw b{display:block;font-size:18px;font-weight:600;color:var(--gold)}.lu-rw small{font-size:11px;color:rgba(255,255,255,.7)}
.lu-cta{margin:0 16px calc(16px + var(--safe-b));padding:16px;background:#fff;color:var(--cin2);border:none;border-radius:15px;font-family:inherit;font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;z-index:2}
.lu-conf{position:absolute;top:-14px;width:9px;height:13px;border-radius:2px;opacity:0;z-index:3}
.lu-conf.fall{opacity:1;transition:transform 1.7s ease-in,opacity 1.7s}
.ru-wrap{width:100%;display:flex;flex-direction:column;align-items:center}
.ru-board{width:100%;max-width:300px;margin:8px auto 0}
.ru-row{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.06);border-radius:12px;padding:11px 13px;margin-bottom:6px;transition:transform .7s cubic-bezier(.3,.85,.3,1)}
.ru-row.me{background:var(--cin)}
.ru-rk{width:20px;text-align:center;font-weight:600;font-size:14px;color:rgba(255,255,255,.7)}
.ru-row.me .ru-rk{color:#fff}
.ru-av{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#fff}
.ru-row.me .ru-av{background:#fff;color:var(--cin2)}
.ru-nm{flex:1;font-size:14px;color:#fff}.ru-xp{font-size:13px;color:rgba(255,255,255,.78);font-weight:500}
.tour{position:fixed;inset:0;z-index:55;display:none;max-width:var(--read);margin:0 auto}
.tour.on{display:block}
.tour-spot{position:absolute;border:2px solid var(--gold);border-radius:16px;box-shadow:0 0 0 2000px rgba(20,17,13,.6);transition:all .35s ease;pointer-events:none}
.tour-skip{position:absolute;top:calc(14px + var(--safe-t));right:14px;background:rgba(255,255,255,.92);border:none;border-radius:20px;padding:6px 13px;font-family:inherit;font-size:12px;color:var(--ink2)}
.tour-coach{position:absolute;left:16px;right:16px;bottom:calc(96px + var(--safe-b));background:var(--paper);border-radius:18px;padding:15px;box-shadow:0 8px 28px rgba(20,17,13,.22);transition:top .3s,bottom .3s}
.tour-coach.top{top:calc(56px + var(--safe-t));bottom:auto}
.tour-coach .ch{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.tour-coach .pd{width:44px;height:44px;flex-shrink:0}
.tour-coach .ct b{font-size:16px;font-weight:500;display:block}.tour-coach .ct small{font-size:11px;color:var(--ink3)}
.tour-coach .vt{margin-left:auto;display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 10px;font-family:inherit;font-size:12px;color:var(--ink2)}
.tour-coach .vt.on{background:var(--cinbg);border-color:var(--cin);color:var(--cin2);font-weight:500}
.tour-coach .desc{font-size:14px;line-height:1.45;margin:0 0 12px}
.tour-coach .row{display:flex;align-items:center;gap:10px}
.tour-coach .dots{display:flex;gap:5px;flex:1}.tour-coach .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.tour-coach .dots i.on{background:var(--cin)}
.tour-coach .nx{background:var(--cin);color:#fff;border:none;border-radius:12px;padding:11px 20px;font-family:inherit;font-size:14px;font-weight:500}
/* ===== FRESH polish + dopamine features ===== */
.uban{background:linear-gradient(135deg,var(--cin),var(--cin2));color:#fff}
.uban.lock{background:var(--card);color:var(--ink2)}
/* edge glow (combo) */
#edgeglow{position:fixed;inset:0;pointer-events:none;z-index:46;opacity:0;transition:opacity .4s;max-width:var(--read);margin:0 auto}
#edgeglow.g1{opacity:1;box-shadow:inset 0 0 40px 4px rgba(233,169,22,.22)}
#edgeglow.g2{opacity:1;box-shadow:inset 0 0 60px 10px rgba(233,169,22,.32)}
#edgeglow.g3{opacity:1;box-shadow:inset 0 0 90px 18px rgba(224,74,64,.42);animation:egPulse 1.1s ease-in-out infinite}
@keyframes egPulse{0%,100%{opacity:.85}50%{opacity:1}}
/* streak flame screen (dark levelup overlay ustida) */
.sk-flame{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.sk-flame svg{width:100%;height:100%;display:block}
.sk-flame.lit svg{animation:skIgnite .7s cubic-bezier(.2,1.5,.4,1)}
.sk-flame.lit:after{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(closest-side,rgba(233,169,22,.4),rgba(233,169,22,0));animation:skGlow 1.6s ease-in-out infinite}
.sk-flame.dim svg{opacity:.9}
@keyframes skIgnite{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes skGlow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.sk-flick{animation:skFlick 1.3s ease-in-out infinite;transform-origin:50% 88%}
@keyframes skFlick{0%,100%{transform:scaleY(1) scaleX(1)}30%{transform:scaleY(1.05) scaleX(.97)}60%{transform:scaleY(.96) scaleX(1.03)}}
.sk-num{font-size:74px;font-weight:800;line-height:1;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.35);animation:skNumPop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes skNumPop{0%{transform:scale(.35);opacity:0}55%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.sk-days{display:flex;gap:9px;justify-content:center;margin:20px 0 4px}
.sk-day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:rgba(255,255,255,.55)}
.sk-day .c{width:34px;height:38px;display:flex;align-items:flex-end;justify-content:center}
.sk-day .c svg{width:30px;height:34px;display:block}
.sk-day.on{color:var(--gold)}
.sk-day.on .c svg{filter:drop-shadow(0 0 8px rgba(233,169,22,.55))}
.sk-day.on .fmini{animation:fmFlick 1.5s ease-in-out infinite;transform-origin:50% 90%}
@keyframes fmFlick{0%,100%{transform:scaleY(1) scaleX(1)}45%{transform:scaleY(1.08) scaleX(.95)}70%{transform:scaleY(.94) scaleX(1.05)}}
.sk-day.ice{color:#9CC6DF}
.sk-day.ice .c svg{filter:drop-shadow(0 0 5px rgba(143,198,232,.35));opacity:.92}
.sk-day.fut .c svg{opacity:.26}
.sk-day.tod>span:first-child{color:#fff}
.sk-day.just .c{animation:skStamp .65s cubic-bezier(.15,1.5,.35,1)}
@keyframes skStamp{0%{transform:scale(2.1) rotate(-12deg);opacity:0}58%{transform:scale(.88) rotate(3deg)}100%{transform:scale(1);opacity:1}}
/* panda "supermen" parvozi: chang zarralari + qo'nish silkinishi */
.sk-dust{position:absolute;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#D8CBB6,#A08F76);opacity:0;pointer-events:none;filter:blur(1px);z-index:3}
.quake{animation:luQuake .42s cubic-bezier(.3,.1,.3,1)}
@keyframes luQuake{0%{transform:translateY(0)}22%{transform:translateY(6px)}50%{transform:translateY(-3px)}76%{transform:translateY(2px)}100%{transform:translateY(0)}}
.sk-weekgoal{width:min(310px,100%);margin:17px auto 0;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);text-align:left}
.sk-weekhead{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:rgba(255,255,255,.72)}
.sk-weekhead b{font-size:13px;color:#fff;font-weight:650}.sk-weekhead span{color:var(--gold);font-weight:700}
.sk-weekbar{height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:9px}
.sk-weekbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),#FFD66B);transform-origin:left;animation:skWeekFill .8s .18s both cubic-bezier(.2,.8,.25,1)}
.sk-weekgoal.done{border-color:rgba(233,169,22,.55);box-shadow:0 0 24px rgba(233,169,22,.18)}
@keyframes skWeekFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sk-panda{position:absolute;right:-52px;bottom:-8px;width:86px;height:86px}
/* daily goal ring (header) */
.goalring{position:relative;width:40px;height:40px;flex-shrink:0;cursor:pointer}
.goalring svg{width:100%;height:100%;display:block}
.goalring .gr-ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--cin)}
.goalring.full .gr-ic{animation:grBounce .6s cubic-bezier(.2,1.6,.4,1)}
.goalring.full:after{content:"";position:absolute;inset:-5px;border-radius:50%;background:radial-gradient(closest-side,rgba(233,169,22,.4),rgba(233,169,22,0));animation:skGlow 1.4s ease-in-out infinite}
@keyframes grBounce{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
.xpfly{position:fixed;z-index:60;font-size:15px;font-weight:800;color:var(--gold);pointer-events:none;transition:transform .9s cubic-bezier(.3,.1,.3,1),opacity .9s;text-shadow:0 1px 6px rgba(233,169,22,.4)}
/* chest opening */
.chest-fig{position:relative;width:150px;height:130px;margin-bottom:10px}
.chest-fig svg{width:100%;height:100%;display:block;overflow:visible}
.chest-fig.shake{animation:chShake .8s ease-in-out}
@keyframes chShake{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg)}30%{transform:rotate(6deg)}45%{transform:rotate(-5deg)}60%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
.chest-lid{transition:transform .5s cubic-bezier(.2,1.5,.4,1);transform-origin:14% 55%}
.chest-fig.open .chest-lid{transform:rotate(-38deg) translateY(-6px)}
.chest-burst{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,200,0,.5),rgba(255,200,0,0));opacity:0;transform:scale(.4)}
.chest-fig.open .chest-burst{animation:chBurst .8s ease-out forwards}
@keyframes chBurst{0%{opacity:0;transform:scale(.4)}30%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
.chest-xp{font-size:44px;font-weight:800;color:var(--gold);opacity:0;transform:scale(.4);transition:all .5s cubic-bezier(.2,1.6,.4,1)}
.chest-xp.in{opacity:1;transform:scale(1)}
.chestbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:12px 0 8px}
.chestbar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--cin));transition:width .5s}
/* yo'lakcha bezaklari: daraxt, pagoda, buta, tosh, o't (dekorativ) */
.decor{position:absolute;top:50%;margin-top:-26px;width:60px;height:60px;pointer-events:none;z-index:0;opacity:.95;filter:drop-shadow(0 3px 2px rgba(60,44,20,.14))}
.decor.sm{width:44px;height:44px;margin-top:-16px}
@media (prefers-reduced-motion:reduce){.mix-review,.sk-day.just .c,.sk-weekbar i,.sk-num,.sk-day.on .fmini,.quake,.lu-stage.rev>*,.sky-wind i,.pd-fly,.pd-cape,.pd-arms{animation:none!important}.sk-flame.lit svg,.sk-flame.lit:after,.sk-flick{animation:none!important}}
@media (max-height:700px){.levelup.sales-bridge .lu-stage{padding-top:12px}.sales-bridge-wrap{gap:8px}.levelup .sales-bridge-wrap h2{font-size:21px}.sales-outcome-row{padding:6px 8px}.sales-zh{font-size:20px}}

/* ===== Mashq bo'limlari asosiy ilova ichida ochiladi =====================
   Ilgari har bo'lim alohida HTML sahifa edi (`location.href`) — bosilganda
   butun ilova o'chib, yangisi noldan qurilardi. Endi bo'lim shu hujjatdagi
   `#secov` overlay'ida ochiladi: ilova tirik qoladi, qaytish bir zumda va
   `NavBack` (chapdan swipe / BackButton) avtomatik ishlaydi.
   Har bo'limning CSS klasslari o'z prefiksi bilan (rc- = recognition),
   shuning uchun asosiy ilovaning klasslari bilan to'qnashmaydi. */
.secov{--redbg:#FBEDEA;position:fixed;inset:0;background:var(--paper);z-index:30;display:none;flex-direction:column;max-width:var(--read);margin:0 auto}
.secov.on{display:flex}
.rc-top{display:flex;align-items:center;gap:11px;padding:calc(14px + var(--safe-t)) 16px 8px}
.rc-ix{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:18px;display:flex;align-items:center;justify-content:center}
.rc-pbar{flex:1;height:9px;background:var(--line);border-radius:6px;overflow:hidden}
.rc-pbar>i{display:block;height:100%;width:0;background:var(--cin);border-radius:6px;transition:width .35s}
.rc-pill{font-size:12px;font-weight:500;color:var(--cin2);background:var(--cinbg);border-radius:14px;padding:5px 11px}
.rc-body{flex:1;min-height:0;overflow-y:auto;padding:8px 18px calc(18px + var(--safe-b))}
.rc-lead{font-size:13px;color:var(--ink2);text-align:center;margin:12px 0 10px}
.rc-target{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center;margin-bottom:6px}
.rc-target .rc-py{font-size:27px;color:var(--cin2);font-weight:500;line-height:1.2}
.rc-target .rc-mn{font-size:15px;color:var(--ink);margin-top:9px;padding-top:10px;border-top:1px solid var(--line);line-height:1.45}
.rc-au{margin-top:12px;display:inline-flex;align-items:center;gap:7px;background:var(--cinbg);color:var(--cin2);border:none;border-radius:20px;padding:9px 17px;font-family:inherit;font-size:14px;font-weight:500}
.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.rc-tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit}
.rc-tile .rc-h{font-size:52px;line-height:1;color:var(--ink);font-family:"Songti SC","STSong","Noto Serif SC",serif;font-weight:600}
.rc-tile .rc-p{font-size:13px;color:var(--ink3);opacity:0;transition:opacity .2s}
.rc-tile.rc-reveal .rc-p{opacity:1}
.rc-tile.rc-ok{border-color:var(--jade);background:var(--jadebg)}.rc-tile.rc-ok .rc-p{color:var(--jade);font-weight:500}
.rc-tile.rc-bad{border-color:var(--cin);background:var(--redbg)}.rc-tile.rc-bad .rc-p{color:var(--cin2)}
.rc-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 0}
.rc-done .rc-st{width:90px;height:90px;border-radius:24px;background:var(--cin);border:3px solid var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:16px}
.rc-done h3{font-size:22px;font-weight:500;margin:0 0 4px}
.rc-done p{font-size:14px;color:var(--ink2);margin:0 0 20px}
.rc-done button{width:100%;max-width:280px;background:var(--cin);color:#fff;border:none;border-radius:14px;padding:15px;font-family:inherit;font-size:16px;font-weight:500}
.rc-done button.rc-ghost{background:transparent;border:1px solid var(--line);color:var(--ink2);margin-top:8px;font-size:15px;padding:14px}
.rc-done button.rc-prem{background:transparent;border:1px solid var(--line);color:var(--cin2);margin-top:8px;font-size:15px;padding:14px}
.rc-loading{padding:60px 20px;text-align:center;color:var(--ink3)}


/* --- Talaffuz mashqi (pr-) --- */
.pr-wrap{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.pr-top{display:flex;align-items:center;gap:11px;padding:calc(14px + var(--safe-t)) 16px 8px;z-index:3}
.pr-ix{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:18px;display:flex;align-items:center;justify-content:center}

/* ---------- Keng ekran (Telegram Desktop / brauzer) ----------
   Bo'sh joy mobil kartalarni CHO'ZISH bilan emas, yon ustun bilan
   to'ldiriladi. Yo'lakcha va butun o'qish oqimi o'z kengligida qoladi. */
.crail{display:none}
@media (min-width:900px){
  :root{--shell:940px}
  /* Sarlavha ham CHAP ustunda qoladi: 940px ga cho'zilgan sarlavha o'rtasi
     bo'sh ko'rinardi. Yon ustun ikkala qatorni egallaydi. */
  #s-course{display:grid;grid-template-columns:minmax(0,var(--read)) minmax(0,1fr);
    grid-template-areas:"head rail" "main rail";column-gap:26px;align-items:start}
  #s-course .chead{grid-area:head}
  #s-course .cmain{grid-area:main;min-width:0}
  #s-course .crail{grid-area:rail;display:block;position:sticky;top:calc(var(--safe-t) + 14px);
    padding:0 16px 0 0;display:flex;flex-direction:column;gap:12px}
  /* Reja yon ustunda to'liq ko'ringani uchun tasma takrorlanmaydi. */
  #s-course .today{display:none}
  /* Pastki menyu chap ustun ostida turadi — ekran o'rtasida emas, aks holda
     u yo'lakcha bilan tekislanmay qolardi. */
  .nav{left:calc(50% - var(--shell) / 2);right:auto;margin:0;width:var(--read)}
  /* Kurs xaritasidan boshqa ekranlar keng ekranda cho'zilmaydi. */
  #s-mashq,#s-rating,#s-profile,#s-voice{max-width:var(--read);margin:0 auto;width:100%}
  .rl-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
  .rl-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;
    font-weight:600;color:var(--ink2);margin-bottom:10px}
  .rl-h b{color:var(--ink);font-size:13px}
  .rl-task{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font-family:inherit;
    background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    margin-bottom:7px;font-size:13.5px;color:var(--ink)}
  .rl-task i{font-size:16px;color:var(--ink3);flex-shrink:0}
  .rl-task.done{border-style:dashed;color:var(--ink3)}
  .rl-task.done i{color:var(--jade)}
  .rl-task.lock{opacity:.55}
  .rl-done{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--jade);font-weight:500}
}

}

function cardAudioTexts(c){
  if(!c)return [];
  var out=[];
  var w=c.word||{};
  if(w.zh)out.push(w.zh);
  if(c.phrase)out.push(c.phrase);
  if(c.audio_text)out.push(c.audio_text);
  if(c.type==="reverse_builder"&&c.zh)out.push(c.zh);
  if(c.type==="_basics"&&c.steps)c.steps.forEach(function(s){if(s.zh)out.push(s.zh)});
  if(c.type==="_grammar"&&c.g&&c.g.examples)c.g.examples.slice(0,2).forEach(function(e){if(e.zh)out.push(e.zh)});
  if(c.type==="_dialogue"&&c.d&&c.d.dialogue)c.d.dialogue.slice(0,3).forEach(function(l){if(l.zh)out.push(l.zh)});
  return out;
}

function allLessons(){var a=[];(MAP.units||[]).forEach(function(u){(u.lessons||[]).forEach(function(l){a.push(l)})});return a}
var LESSON_DATA_CACHE={},LESSON_DATA_PROMISES={},PRACTICE_PREFETCHED=false;
function cloneJson(v){return JSON.parse(JSON.stringify(v))}
function lessonDataKey(lv,n){return normalizeLevel(lv)+"-"+String(Number(n)||0)}
function lessonDataUrl(lv,n){return "/course_v3_data/"+normalizeLevel(lv)+"/lesson_"+String(Number(n)||0).padStart(2,"0")+".json"}
function loadLessonData(lv,n){
  var key=lessonDataKey(lv,n);
  if(LESSON_DATA_CACHE[key])return Promise.resolve(cloneJson(LESSON_DATA_CACHE[key]));
  if(LESSON_DATA_PROMISES[key])return LESSON_DATA_PROMISES[key].then(cloneJson);
  LESSON_DATA_PROMISES[key]=fetch(lessonDataUrl(lv,n)).then(function(r){
    if(!r.ok)throw new Error("not_found");
    return r.json();
  }).then(function(d){
    LESSON_DATA_CACHE[key]=d;
    delete LESSON_DATA_PROMISES[key];
    return d;
  }).catch(function(err){
    delete LESSON_DATA_PROMISES[key];
    throw err;
  });
  return LESSON_DATA_PROMISES[key].then(cloneJson);
}
function idleRun(fn){
  if("requestIdleCallback" in window)return requestIdleCallback(fn,{timeout:1400});
  return setTimeout(fn,450);
}
function prefetchPracticeAssets(){
  if(PRACTICE_PREFETCHED)return;

function showCourseAd(placement,idx){
  return new Promise(function(resolve,reject){
    var l=allLessons()[idx];if(!l){reject(new Error("lesson_not_found"));return}
    fetchCourseAds(placement,l).then(function(ads){
      var t=T();

      var contBtn=$("#ad-sub-cont"),payBtn=$("#ad-sub-pay"),visit=$("#ad-visit");

      payBtn.innerHTML='<i class="ti ti-lock-open"></i> '+t.adSubPay;
      $("#adov").classList.add("on");$("#adov").setAttribute("aria-hidden","false");
      clearInterval(AD_STATE.timer);
      /* Reklamalarni ketma-ket ko'rsatamiz: har biri o'z majburiy vaqtida.
         Oxirgisi tugagach — "Obuna ol / Reklama bilan davom etish" bloki. */
      function playAd(i){
        var ad=ads[i],duration=adDuration(ad),isLast=(i>=ads.length-1),multi=ads.length>1;
        clearInterval(AD_STATE.timer);clearTimeout(AD_STATE.loadTimer);resetAdVideo(video);
        AD_STATE={timer:null,loadTimer:null,resolve:resolve,reject:reject,ad:ad,lesson:l,placement:placement,watched:0,ready:false,busy:false};
        $("#ad-label").textContent=adPlacementTitle(placement)+(multi?" · "+(i+1)+"/"+ads.length:"");
        $("#ad-title").textContent=ad.title||adPlacementTitle(placement);
        $("#ad-note").textContent=t.adNote;
        var hasLink=!!ad.link_url;
        if(hasLink){$("#ad-visit-t").textContent=t.adVisit;visit.hidden=false}else{visit.hidden=true}
        stopAdPromo();$("#adov").classList.remove("done");
        $("#ad-video-wrap").style.display="";
        $("#ad-video-wrap").style.cursor=hasLink?"pointer":"default";
        contBtn.disabled=false;contBtn.innerHTML='<i class="ti ti-arrow-right"></i> '+t.adSubCont;
        /* Pastdagi tugma normal oqimda ko'rinmaydi — faqat xatolikda "qayta yuklash"
           bo'lib chiqadi. Sanoq faqat tepada (#ad-count) ko'rsatiladi. */
        setAdSubscribeVisible(false);btn.style.display="none";btn.disabled=true;
        count.textContent="...";
        setAdStatus(adUiText("loading"));
        var srcBase=ad.media_url,loadAttempt=0;
        var left=duration,timer=null,started=false,failed=false;
        /* Videoni o'rnatish. bust=true bo'lsa cache'ni chetlab o'tish uchun
           ?r=timestamp qo'shadi (buzilgan/yarim keshlangan javobni aylanib o'tish). */
        function setSrc(bust){
          try{video.pause()}catch(e){}
          video.removeAttribute("src");try{video.load()}catch(e){}
          video.src=bust?srcBase+(srcBase.indexOf("?")>=0?"&":"?")+"r="+Date.now():srcBase;
          video.loop=true;video.muted=true;
          try{video.load()}catch(e){}
        }
        function armGuard(ms){clearTimeout(AD_STATE.loadTimer);AD_STATE.loadTimer=setTimeout(onLoadTimeout,ms)}
        function tryPlay(){var p;try{p=video.play()}catch(e){}if(p&&p.then)p.then(startCountdown).catch(function(){if(video.readyState>=2)startCountdown()})}
        /* Guard ishga tushdi: video hali tayyor emas. Sekin tarmoq bo'lishi mumkin,
           shuning uchun DARROV xato bermaymiz — 2 martagacha jimgina (cache-bust bilan)
           qayta yuklab, uzunroq kutamiz; shundan keyingina manual "qayta yuklash". */
        function onLoadTimeout(){
          if(started||failed||AD_STATE.ad!==ad)return;
          if(video.readyState>=2){startCountdown();return}
          if(loadAttempt<2){loadAttempt++;setAdStatus(adUiText("loading"));setSrc(true);armGuard(loadAttempt>=2?16000:12000);tryPlay();return}
          mediaFailed();
        }
        /* Qattiq <video> error hodisasi — avval bir marta cache-bust bilan qayta
           urinib ko'ramiz (vaqtinchalik tarmoq uzilishi), keyin manual retry. */
        function onMediaError(){
          if(started||failed||AD_STATE.ad!==ad)return;
          if(loadAttempt<2){loadAttempt++;setAdStatus(adUiText("loading"));setSrc(true);armGuard(12000);tryPlay();return}
          mediaFailed();
        }
        function draw(){
          count.textContent=left>0?left+"s":"OK";
          if(left>0){
            /* Sanoq davom etmoqda — pastda tugma yo'q, faqat tepadagi sekund. */
            btn.style.display="none";setAdSubscribeVisible(false);
            return;
          }
          if(!isLast){
            /* bu reklama tugadi — ko'rilgani yoziladi va keyingisiga o'tiladi */
            recordCourseAdView(ad,placement,l,duration).catch(function(){});
            playAd(i+1);
          }else{
            /* BARCHA reklamalar tugadi — videoni to'xtatib yashiramiz, so'ng
               obuna (aniq foydalar bilan) / reklama bilan davom etish bloki chiqadi */
            try{video.pause()}catch(e){}
            $("#ad-video-wrap").style.display="none";
            $("#adov").classList.add("done");startAdPromo();
            AD_STATE.ready=true;btn.style.display="none";setAdSubscribeVisible(true);
          }
        }
        function startCountdown(){
          if(started||failed||AD_STATE.ad!==ad)return;
          started=true;clearTimeout(AD_STATE.loadTimer);setAdStatus("");
          draw();
          timer=setInterval(function(){
            left=Math.max(0,left-1);AD_STATE.watched=duration-left;
            if(left<=0)clearInterval(timer);
            draw();
          },1000);
          AD_STATE.timer=timer;
        }
        function failAdFlow(){
          if(AD_STATE.ad!==ad)return;
          var rej=AD_STATE.reject||reject;
          _closeAdOverlay();
          _resetAdState();
          if(rej)rej(new Error("course_ad_media_failed"));
        }
        function mediaFailed(){
          if(started||failed||AD_STATE.ad!==ad)return;
          failed=true;
          clearTimeout(AD_STATE.loadTimer);clearInterval(AD_STATE.timer);
          AD_STATE.ready=false;AD_STATE.watched=0;
          try{video.pause()}catch(e){}
          setAdStatus(adUiText("failed"));
          $("#ad-note").textContent=adUiText("failedNote");
          count.textContent="!";
          btn.style.display="";btn.disabled=false;
          btn.innerHTML='<i class="ti ti-arrow-right"></i> '+t.adReady;
          btn.onclick=function(ev){if(ev)ev.stopPropagation();failAdFlow()};
          setTimeout(failAdFlow,1600);
        }
        video.onloadedmetadata=tryPlay;
        video.onloadeddata=startCountdown;
        video.oncanplay=startCountdown;
        video.onplaying=startCountdown;
        video.ontimeupdate=startCountdown;
        video.onerror=onMediaError;
        /* stalled/waiting — bu buferlash, MEDIA xatosi EMAS: faqat guard'ni uzaytiramiz.
           Ma'lumot kelishi bilan load hodisalari sanoqni boshlaydi va guard'ni tozalaydi. */
        video.onstalled=video.onwaiting=function(){if(started||failed||AD_STATE.ad!==ad)return;armGuard(12000)};
        setSrc(false);
        /* Birinchi guard 12s (eski 8s soxta xato berardi). Tayyor bo'lmasa onLoadTimeout
           cache-bust bilan 2 marta jimgina qayta uradi (12s/16s), shundan keyin manual. */
        armGuard(12000);
        /* Cache'dan qayta ochilganda (2-3-reklama) load hodisalari qayta otilmasligi
           mumkin — agar media allaqachon tayyor bo'lsa, sanoqni darhol boshlaymiz. */
        if(video.readyState>=2)startCountdown();
        /* Muted autoplay bloklanishi (Telegram WebView'da gesture'siz) MEDIA xatosi EMAS:
           catch'da darrov xato bermaymiz, video baribir load hodisalari/guard orqali hal bo'ladi. */
        tryPlay();
      }
      playAd(0);
    }).catch(function(){reject(new Error("course_ad_not_found"))});
  });
}

function drawTrails(){
  document.querySelectorAll("#s-course .path").forEach(function(p){
    var old=p.querySelector("svg.trail");if(old)old.remove();
    var nodes=p.querySelectorAll(".node");if(nodes.length<2)return;
    var pr=p.getBoundingClientRect();if(pr.width<10||pr.height<10)return;
    var pts=[];nodes.forEach(function(n){var r=n.getBoundingClientRect();pts.push([Math.round(r.left+r.width/2-pr.left),Math.round(r.top+r.height/2-pr.top)])});
    var d="M"+pts[0][0]+" "+pts[0][1];
    for(var i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i],my=Math.round((a[1]+b[1])/2);d+=" C"+a[0]+" "+my+" "+b[0]+" "+my+" "+b[0]+" "+b[1]}
    var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("class","trail");
    svg.setAttribute("viewBox","0 0 "+Math.round(pr.width)+" "+Math.round(pr.height));
    svg.setAttribute("preserveAspectRatio","none");
    svg.innerHTML='<path d="'+d+'" fill="none" stroke="#ebe2cc" stroke-width="34" stroke-linecap="round"/>'
      +'<path d="'+d+'" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="4" stroke-dasharray="0.5 16" stroke-linecap="round"/>';
    p.insertBefore(svg,p.firstChild);
  });
}

function openLessonSheet(idx){

  if(l.status==="locked"){return offerSkipTest(idx)}
  var names=partSecs(l),n=names.length;

  var secs=names.map(function(s,k){var cls=k<prog?"done":(k===prog&&l.status==="current"?"cur":"lock");var ic=cls==="done"?'<i class="ti ti-check"></i>':(cls==="cur"?'<i class="ti ti-player-play"></i>':'<i class="ti ti-lock"></i>');return '<div class="sec '+cls+'"><span class="si2">'+ic+'</span><b>'+(k+1)+'. '+s+'</b></div>'}).join("");

      :'<button class="scta ghost" onclick="startLesson('+idx+')"><i class="ti ti-refresh"></i> '+T().repeat+'</button>';

function buildTestQueue(d){
  var GR=["meaning_guess","pinyin_choice","translation_choice","hanzi_choice","gap_fill","listening_choice","quick_quiz","sentence_builder","match_pairs"];
  var pool=[];
  (d.sections||[]).forEach(function(sec){(sec.cards||[]).forEach(function(c){if(GR.indexOf(c.type)>=0){var cc={};for(var k in c)cc[k]=c[k];pool.push(cc)}})});
  var wordsArr=(d.active_words||[]).map(function(w){return {word:w}});
  (d.active_words||[]).slice(0,8).forEach(function(w,i){pool.push({type:(i%2?"_word_pick_hanzi":"_word_pick_meaning"),word:w,words:wordsArr})});
  pool=pool.map(function(v){return {v:v,s:Math.random()}}).sort(function(a,b){return a.s-b.s}).map(function(x){return x.v}).slice(0,6);
  var lbl=skipI18n().offerTag;
  pool.forEach(function(c){c._sNo=1;c._sTitle=lbl});
  return pool;
}

function applyLocalProgress(completed){
  if(!MAP)return;
  completed=Math.max(0,Number(completed||0));
  MAP.progress=MAP.progress||{};
  MAP.progress.completed=completed;
  var paid=!!(PROF&&PROF.is_paid);
  allLessons().forEach(function(l){
    if(!paid&&l.locked_premium&&l.n>completed){l.status="locked";return}
    if(l.n<=completed){l.status="done";if(!l.stars)l.stars=2}
    else if(l.n===completed+1){l.status="current";delete l.stars}
    else{l.status="locked";delete l.stars}
  });
}
function unlockSkipLesson(idx,pct){
  var l=allLessons()[idx];
  if(!l)return Promise.reject(new Error("lesson_missing"));
  if(!INIT_DATA){
    return Promise.resolve({ok:true,completed_lessons_count:Math.max(Number(MAP&&MAP.progress&&MAP.progress.completed||0),Number(l.n||1)-1)});
  }
  return _apiPost("/api/v3/lesson/unlock",{
    level:(MAP&&MAP.level)||"hsk1",
    lesson_id:l.n,

}

Foundation.restoreQueue=function(saved){

  });

Foundation.scheduleRepair=function(c,guided,attempt){
  var result=null;
  for(var r=Foundation.i+1;r<Foundation.queue.length;r++)if(Foundation.queue[r]&&Foundation.queue[r].type==="result"){result=Foundation.queue.splice(r,1)[0];break}
  var desired=Foundation.i+3,spacers=Math.max(0,desired-Foundation.queue.length);
  for(var s=0;s<spacers;s++)Foundation.queue.push({type:"_foundation_repair_spacer",_repairSpacer:true,_sourceCard:c,card_id:"spacer:"+c.card_id+":"+attempt+":"+s});
  var clone={};for(var k in c)clone[k]=c[k];clone._repair=true;clone._guided=!!guided;clone._attempt=Number(attempt||2);

};

}

/* ---------- Panda maskot kirish effektlari ----------
   Panda chiqadigan har bir bayram/bo'lim shu effektlardan biri bilan
   boshlanadi: fly (supermen parvozi), land (osmondan changli qo'nish),
   zoom (uzoqdan otilib chiqish), roll (dumalab kirish), pop (sakrash).

function fxOff(){try{return !!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)}catch(e){return false}}
function pandaDust(el,n,spread){
  if(!el)return;
  n=n||11;spread=spread||44;
  for(var i=0;i<n;i++){(function(i){
    var s=document.createElement("span");s.className="sk-dust";
    s.style.left="50%";s.style.bottom="0px";
    el.appendChild(s);
    var dir=i%2?1:-1,dx=dir*(12+Math.random()*spread),dy=-(2+Math.random()*12),sc=.6+Math.random()*1.4;
    if(s.animate)s.animate([
      {opacity:0,transform:"translate(-50%,0) scale(.35)"},
      {opacity:.85,transform:"translate(calc(-50% + "+Math.round(dx*.55)+"px),"+Math.round(dy)+"px) scale("+sc.toFixed(2)+")",offset:.32},
      {opacity:0,transform:"translate(calc(-50% + "+Math.round(dx)+"px),"+Math.round(dy*.4)+"px) scale("+(sc*1.3).toFixed(2)+")"}
    ],{duration:640+Math.round(Math.random()*260),easing:"cubic-bezier(.2,.7,.4,1)"});
    setTimeout(function(){s.remove()},980);
  })(i)}
}

/* Parvoz sahnasi: uch barobar baland "dunyo" (yer + daraxtlar + bulutlar +
   osmon). Panda o'rnida qoladi, dunyo pastga siljiydi — kamera ko'tarilgandek. */
function skyScene(){
  var root=document.getElementById("lu-sky");
  if(!root)return null;
  if(!root.getAttribute("data-built")){
    var C=[[6,14,.95,78],[62,21,.8,58],[16,30,.9,96],[68,38,.75,66],[8,47,.7,74],[56,55,.6,54],[30,62,.5,46]],clouds="";
    C.forEach(function(c){clouds+='<div class="sky-cloud" style="left:'+c[0]+'%;top:'+c[1]+'%;width:'+c[3]+'px;opacity:'+c[2]+'">'+cloudSvg()+'</div>'});
    var G=[[3,78,0],[17,54,3],[76,92,4],[64,62,1],[90,58,0],[28,40,5],[57,44,5]],trees="";
    G.forEach(function(g){trees+='<div class="sky-tree" style="left:'+g[0]+'%;width:'+g[1]+'px">'+scenerySvg(g[2])+'</div>'});
    root.innerHTML='<div class="sky-world" id="sky-world">'+clouds
      +'<div class="sky-ground">'+trees+'<div class="sky-shadow" id="sky-shadow"></div></div></div>'
      +'<div class="sky-wind" id="sky-wind">'+windHtml()+'</div>';
    root.setAttribute("data-built","1");

}

    if(sky){
      /* Dunyo pastga siljiydi = kamera osmonga ko'tariladi.

   (yaqin kadr, ekranning qolgan qismi hali yo'q). Effekt tugab, chang
   o'tirgach — `build()` sahnani quradi va u navbat bilan ochiladi. */
function cinePanda(kind,mood,build){
  var ov=$("#levelup"),cine=$("#lu-cine"),stage=$("#lu-stage"),shown=false,tm=0;
  function reveal(){
    if(shown)return;shown=true;
    clearTimeout(tm);ov.removeEventListener("click",reveal);
    ov.classList.remove("cine");
    if(cine)cine.innerHTML="";
    build();
    if(stage){stage.classList.remove("rev");void stage.offsetWidth;stage.classList.add("rev")}
  }
  if(!cine||!cine.animate||fxOff()){ov.classList.remove("cine");if(stage)stage.classList.remove("rev");build();return}
  stage.innerHTML="";$("#lu-panda").innerHTML="";
  /* Osmon sahnasi faqat parvozda ko'rinadi */
  var sky=$("#lu-sky");if(sky&&kind!=="fly")sky.style.opacity="0";
  cine.innerHTML='<div class="cine-pd">'+pandaChar(mood||"celebrate")+'</div>';
  ov.classList.add("cine");ov.classList.add("on");
  requestAnimationFrame(function(){pandaFx(cine.querySelector(".cine-pd"),kind)});
  /* Kutmoqchi bo'lmaganlar uchun: ekranga tegish effektni o'tkazib yuboradi */
  ov.addEventListener("click",reveal);
  tm=setTimeout(reveal,(PANDA_FX_DUR[kind]||900)+300);

  function premium(){App.goPay("v3_test_limit")}

  function shell(){
    return '<div id="tc-root">'
      +'<div id="tc-hub"><div class="top"><button class="ix" onclick="TEST.close()" aria-label="Orqaga"><i class="ti ti-arrow-left"></i></button><h1 id="tc-title"></h1></div>'

  /* ---- gate ---- */
  function newRef(){try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID()}catch(e){}return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12)}
  function gateRef(key,create){var k="hsk_gate_"+key,v="";try{v=sessionStorage.getItem(k)||""}catch(e){v=GATE_REFS[k]||""}if(!v&&create){v=newRef();GATE_REFS[k]=v;try{sessionStorage.setItem(k,v)}catch(e){}}return v}
  function clearGateRef(key){var k="hsk_gate_"+key;delete GATE_REFS[k];try{sessionStorage.removeItem(k)}catch(e){}}
  function runGate(feature,ref){
    return fetch("/api/v3/practice/daily-gate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:INIT_DATA,feature:feature,ref:ref})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j}}).catch(function(){return {ok:r.ok,status:r.status,j:{}}})});
  }

  /* ---- hub ---- */
  function renderHub(){
    if(!el("tc-title"))return;
    var t=L();
    el("tc-title").textContent=t.title;el("tc-sub").textContent=t.sub;
    el("tc-ptitle").textContent=t.pTitle;el("tc-psub").textContent=t.pSub;el("tc-pbtn").textContent=t.pBtn;
    el("tc-exhead").textContent=t.exHead;
    var myN=lvNum(),mine_t=MINE_T[LANG]||MINE_T.uz;
    var list=EXAMS.slice().sort(function(a,b){return (Number(b.lvl)===myN)-(Number(a.lvl)===myN)});
    el("tc-exlist").innerHTML=list.map(function(e){
      var mine=Number(e.lvl)===myN;
      var tags=e.tags.map(function(x){return '<span>'+esc(t[x])+'</span>'}).join("");
      if(mine)tags='<span style="background:var(--cinbg);color:var(--cin2);font-weight:600"><i class="ti ti-target-arrow"></i> '+esc(mine_t)+'</span>'+tags;
      return '<div class="ex"'+(mine?' style="border-color:var(--cin)"':'')+' onclick="TEST.open2(\'hsk'+e.lvl+'\')"><div class="lvl"><b>HSK</b><span>'+e.lvl+'</span></div><div class="et"><b>HSK '+e.lvl+'</b><small>'+e.q+' '+esc(t.q)+' · '+e.min+' '+esc(t.min)+'</small><div class="tags">'+tags+'</div></div><span class="go">'+esc(t.start)+'</span></div>';
    }).join("");
  }
  function showHub(){try{stopSpeak()}catch(e){}
    el("tc-hub").style.display="block";el("tc-empty").classList.remove("on");
    el("tc-placement").classList.remove("on");el("tc-exam").classList.remove("on");}
  function showEmpty(){
    var t=L();
    el("tc-hub").style.display="none";el("tc-placement").classList.remove("on");el("tc-exam").classList.remove("on");
    el("tc-empty").innerHTML='<div class="ic"><i class="ti ti-wifi-off"></i></div><h3>'+esc(t.eTitle)+'</h3><p>'+esc(t.eSub)+'</p><button onclick="TEST.showHub()"><i class="ti ti-arrow-left"></i> '+esc(t.eBack)+'</button>';
    el("tc-empty").classList.add("on");
  }
  function showLimit(adAvailable){
    var t=L();
    if(window.CourseAds&&CourseAds.showLimitPromo){
      CourseAds.showLimitPromo({adAvailable:!!(adAvailable&&PENDING),onSubscribe:premium,onContinueAd:adStart,onBack:showHub});return;
    }
    el("tc-hub").style.display="none";el("tc-placement").classList.remove("on");el("tc-exam").classList.remove("on");
    var e=el("tc-empty");
    var adBtn=(adAvailable&&PENDING)?'<button onclick="TEST.adStart()"><i class="ti ti-player-play"></i> '+esc(t.adCont)+'</button>':'';
    e.innerHTML='<div class="ic"><i class="ti ti-lock"></i></div><h3>'+esc(t.limTitle)+'</h3><p>'+esc((adAvailable&&PENDING)?t.adLimSub:t.limSub)+'</p>'+adBtn
      +'<button onclick="TEST.premium()" style="margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--cin2)"><i class="ti ti-crown"></i> '+esc(t.limPay)+'</button>'
      +'<button onclick="TEST.close()" style="margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--ink2)">'+esc(t.limBack)+'</button>';
    e.classList.add("on");
  }
  function adStart(){
    if(!PENDING)return;
    var feature=PENDING.feature,which=PENDING.which,ref=PENDING.accessRef;
    if(!window.CourseAds){showEmpty();return}
    CourseAds.config({feature:feature});
    CourseAds.play("start",ref).then(function(){
      AD_SESSION=true;AD_MID=false;AD_END=false;
      if(which==="placement")runPlacement();else openExam2(which,true);
    }).catch(function(){AD_SESSION=false;showEmpty()});
  }
  function open2(which){
    var feature=which==="placement"?"placement":"training_test";
    var ref=gateRef(feature+":"+which,true);
    PENDING={which:which,feature:feature,accessRef:ref};
    if(which!=="placement"){AD_SESSION=false;AD_MID=false;AD_END=false;openExam2(which,false);return}
    runGate(feature,ref).then(function(o){
      if(!live())return;
      if(o.status===403){showLimit(o.j&&o.j.ad&&o.j.ad.available);return}
      if(!o.ok||!o.j||!o.j.ok){showEmpty();return}
      AD_SESSION=false;openExam2(which);
    }).catch(function(){if(live()){AD_SESSION=false;showEmpty()}});
  }
  function openExam2(which,adSupported){
    if(which==="placement")return runPlacement();
    var ref=(PENDING&&PENDING.accessRef)||gateRef("training_test:"+which,true);
    fetch("/api/v3/exams/start",{method:"POST",headers:{"X-Telegram-Init-Data":INIT_DATA,"Content-Type":"application/json"},body:JSON.stringify({level:which,lang:LANG,access_ref:ref,ad_supported:!!adSupported})})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,status:r.status,d:d}})})
      .then(function(o){
        if(!live())return;
        var data=o.d&&o.d.session;
        if(!o.ok||!o.d||!o.d.ok){
          var err=(o.d&&o.d.error)||"";
          if(o.status===403||err==="free_feature_limit_reached"||err==="ad_authorization_required"){showLimit(!(o.d&&o.d.ad&&o.d.ad.available===false));return}
          throw new Error("exam_start");
        }
        if(!data||!data.questions||!data.questions.length)throw new Error("exam_start");
        runExam(data);
      }).catch(function(){if(live())showEmpty()});
  }
  function replayExam(){var level=(EXD&&EXD.level)||"hsk1";clearGateRef("training_test:"+level);open2(level)}
  function replayPlacement(){clearGateRef("placement:placement");open2("placement")}

  /* ---- imtihon ---- */
  function runExam(data){
    EXD=data;EQ=(data.questions||[]).map(function(q){return {q:q,key:q.section||((q.source||{}).section)||"reading"}});
    ei=0;eans=[];EX_SUBMITTING=false;
    if(!EQ.length)return showEmpty();
    el("tc-hub").style.display="none";el("tc-empty").classList.remove("on");el("tc-placement").classList.remove("on");el("tc-exam").classList.add("on");
    exRender();
  }
  function exRender(){
    if(!live())return;
    if(AD_SESSION&&!AD_MID&&EQ.length>=4&&ei===Math.floor(EQ.length/2)){AD_MID=true;if(window.CourseAds){CourseAds.play("middle").then(exRender).catch(exRender);return}}
    var t=L(),m=EM(),item=EQ[ei],q=item.q;
    var lv=String(EXD.level||"").replace("hsk","").toUpperCase();
    var lead=m.sec[item.key]||item.key,card="";
    if(q.audio_text){
      card='<div class="qcard"><button class="abtn" onclick="TEST.say(\''+jsq(q.audio_text)+'\')"><i class="ti ti-volume"></i></button>'+(q.sentence?'<div class="qzh han">'+esc(q.sentence)+'</div>':'')+'<div class="ahint">'+esc(m.listen)+'</div></div>';
      setTimeout(function(){if(live())speak(q.audio_text)},300);
    }else{
      card='<div class="qcard"><div class="qzh han">'+esc(q.sentence||"")+'</div></div>';
    }
    var opts=(q.options||[]).map(function(o,k){return '<button class="opt" onclick="TEST.exPick('+k+',this)"><span class="k">'+("ABCD"[k]||(k+1))+'</span><span>'+esc(examLabel(o))+'</span></button>'}).join("");
    var stem=examStem(q);
    el("tc-exam").innerHTML='<div class="ptop"><button class="ix2" onclick="TEST.exitExam()"><i class="ti ti-x"></i></button><div class="pbar"><i style="width:'+Math.round(ei/EQ.length*100)+'%"></i></div><span class="lvtag">HSK '+lv+' · '+Number(EXD.duration_min||0)+' '+esc(t.min)+'</span></div>'
      +'<div class="qlead">'+esc(lead)+' · '+esc(m.q)+' '+(ei+1)+' '+esc(m.of)+' '+EQ.length+'</div>'+card
      +(stem?'<div class="qlead" style="text-align:center;margin-top:-6px">'+esc(stem)+'</div>':'')+opts;
  }
  function exPick(k,node){
    var q=EQ[ei].q;
    Array.prototype.forEach.call(document.querySelectorAll("#tc-exam .opt"),function(o){o.style.pointerEvents="none"});
    node.classList.add("sel");
    eans[ei]={question_id:String(q.id||""),selected_index:k};
    try{stopSpeak()}catch(e){}
    setTimeout(function(){if(!live())return;ei++;if(ei>=EQ.length){exResult()}else{exRender()}},280);
  }
  function exitExam(){try{stopSpeak()}catch(e){}showHub()}
  function exResult(){
    if(AD_SESSION&&!AD_END){AD_END=true;if(window.CourseAds){CourseAds.play("end").then(exResult).catch(exResult);return}}
    submitExam();
  }
  function submitExam(){
    if(EX_SUBMITTING)return;EX_SUBMITTING=true;
    var m=EM();
    el("tc-exam").innerHTML='<div class="res"><div class="lvl"><small>'+esc(m.result)+'</small><b><i class="ti ti-loader-2"></i></b></div><h3>'+esc(m.saving)+'</h3></div>';
    fetch("/api/v3/exams/complete",{method:"POST",headers:{"X-Telegram-Init-Data":INIT_DATA,"Content-Type":"application/json"},body:JSON.stringify({session_id:EXD.id,answers:eans})})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d}})})
      .then(function(o){
        if(!live())return;
        if(!o.ok||!o.d||!o.d.ok)throw new Error("exam_complete");
        EX_SUBMITTING=false;clearGateRef("training_test:"+EXD.level);renderExamResult(o.d);
      })
      .catch(function(){
        if(!live())return;
        EX_SUBMITTING=false;
        el("tc-exam").innerHTML='<div class="res"><div class="lvl"><small>'+esc(m.result)+'</small><b>!</b></div><h3>'+esc(m.saveErr)+'</h3><button class="cta" onclick="TEST.submit()"><i class="ti ti-refresh"></i> '+esc(m.retry)+'</button><button class="ghost" onclick="TEST.showHub()">'+esc(m.toList)+'</button></div>';
      });
  }
  function renderExamResult(d){
    var m=EM();
    var pct=Number(d.percent||0),pass=!!d.passed,lv=String(EXD.level||"").replace("hsk","").toUpperCase();
    var sections=d.section_scores||{},order=["listening","reading","writing"].filter(function(k){return sections[k]&&Number(sections[k].total||0)>0});
    var meter=order.map(function(key){var p=Number(sections[key].percent||0);return '<div class="mrow"><span class="ml">'+esc(m.sec[key]||key)+'</span><span class="mb"><i style="width:'+p+'%"></i></span><span class="mv">'+p+'%</span></div>'}).join("");
    var wrong=(d.wrong_items||[]).slice(0,4);
    var review=wrong.length?'<div class="review-list"><b>'+esc(m.mistakes)+'</b>'+wrong.map(function(w){var detail=[w.pinyin,w.translation].filter(function(v,i,a){return v&&a.indexOf(v)===i}).map(function(v){return '<small>'+esc(v)+'</small>'}).join('');return '<div><span>'+esc(w.question||"")+'</span><strong>✓ '+esc(w.correct_answer||"")+'</strong>'+detail+'</div>'}).join('')+'</div>':'';
    var xp=Number(d.reward&&d.reward.awarded_xp||0),xpHtml=xp?'<p class="xp-line">+'+xp+' XP · '+esc(m.xp)+'</p>':'';
    el("tc-exam").innerHTML='<div class="res"><div class="lvl"><small>'+esc(m.result)+'</small><b>'+pct+'%</b></div>'
      +'<h3>'+esc(pass?m.passed:m.failed)+'</h3><p>'+esc(pass?m.passSub:m.failSub)+lv+'.</p>'+xpHtml
      +'<div class="meter">'+meter+'</div>'+review
      +'<button class="cta" onclick="TEST.replayExam()"><i class="ti ti-refresh"></i> '+esc(m.again)+'</button>'
      +'<button class="ghost" onclick="TEST.showHub()">'+esc(m.toList)+'</button></div>';
  }

  /* ---- daraja aniqlash ---- */

/* ---- hold-to-talk mic ---- */
var mic=null;

function endHoldEvent(e){
  if(e)e.preventDefault();
  if(!holdAt)return;
  holdAt=0;
  if(!holdOk){setHold(started?L.holdMic:"");return;}
  /* Yozuv uzunligi mikrofon ochilgan paytdan hisoblanadi — sessiya ulanish
     kechikishi "juda qisqa" xatosiga sabab bo'lmasligi uchun. */
  if(!recAt||Date.now()-recAt<MIN_HOLD_MS){cancelRecording();setStatus(L.holdLonger);setHold(L.holdMic);return;}
  stopRecording();
}
function beginHold(){holdOk=true;recAt=0;startRecording()}

function pickMime(){var c=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac","audio/ogg;codecs=opus"];
  if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return"";
  for(var i=0;i<c.length;i++){if(MediaRecorder.isTypeSupported(c[i]))return c[i]}return""}
function startRecording(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){clog("mic_nosupport","",{md:!!navigator.mediaDevices,gum:!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),mr:!!window.MediaRecorder});setStatus(L.noSupport);holdOk=false;return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if(!holdOk){try{stream.getTracks().forEach(function(t){t.stop()})}catch(e){}return;}
    mediaStream=stream;var mime=pickMime();chunks=[];
    var opts={audioBitsPerSecond:32000};if(mime)opts.mimeType=mime;
    try{mediaRecorder=new MediaRecorder(stream,opts)}catch(_){mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}
    mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size>0)chunks.push(e.data)};
    mediaRecorder.onstop=onStopped;mediaRecorder.start(250);recAt=Date.now();
    try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}
    mic.classList.add("rec");setChar("listen");setStatus(L.listening);setHold(L.releaseMic);
    clearTimeout(autoStop);autoStop=setTimeout(function(){holdAt=0;stopRecording()},MAX_REC_MS);
  }).catch(function(err){clog("mic_deny",(err&&err.name)||"",{});holdOk=false;mic.classList.remove("rec");setStatus(L.micDeny)});
}
function stopRecording(){
  clearTimeout(autoStop);mic.classList.remove("rec");holdOk=false;recAt=0;
  if(mediaRecorder&&mediaRecorder.state!=="inactive"){setChar("talk");setStatus(L.analyzing);setHold("");mediaRecorder.stop()}
}
function cancelRecording(){
  clearTimeout(autoStop);mic.classList.remove("rec");holdOk=false;recAt=0;chunks=[];
  try{if(mediaRecorder&&mediaRecorder.state!=="inactive"){mediaRecorder.onstop=null;mediaRecorder.stop()}}catch(e){}
  try{if(mediaStream)mediaStream.getTracks().forEach(function(t){t.stop()})}catch(e){}
  mediaStream=null;mediaRecorder=null;setChar("happy");
}
function stopHard(){clearTimeout(autoStop);holdAt=0;holdOk=false;recAt=0;try{if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop()}catch(e){}try{if(mediaStream)mediaStream.getTracks().forEach(function(t){t.stop()})}catch(e){}mediaStream=null}
function extFromMime(mt){mt=(mt||"").toLowerCase();if(/mp4|m4a|aac/.test(mt))return"mp4";if(/ogg/.test(mt))return"ogg";if(/mpeg|mp3/.test(mt))return"mp3";if(/wav/.test(mt))return"wav";return"webm"}
function onStopped(){
  var mt=(mediaRecorder&&mediaRecorder.mimeType)||"audio/webm";
  var blob=new Blob(chunks,{type:mt});
  try{if(mediaStream)mediaStream.getTracks().forEach(function(t){t.stop()})}catch(e){}mediaStream=null;
  if(blob.size<MIN_BYTES){setChar("happy");setStatus(L.tooShort);setHold(L.holdMic);return;}
  busy=true;micBusy(true);setChar("talk");setStatus(L.analyzing);addTyping();
  var _ext=extFromMime(blob.type||mt);
  var fd=new FormData();fd.append("initData",initData());fd.append("session_id",sess);fd.append("audio",blob,"voice."+_ext);
  fetch("/api/voice-practice/message",{method:"POST",body:fd}).then(jr)
    .then(function(o){busy=false;micBusy(false);dropTyping();var heard=(o&&o.j&&o.j.heard)||"";clog("mic_result",(o&&o.ok)?"ok":"fail",{mime:blob.type||mt,ext:_ext,size:blob.size,heard:(""+heard).slice(0,24)});if(!o.ok){onMsgError(o);return}renderReply(o.j)})
    .catch(function(){busy=false;micBusy(false);dropTyping();clog("mic_neterr","",{mime:blob.type||mt,ext:_ext,size:blob.size});setChar("happy");setStatus(L.sendErr);setHold(L.holdMic)});
}

/* ---- typed message ---- */
function sendText(){
  var t=$("kbText"),txt=(t.value||"").trim();
  if(busy||!txt)return;
  if(!started){startSession().then(function(ok){if(ok)sendText()});return;}
  t.value="";t.style.height="auto";syncSend();
  busy=true;micBusy(true);setChar("talk");setStatus(L.analyzing);
  addMe(txt,"");addTyping();
  var fd=new FormData();fd.append("initData",initData());fd.append("session_id",sess);fd.append("text",txt);
  fetch("/api/voice-practice/message",{method:"POST",body:fd}).then(jr)
    .then(function(o){busy=false;micBusy(false);dropTyping();if(!o.ok){onMsgError(o);return}renderReply(o.j,true)})
    .catch(function(){busy=false;micBusy(false);dropTyping();setChar("happy");setStatus(L.sendErr)});
}

function onMsgError(o){
  setChar("happy");setHold(L.holdMic);
  var code=o.j&&o.j.code;
  if(code==="LIMIT_EXCEEDED"){showPaywall();return;}
  if(code==="SESSION_NOT_FOUND"){started=false;sess=null;setStatus(L.sendErr);return;}
  setStatus(L.sendErr);
}
function renderReply(res,skipUser){
  if(!res){setStatus("");return;}
  turn=Number(res.turn_count)||turn+1;if(res.max_dialogs)maxDialogs=Number(res.max_dialogs);setCnt();
  if(!skipUser&&res.transcription)addMe(res.transcription,res.correction||"");
  else if(skipUser&&res.correction){var last=chatEl().querySelector(".msg.me:last-child .bub");
    if(last&&!last.querySelector(".fx")){var f=document.createElement("div");f.className="fx";f.innerHTML='<b>'+esc(L.fixLabel)+'</b> '+esc(res.correction);last.appendChild(f)}}
  addAi(res.chinese_reply||"",res.pinyin||"",res.translation||"");
  setChar("talk");setStatus(L.speaking);speak(res.chinese_reply||"");ring(persona==="li"?[523,659]:[587,740]);
  if(res.session_should_end){setTimeout(endCall,1300);return;}
  setTimeout(function(){if(started){setChar("happy");setStatus("");setHold(L.holdMic)}},1100);
}
function endCall(){
  closeSettings();closeHints();

  stopHard();stopSpeak();var sid=sess;started=false;sess=null;

    body:JSON.stringify({initData:initData(),session_id:sid})}).then(function(r){return r.json()})
   .then(function(j){showDoneResult(j||{})})
   .catch(function(){showDoneResult({message_count:turn})});

function txRow(t){
  var good=!!t.good;
  var h='<div class="txr '+(good?"g":"m")+'"><div class="u"><b>'+L.heard+'</b> '+esc(t.user||"")+'</div>';
  if(!good&&t.correction)h+='<div class="fx"><b>'+L.fixLabel+'</b> '+esc(t.correction)+'</div>';

    h+='<div class="ai"><div class="lbl">'+esc(PERS[persona].name)+'</div>'
      +'<div class="azh han">'+esc(t.assistant)+'</div>';
    if(t.pinyin)h+='<div class="apy">'+esc(t.pinyin)+'</div>';
    if(t.translation)h+='<div class="atr">'+esc(t.translation)+'</div>';
    h+='</div>';
  }

  j=j||{};

    +'<div class="stat m"><div class="n">'+bad+'</div><div class="l">'+L.statMistake+'</div></div>';
  var body="";

  sess=null;turn=0;started=false;busy=false;
  wire();init();
}
var API={open:open,close:leave,endCall:endCall,openSettings:openSettings,closeSettings:closeSettings,
  swap:swap,toggleSub:toggleSub,toggleRate:toggleRate,openHints:openHints,closeHints:closeHints,
  openKb:openKb,closeKb:closeKb,sendText:sendText,toggleDialog:toggleDialog,reset:reset,
  goBack:goBack,goPremium:goPremium};
return API;
})();

function renderAll(){
  document.querySelectorAll("#nav [data-i]").forEach(function(s){s.textContent=T().nav[s.dataset.i]});
  if(MAP){renderCourse();renderMashq();renderRating();renderProfile();if(SCREEN==="voice")renderVoice()}
}
