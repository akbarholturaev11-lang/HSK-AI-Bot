$("#sheet").onclick=function(){App.closeSheet()};
$("#paywall").onclick=function(){App.closePaywall()};
window.openLessonSheet=openLessonSheet;window.startLesson=startLesson;window.App=App;window.Flow=Flow;window.speak=speak;
(function(){
  var bootLevel=getSelectedLevel();
  if(!INIT_DATA){showAuthGate();return;}
  loadCourseMap(bootLevel).then(function(res){
    if(!res.data){showAuthGate();return;}
    var d=res.data;
    hideAuthGate();MAP=d;adoptServerLang(d);adoptBotUsername(d);adoptStudySetup(d);setSelectedLevel(MAP.level||bootLevel);if(d.user)PROF=d.user;syncNotify();
    var bootParams=new URLSearchParams(location.search);
    /* Server onboarding source of truth. localStorage faqat tez cache: boshqa
       qurilma yoki cache tozalanganda server holati noto'g'ri redirectni to'xtatadi. */
    if(d.user&&d.user.onboarding_completed===false){
      var onbQuery=new URLSearchParams(bootParams.toString());onbQuery.set("lang",LANG);
      location.replace("/course_v3_onboarding.html?"+onbQuery.toString());return;
    }
    if(d.user&&typeof d.user.onboarding_completed!=="boolean"){
      var cachedOnboarding=false;try{cachedOnboarding=!!localStorage.getItem("hsk_v3_onb")}catch(e){}
      if(!cachedOnboarding&&!bootParams.get("onboarded")){
        var fallbackQuery=new URLSearchParams(bootParams.toString());fallbackQuery.set("lang",LANG);
        location.replace("/course_v3_onboarding.html?"+fallbackQuery.toString());return;
      }
    }
    if(d.user&&d.user.onboarding_completed===true){try{localStorage.setItem("hsk_v3_onb","1")}catch(e){}}
    renderAll();
    /* Avvalgi kunlarda dars qilgan, lekin savolga hali javob bermagan
       o'quvchi (masalan boshqa qurilmada tugatgan) — xarita chizilgach
       so'raymiz. Yopib yuborsa 24 soat qayta so'ralmaydi. */
    if(STUDY_SETUP&&STUDY_SETUP.pending&&studySetupPending())setTimeout(askStudyTime,1200);
    prefetchNearbyLessons();
    var sp=bootParams;
    App.show(sp.get("tab")||"course");
    var initialLesson=Number(sp.get("lesson")||0);
    // resume=1: aniq lesson berilmagan bo'lsa, server progresidan JORIY qismni
    // (status==="current") topib darhol ochamiz — botdagi "Davom" / profil
    // tugmasi bir bosishda foydalanuvchi turgan darsni ochadi.
    if(initialLesson<=0&&sp.get("resume")==="1"){
      var all=allLessons();
      var ci=-1;all.forEach(function(l,i){if(ci<0&&l.status==="current")ci=i});
      if(ci<0)all.forEach(function(l,i){if(ci<0&&l.status!=="done")ci=i});
      if(ci>=0)initialLesson=Number(all[ci].n)||0;
    }
    function openInitialLesson(){
      if(initialLesson<=0)return;
      var idx=-1;allLessons().forEach(function(l,i){if(Number(l.n)===initialLesson)idx=i});
      if(idx>=0)setTimeout(function(){
        App.show("course");
        if(sp.get("autostart")==="1"){
          startLesson(idx);
          try{sp.delete("autostart");history.replaceState(null,"",location.pathname+"?"+sp.toString()+location.hash)}catch(e){}
        }else openLessonSheet(idx);
      },80);
    }
    var challengeId=Number(sp.get("challenge_id")||0);
    function launchBootIntents(skipAppOpenAd){
      openInitialLesson();
      if(challengeId>0)setTimeout(function(){openChallengeById(challengeId)},180);
      if(sp.get("tour")==="1"){var td=false;try{td=!!localStorage.getItem("hsk_v3_tour")}catch(e){}if(!td)setTimeout(function(){App.runTour()},500)}
      if(!skipAppOpenAd)maybeShowAppOpenAd({lesson:initialLesson,challenge:challengeId,tour:sp.get("tour")==="1"});
    }
    var fs=foundationMapState();
    var foundationRequired=normalizeLevel(MAP.level)==="hsk1"&&!foundationIsComplete()&&(sp.get("foundation")==="1"||fs.required===true||fs.foundation_required===true);
    /* Starter majburiy bo'lsa deep-link, tour va app-open reklama uning ustiga
       chiqmaydi. Foundation tugagach asl intent davom etadi; reklama esa bu
       birinchi natija sessiyasida butunlay o'tkazib yuboriladi. */
    if(foundationRequired){startFoundationFromMap(false,function(){launchBootIntents(true)})}else launchBootIntents(false);
  });
})();

/* App reklamasi — Mini App ochilganda markazda chiqadi.
   Boshqa ekran (dars, chellenj, tur) darrov ochilayotgan bo'lsa chiqmaydi:
   foydalanuvchi bosgan amal reklamadan ustun turadi. */
function maybeShowAppOpenAd(ctx){
  if(!INIT_DATA)return;
  if(ctx&&(ctx.lesson>0||ctx.challenge>0||ctx.tour))return;
  if(!window.CourseAds||typeof CourseAds.playAppOpen!=="function")return;
  CourseAds.config({lang:LANG,initData:INIT_DATA,level:(MAP&&MAP.level)||"hsk1"});
  setTimeout(function(){try{CourseAds.playAppOpen()}catch(e){}},600);
}

/* ---------- Orqaga qaytish ----------------------------------------------
   Chap chetdan swipe, Telegram BackButton va Android hardware back —
   uchalasi ham AYNAN bitta `NavBack.goBack()` ni chaqiradi. Yangi navigatsiya
   mantig'i yaratilmaydi: har bir qatlam o'zining MAVJUD yopish funksiyasini
   ishlatadi, shuning uchun `×` tugmasi bilan swipe bir xil natija beradi. */
var NavBack={
  EDGE:24,   /* faqat ekran chap chetidagi shu zonadan boshlangan swipe */
  MIN:88,    /* shu masofadan keyin qaytish bajariladi (70-100px talabi) */
  /* Qatlamlar ustkisidan boshlab tekshiriladi. */
  LAYERS:[
    {id:"tour",    close:function(){App.tourEnd()}},
    {id:"sheet",   close:function(){App.closeSheet()}},
    {id:"upov",    close:function(){closeUserProfile()}},
    {id:"writeov", close:function(){App.closeWriter()}},
    {id:"secov",  close:function(){if(SECTION&&SECTION.close)SECTION.close()}},
    {id:"flow",    close:function(){App.exitFlow()}}
  ],
  /* Bular ochiq bo'lsa orqaga qaytish UMUMAN ishlamaydi: to'lov va reklama
     gate'i hamda mukofot ketma-ketligi aylanib o'tilmasligi shart. */
  BLOCK:["paywall","adov","levelup"],
  _guarded:false,_g:null,
  _on:function(id){var e=document.getElementById(id);return !!(e&&e.classList.contains("on"))},
  blocked:function(){for(var i=0;i<NavBack.BLOCK.length;i++)if(NavBack._on(NavBack.BLOCK[i]))return true;return false},
  top:function(){
    if(NavBack.blocked())return null;
    for(var i=0;i<NavBack.LAYERS.length;i++)if(NavBack._on(NavBack.LAYERS[i].id))return NavBack.LAYERS[i];
    return null;
  },
  /* "history bo'lmasa hech narsa qilmasin" — qaytadigan joy bo'lmasa false. */
  canGoBack:function(){
    if(NavBack.blocked())return false;
    return !!NavBack.top()||SCREEN!=="course";
  },
  goBack:function(){
    if(NavBack.blocked())return false;
    var l=NavBack.top();
    if(l){try{l.close()}catch(e){}return true}
    if(SCREEN!=="course"){
      try{App.show("course")}catch(e){return false}
      /* Oldingi sahifa chapdan yengil kirib keladi (jonli peek emas —
         tab ekranlari `display` bilan almashadi, ularni gesture paytida
         bir vaqtda ko'rsatish document scroll holatini buzardi). */
      var c=$("#s-course");
      if(c&&!NavBack._reduced()){
        c.classList.add("nb-drag");c.style.transform="translateX(-22%)";c.style.opacity=".6";
        requestAnimationFrame(function(){requestAnimationFrame(function(){
          c.classList.remove("nb-drag");c.classList.add("nb-snap");
          c.style.transform="";c.style.opacity="";
          setTimeout(function(){c.classList.remove("nb-snap")},240);
        })});
      }
      return true;
    }
    return false;
  },
  _reduced:function(){try{return window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}},

  /* --- Telegram BackButton + Android hardware back --- */
  sync:function(){
    var can=NavBack.canGoBack();
    try{if(tg&&tg.BackButton){can?tg.BackButton.show():tg.BackButton.hide()}}catch(e){}
    /* Android "back" ni ushlash uchun bitta zaxira history yozuvi kerak.
       U popstate'da iste'mol qilinadi va qaytish bo'lsa qayta qo'yiladi. */
    if(can&&!NavBack._guarded){
      try{history.pushState({hskNavBack:1},"");NavBack._guarded=true}catch(e){}
    }
  },
  onPop:function(){
    NavBack._guarded=false;
    if(NavBack.goBack()){
      try{history.pushState({hskNavBack:1},"");NavBack._guarded=true}catch(e){}
      NavBack.sync();
    }
    /* Qaytadigan joy bo'lmasa hech narsa qilinmaydi — Telegram o'zi yopadi. */
  },

  /* --- Chap chetdan swipe --- */
  _s:null,
  target:function(){
    var l=NavBack.top();
    if(l)return document.getElementById(l.id);
    if(SCREEN!=="course"){var e=$("#s-"+SCREEN);if(e&&e.classList.contains("on"))return e}
    return null;
  },
  start:function(ev){
    if(NavBack._s||ev.touches.length!==1)return;
    var t=ev.touches[0];
    if(t.clientX>NavBack.EDGE)return;              /* faqat chap chet */
    if(!NavBack.canGoBack())return;
    var el=NavBack.target();if(!el)return;
    NavBack._s={x:t.clientX,y:t.clientY,el:el,live:false,dead:false,w:window.innerWidth||360};
  },
  move:function(ev){
    var s=NavBack._s;if(!s||s.dead)return;
    if(ev.touches.length!==1){NavBack.cancel();return}
    var t=ev.touches[0],dx=t.clientX-s.x,dy=t.clientY-s.y;
    if(!s.live){
      /* Yo'nalish hal bo'lguncha kutamiz: vertikal harakat bo'lsa gesture
         bekor qilinadi va sahifa odatdagidek scroll bo'ladi. */
      if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){s.dead=true;return}
      if(dx<10)return;
      s.live=true;s.el.classList.add("nb-drag");
      s.scrim=document.createElement("div");s.scrim.className="nb-scrim";
      s.el.parentNode.insertBefore(s.scrim,s.el);
    }
    if(dx<0)dx=0;
    /* Telegram/brauzerning o'z gorizontal gesture'ini bostiramiz. */
    if(ev.cancelable)ev.preventDefault();
    s.dx=dx;
    s.el.style.transform="translateX("+dx+"px)";
    if(s.scrim)s.scrim.style.opacity=String(Math.max(0,.18-(dx/s.w)*.18));
  },
  end:function(){
    var s=NavBack._s;if(!s)return;
    if(!s.live||s.dead){NavBack._s=null;return}
    var done=(s.dx||0)>=NavBack.MIN;
    var el=s.el,scrim=s.scrim;
    el.classList.remove("nb-drag");el.classList.add("nb-snap");
    el.style.transform=done?"translateX("+s.w+"px)":"";
    if(scrim)scrim.style.opacity="0";
    NavBack._s=null;
    setTimeout(function(){
      el.classList.remove("nb-snap");el.style.transform="";
      if(scrim&&scrim.parentNode)scrim.parentNode.removeChild(scrim);
      if(done){NavBack.goBack();NavBack.sync()}
    },done?200:220);
    if(done)haptic("light");
  },
  cancel:function(){
    var s=NavBack._s;if(!s)return;
    NavBack._s=null;
    if(!s.live)return;
    s.el.classList.remove("nb-drag");s.el.classList.add("nb-snap");s.el.style.transform="";
    if(s.scrim&&s.scrim.parentNode)s.scrim.parentNode.removeChild(s.scrim);
    setTimeout(function(){s.el.classList.remove("nb-snap")},220);
  },

  init:function(){
    try{if(tg&&tg.BackButton&&tg.BackButton.onClick)tg.BackButton.onClick(function(){NavBack.goBack();NavBack.sync()})}catch(e){}
    window.addEventListener("popstate",NavBack.onPop);
    document.addEventListener("touchstart",NavBack.start,{passive:true});
    document.addEventListener("touchmove",NavBack.move,{passive:false});
    document.addEventListener("touchend",NavBack.end,{passive:true});
    document.addEventListener("touchcancel",NavBack.cancel,{passive:true});
    /* Qatlam ochilishi/yopilishini kuzatamiz — mavjud `open/close`
       funksiyalariga tegmaslik uchun MutationObserver ishlatiladi. */
    try{
      var ids=NavBack.LAYERS.map(function(l){return l.id}).concat(NavBack.BLOCK)
        .concat(["s-course","s-mashq","s-voice","s-rating","s-profile"]);
      var ob=new MutationObserver(function(){NavBack.sync()});
      ids.forEach(function(id){var e=document.getElementById(id);if(e)ob.observe(e,{attributes:true,attributeFilter:["class"]})});
    }catch(e){}
    NavBack.sync();
  }
};
NavBack.init();
</script>
