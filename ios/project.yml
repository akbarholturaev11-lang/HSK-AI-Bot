name: HSKAI

options:
  bundleIdPrefix: com.pomp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"

targets:
  HSKAI:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - HSKAITests
    sources:
      - path: HSKAI
        excludes:
          - Resources
    resources:
      - path: HSKAI/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pomp.hskai
        PRODUCT_NAME: HSKAI
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: HSKAI/Support/Info.plist
      properties:
        CFBundleDisplayName: HSK AI
        CFBundleDevelopmentRegion: uz
        CFBundleLocalizations:
          - uz
          - ru
          - tg
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSMicrophoneUsageDescription: HSK AI talaffuz va AI Voice mashqlari uchun mikrofondan foydalanadi.
        CFBundleURLTypes:
          - CFBundleURLName: com.pomp.hskai
            CFBundleURLSchemes:
              - pomp-hsk-ai

  HSKAIWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HSKAIWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pomp.hskai.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HSK AI
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: YES
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework

  HSKAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HSKAITests
    dependencies:
      - target: HSKAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pomp.hskai.tests
        GENERATE_INFOPLIST_FILE: YES
