name: HSK offline Mandarin audio full rollout

on:
  push:
    branches:
      - feat/offline-tts-pilot-20261013
    paths:
      - ".github/workflows/offline-hsk-audio-rollout.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hsk-offline-tts-rollout
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/offline-tts-pilot-20261013
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal TTS runtime
        run: python -m pip install edge-tts==7.2.8
      - name: Safely finish all missing offline audio outside Railway
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for batch in $(seq 1 30); do
            echo "Offline TTS batch $batch (at most 150 new files)"
            set +e
            python scripts/build_hsk_offline_audio.py --limit 150 --delay 2
            result=$?
            set -e

            # Persist each completed batch: a later failure must not lose MP3s.
            git add -f android/app/src/main/assets/audio/words/
            if git diff --cached --quiet; then
              if [ "$result" -ne 0 ]; then
                echo "Provider failed and no assets could be generated." >&2
                exit 1
              fi
              echo "No missing files left; rollout complete."
              break
            fi
            git commit -m "feat(tts): add offline HSK audio batch $batch"
            git push origin HEAD:feat/offline-tts-pilot-20261013

            if [ "$result" -ne 0 ]; then
              echo "Pausing rollout after provider failures; completed MP3s saved." >&2
              exit 1
            fi
          done
          python scripts/build_hsk_offline_audio.py --dry-run
