name: Analytics integrity

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  analytics-integrity:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa-only
          POSTGRES_DB: analytics_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qa -d analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      ANALYTICS_TEST_DATABASE_URL: postgresql+asyncpg://qa:qa-only@127.0.0.1:5432/analytics_test
      ADMIN_PWA_TEST_DATABASE_URL: postgresql+asyncpg://qa:qa-only@127.0.0.1:5432/analytics_test
      DATABASE_URL: postgresql+asyncpg://qa:qa-only@127.0.0.1:5432/analytics_test
      BOT_TOKEN: "9123456:synthetic-test-only-unusable-token"
      REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check event inventory and analytics impact
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$DIFF_BASE" || "$DIFF_BASE" =~ ^0+$ ]]; then
            # A newly created ref has no previous commit; compare its fork point.
            DIFF_BASE="$(git merge-base "refs/remotes/origin/$DEFAULT_BRANCH" "$DIFF_HEAD")"
          fi
          python scripts/check_analytics_coverage.py --base "$DIFF_BASE" --head "$DIFF_HEAD" --mode "$GITHUB_EVENT_NAME"
      - name: Install pinned app and test dependencies
        run: python -m pip install -r requirements.txt "pytest==8.4.2" "aiosqlite==0.21.0"
      - name: Run analytics contracts and PostgreSQL baseline
        env:
          MONITORING_CHAIN_PROOF: ${{ runner.temp }}/monitoring-chain-proof.txt
        run: >-
          python -m pytest -q -rs
          tests/test_analytics_coverage_contract.py
          tests/test_monitoring_coverage_contract.py
          tests/test_admin_pwa_v10_regression.py
          tests/test_admin_pwa_platform_scope.py
          tests/test_checkout_transport_marker.py
          tests/test_analytics_platform_chain.py
          tests/test_admin_pwa_pro_funnel.py
          tests/test_pwa_pro_funnel_chain.py
          tests/test_admin_pwa_report_freshness.py
          tests/test_admin_pwa_analytics.py
          tests/test_android_analytics_service.py
          tests/test_subscription_entry_analytics_service.py
          tests/test_subscription_entry_client_0155_migration.py
      - name: Check monitoring chain proof
        env:
          MONITORING_CHAIN_PROOF: ${{ runner.temp }}/monitoring-chain-proof.txt
        # Every covered monitoring entry must have been proven by the shared
        # chain helper in the pytest run above; skipped tests leave no proof.
        run: python scripts/check_analytics_coverage.py --chain-proof "$MONITORING_CHAIN_PROOF"
