name: HSK offline MP3 static index

on:
  push:
    branches:
      - feat/offline-tts-pilot-20261013
    paths:
      - ".github/workflows/hsk-offline-static-index.yml"
      - "tests/test_tts_service.py"
      - "tests/test_offline_hsk_audio.py"
      - "app/static/course-v3.html"
      - "scripts/build_hsk_offline_audio.py"
      - "scripts/check_offline_audio_client.cjs"
      - "app/static/audio/words-client.js"
      - "app/main.py"
      - "app/static/course_v3_pronunciation.html"
      - "app/static/course_v3_recognition.html"
      - "app/static/course_v3_memorize.html"
      - "app/static/course_v3_test.html"
      - "app/static/hsk-lugat.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/offline-tts-pilot-20261013
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install httpx==0.28.1 edge-tts==7.2.8
      - name: Generate full static audio index from shipped MP3s
        run: |
          python scripts/build_hsk_offline_audio.py --write-index
          python scripts/build_hsk_offline_audio.py --dry-run
      - name: Check static assets, Python and Mini App first-play regressions
        run: |
          python -m py_compile app/main.py scripts/build_hsk_offline_audio.py
          python -m unittest -v tests.test_offline_hsk_audio tests.test_miniapp_tts_first_listen tests.test_tts_service
          node scripts/check_offline_audio_client.cjs
      - name: Commit index, never regenerate MP3s on Railway
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/audio/words-index.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(tts): publish cached index of 4579 offline Mandarin recordings"
            git push origin HEAD:feat/offline-tts-pilot-20261013
          fi
