name: Desktop auth and UI contracts

on:
  pull_request:
    paths:
      - "desktop/ui/**"
      - "localization/ui/**"
      - "scripts/i18n_build_desktop_catalogs.py"
      - "tests/test_i18n_desktop_catalog_adoption.py"
      - "desktop/src-tauri/**"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - "tests/e2e/test_desktop_provider_identity.py"
      - "tests/e2e/test_desktop_telegram_identity.py"
      - "tests/e2e/test_desktop_ui_preview.py"
      - ".github/workflows/desktop-ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Run desktop UI and native sign-in contracts
        working-directory: desktop
        run: node --test ui/test-contract.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check canonical Desktop UI catalog
        run: |
          python scripts/i18n_build_desktop_catalogs.py --check
          python -m unittest tests.test_i18n_desktop_catalog_adoption
      - name: Install browser test dependencies
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Check provider and Telegram attachment on both desktop layouts
        run: python -m pytest -q tests/e2e/test_desktop_provider_identity.py tests/e2e/test_desktop_telegram_identity.py
      - name: Keep the opened course on lesson completion for macOS and Windows
        run: python -m pytest -q tests/e2e/test_desktop_ui_preview.py -k lesson_completion_keeps_the_loaded_course_snapshot

  native-auth:
    name: Native auth (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          # Native auth tests only need the desktop tree. Unrelated generated
          # audio names exceed Windows' path limits during a full checkout.
          sparse-checkout: |
            desktop
            .github/workflows
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-auth-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Check native ownership and lifecycle contracts
        run: cargo test --locked --lib
      - name: Check all native targets and features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
