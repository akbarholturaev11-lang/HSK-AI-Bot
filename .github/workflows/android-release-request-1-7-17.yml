# One-time dispatch of the signed Direct Android 1.7.17 (48) release.
# Only a merged version bump on main can trigger the existing guarded publisher.
name: Request Android 1.7.17 signed release

on:
  push:
    branches: [main]
    paths:
      - "android/app/build.gradle.kts"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Trigger signed Direct APK release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard requested version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'val appVersionName = "1.7.17"' <(sed -n '/^val appVersionName = /p' android/app/build.gradle.kts)
          grep -Fqx 'val appVersionCode = 48' <(sed -n '/^val appVersionCode = /p' android/app/build.gradle.kts)
      - name: Request existing signed release publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run android-release.yml --ref main --field publish_to_r2=true
          echo "Dispatched signed Android 1.7.17 (48) direct APK release."
