name: Validate narrowed existing-R2 OpenSpec plan

on:
  push:
    branches:
      - codex/analytics-openspec-plan-20261030
    paths:
      - .github/workflows/validate-narrowed-analytics-plan.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/analytics-openspec-plan-20261030
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate official OpenSpec artifacts and phase-one scope
        env:
          OPENSPEC_NO_UPDATE_CHECK: '1'
        run: |
          set -euo pipefail
          npm install --global @fission-ai/openspec@latest
          openspec --version
          test -f openspec/config.yaml
          openspec context --json >/tmp/analytics-context.json
          openspec status --change full-journey-analytics --json >/tmp/analytics-status.json
          openspec instructions proposal --change full-journey-analytics --json >/tmp/analytics-proposal-instructions.json
          openspec instructions design --change full-journey-analytics --json >/tmp/analytics-design-instructions.json
          openspec instructions specs --change full-journey-analytics --json >/tmp/analytics-specs-instructions.json
          openspec instructions tasks --change full-journey-analytics --json >/tmp/analytics-tasks-instructions.json
          openspec validate full-journey-analytics --strict
          python - <<'PY'
          from pathlib import Path
          base=Path('openspec/changes/full-journey-analytics')
          tasks=(base/'tasks.md').read_text(encoding='utf8')
          proposal=(base/'proposal.md').read_text(encoding='utf8')
          assert tasks.count('- [ ]')==4, 'Phase one has more than four execution work packages'
          assert 'Smart Reminder' in tasks and 'DEFERRED' in proposal
          assert '22 aggregate objects' in proposal
          print('PLAN_SCOPE_VALID four execution work packages, deferred phase two, R2 inventory noted')
          PY
      - name: Remove disposable CI helper after validation
        run: |
          set -euo pipefail
          git rm .github/workflows/validate-narrowed-analytics-plan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(openspec): remove one-time validation helper [skip ci]"
          git push origin HEAD:codex/analytics-openspec-plan-20261030
