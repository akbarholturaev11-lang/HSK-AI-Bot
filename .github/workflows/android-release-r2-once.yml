name: Android R2 release dispatcher (one shot)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-release-r2-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Android release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run android-release.yml             --repo "${{ github.repository }}"             --ref main             -f publish_to_r2=true
