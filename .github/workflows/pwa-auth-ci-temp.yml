name: Temporary PWA learner auth and login QA
on:
  push:
    branches: [feat/iphone-pwa-browser-auth-p1-20261102]
    paths:
      - ".github/workflows/pwa-auth-ci-temp.yml"
      - "app/api/native_oauth.py"
      - "app/api/pwa_auth.py"
      - "app/services/pwa_auth_service.py"
      - "app/services/desktop_auth_service.py"
      - "app/static/iphone-pwa-login.html"
      - "app/static/iphone-pwa-login.js"
      - "tests/test_pwa_browser_auth.py"
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt aiosqlite
      - name: Check syntax and compile
        run: |
          python -m py_compile app/api/pwa_auth.py app/services/pwa_auth_service.py app/api/native_oauth.py app/services/desktop_auth_service.py tests/test_pwa_browser_auth.py app/main.py
          node --check app/static/iphone-pwa-login.js
      - name: PWA security and login route contract
        run: python -m unittest -v tests.test_pwa_browser_auth
      - name: Existing native OAuth identity and desktop auth regression
        run: python -m unittest -q tests.test_native_oauth_api tests.test_identity_link_service tests.test_desktop_auth_service
      - name: Existing native callback lifecycle without known flaky JWKS fixture
        run: |
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.loadTestsFromName("tests.test_native_oauth_lifecycle")
          selected=unittest.TestSuite()
          def visit(t):
              if isinstance(t,unittest.TestSuite):
                  for child in t: visit(child)
              elif "test_signed_tokens_must_match_the_selected_nonce_domain" not in t.id():
                  selected.addTest(t)
          visit(suite)
          result=unittest.TextTestRunner(verbosity=1).run(selected)
          if not result.wasSuccessful(): raise SystemExit(1)
          PY
