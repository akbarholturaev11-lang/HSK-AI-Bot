name: Temporary PWA browser auth security QA
on:
  push:
    branches:
      - feat/iphone-pwa-browser-auth-p1-20261102
    paths:
      - ".github/workflows/pwa-auth-ci-temp.yml"
      - "app/api/pwa_auth.py"
      - "app/services/pwa_auth_service.py"
      - "app/api/native_oauth.py"
      - "app/services/desktop_auth_service.py"
      - "app/main.py"
      - "app/config.py"
      - "tests/test_pwa_browser_auth.py"
permissions:
  contents: read
jobs:
  pwa-auth-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install existing backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt aiosqlite
      - name: Compile touched Python files
        run: |
          python -m py_compile app/api/pwa_auth.py app/services/pwa_auth_service.py app/api/native_oauth.py app/services/desktop_auth_service.py app/main.py app/config.py tests/test_pwa_browser_auth.py
      - name: New PWA cookie, proof, CSRF and native isolation tests
        run: python -m unittest -v tests.test_pwa_browser_auth
      - name: Existing native OAuth and identity regressions excluding known JWKS fixture
        run: |
          python -m unittest -q tests.test_native_oauth_api tests.test_identity_link_service tests.test_desktop_auth_service
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_native_oauth_lifecycle")
          filtered = unittest.TestSuite()
          def visit(t):
              if isinstance(t, unittest.TestSuite):
                  for child in t:
                      visit(child)
              elif "test_signed_tokens_must_match_the_selected_nonce_domain" not in t.id():
                  filtered.addTest(t)
          visit(suite)
          result = unittest.TextTestRunner(verbosity=1).run(filtered)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Full lifecycle JWT JWKS test (diagnostic only)
        id: candidate_jwks
        continue-on-error: true
        run: python -m unittest -q tests.test_native_oauth_lifecycle.NativeOAuthLifecycleTests.test_signed_tokens_must_match_the_selected_nonce_domain
      - name: Check identical JWKS fixture on unchanged main
        env:
          CANDIDATE_JWKS: ${{ steps.candidate_jwks.outcome }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          mkdir -p /tmp/hsk-main-pwa-baseline
          git archive origin/main | tar -x -C /tmp/hsk-main-pwa-baseline
          cd /tmp/hsk-main-pwa-baseline
          set +e
          python -m unittest -q tests.test_native_oauth_lifecycle.NativeOAuthLifecycleTests.test_signed_tokens_must_match_the_selected_nonce_domain > /tmp/hsk-jwks-main.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Unmodified main JWKS test passes."
            if [ "$CANDIDATE_JWKS" != "success" ]; then
              echo "Candidate failure with green baseline is a regression."
              exit 1
            fi
          elif grep -q "oidc_jwks_unavailable" /tmp/hsk-jwks-main.log; then
            echo "Unmodified main reproduces oidc_jwks_unavailable (intermittent JWKS fixture)."
          else
            tail -80 /tmp/hsk-jwks-main.log
            echo "Unmodified main failed for an unrelated reason."
            exit 1
          fi
