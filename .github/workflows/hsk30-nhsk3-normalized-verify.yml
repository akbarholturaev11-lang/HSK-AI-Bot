name: HSK30 Verify Normalized NHsk3

on:
  push:
    branches: [codex/local-ai]
    paths:
      - ".github/workflows/hsk30-nhsk3-normalized-verify.yml"
      - "scripts/hsk30/verify_nhsk3_normalized.py"
      - "scripts/hsk30/nhsk3_toc_map.json"
      - "scripts/hsk30/normalized/nhsk3/**"
      - "scripts/hsk30/nhsk3_adapter.py"
      - "scripts/hsk30/translations/nhsk3/**"
      - "scripts/hsk30/verify_nhsk3_enrichment.py"
      - "scripts/gen_course_v3_from_seed.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-nhsk3-normalized:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/local-ai
          fetch-depth: 1
          lfs: false
      - run: python scripts/hsk30/verify_nhsk3_normalized.py
      - run: python scripts/hsk30/verify_nhsk3_enrichment.py
      - run: python scripts/gen_course_v3_from_seed.py --track hsk30 --level nhsk3 --dry --no-maps
