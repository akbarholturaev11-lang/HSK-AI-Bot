name: Temporary Android LinkScreen parity PWA QA
on:
  push:
    branches: [feat/iphone-pwa-browser-auth-p1-20261102]
    paths:
      - ".github/workflows/pwa-android-parity-ci-temp.yml"
      - "app/static/iphone-pwa-login.html"
      - "app/static/iphone-pwa-login.js"
      - "tests/test_pwa_browser_auth.py"
      - "localization/ui/**/common.json"
      - "app/static/course_v3_data/hsk-common-i18n.js"
permissions:
  contents: read
jobs:
  pwa-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install existing backend test requirements
        run: pip install -r requirements.txt aiosqlite
      - name: Compile and local-first source/generator checks
        run: |
          python -m py_compile app/api/pwa_auth.py app/services/pwa_auth_service.py app/api/native_oauth.py tests/test_pwa_browser_auth.py
          node --check app/static/iphone-pwa-login.js
          python scripts/i18n_build_local_catalogs.py --check
      - name: Android LinkScreen source-parity and PWA security tests
        run: python -m unittest -v tests.test_pwa_browser_auth
      - name: Existing native OAuth, identity and desktop regressions
        run: python -m unittest -q tests.test_native_oauth_api tests.test_identity_link_service tests.test_desktop_auth_service
