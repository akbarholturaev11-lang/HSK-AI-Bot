name: Temporary cleanup of old test artifacts
on:
  push:
    branches: [feat/admin-pwa-inline-sales-ab-stats-20261026]
    paths: [.github/workflows/temporary-test-artifacts-cleanup.yml]
permissions:
  contents: read
  actions: write
jobs:
  prune-old-test-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remove only obsolete CI report artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import datetime
          import json
          import os
          import subprocess

          repo = os.environ["GH_REPO"]
          raw = subprocess.check_output(
              ["gh", "api", "--paginate", "--jq", ".artifacts[] | @json",
               f"/repos/{repo}/actions/artifacts?per_page=100"], text=True
          )
          artifacts = [json.loads(line) for line in raw.splitlines() if line.strip()]
          # Positive allowlist: never touch APKs, AABs, release assets, sources,
          # backups, or any unknown artifact type.
          def is_disposable(name):
              return (
                  name in {
                      "admin-pwa-browser-synthetic",
                      "hsk-i18n-p0-audit",
                      "hsk-native-postgres-regressions",
                      "android-reports",
                      "android-flow-regressions",
                  } or name.startswith("hsk-i18n-p0-source-contracts-")
              )

          keep = collections.Counter()
          candidates = []
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=2)
          for item in sorted(artifacts, key=lambda x: x.get("created_at", ""), reverse=True):
              name = item.get("name", "")
              if not is_disposable(name) or item.get("expired") or item.get("size_in_bytes", 0) <= 0:
                  continue
              keep[name] += 1
              created = datetime.datetime.fromisoformat(item["created_at"].replace("Z", "+00:00"))
              # Preserve the three newest reports for each exact artifact name,
              # including all reports uploaded during the last two hours.
              if keep[name] <= 3 or created >= cutoff:
                  continue
              candidates.append(item)

          bytes_total = sum(a.get("size_in_bytes", 0) for a in artifacts)
          bytes_selected = sum(a["size_in_bytes"] for a in candidates)
          print(f"Visible artifacts: {len(artifacts)} ({bytes_total / 1048576:.1f} MiB)")
          print(f"Eligible test-only artifacts: {len(candidates)} ({bytes_selected / 1048576:.1f} MiB)")
          print("Release/APK/build artifacts and unknown names remain untouched.")
          deleted = 0
          freed = 0
          # Prefer the largest disposable reports to reclaim quota efficiently.
          for item in sorted(candidates, key=lambda x: x.get("size_in_bytes", 0), reverse=True):
              # Bounded mutation prevents unexpected mass deletion.
              if deleted >= 250:
                  break
              aid = int(item["id"])
              print(f"Deleting old CI report: {item['name']} #{aid} ({item['size_in_bytes'] / 1048576:.1f} MiB)")
              subprocess.check_call(["gh", "api", "-X", "DELETE", f"/repos/{repo}/actions/artifacts/{aid}"])
              deleted += 1
              freed += item["size_in_bytes"]
          print(f"Deleted {deleted} test-only artifacts, reclaimed {freed / 1048576:.1f} MiB (quota refresh may lag).")
          PY
