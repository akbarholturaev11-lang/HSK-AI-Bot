name: Railway build configuration guard

on:
  pull_request:
    paths:
      - "railway.toml"
      - "railpack.json"
      - "tests/test_railway_build_config.py"
      - ".github/workflows/railway-build-config.yml"
  push:
    branches: [main]
    paths:
      - "railway.toml"
      - "railpack.json"
      - "tests/test_railway_build_config.py"
      - ".github/workflows/railway-build-config.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest tests.test_railway_build_config
