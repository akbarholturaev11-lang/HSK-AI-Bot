  pull_request:
    paths:
      - "tests/test_smart_reminder_p0_regression.py"
      - "tests/test_smart_reminder_legacy_evidence.py"
      - "tests/test_smart_reminder_storage.py"
      - "tests/test_smart_reminder_legacy_backfill.py"
      - "tests/test_smart_reminder_preferences.py"
      - "tests/test_smart_reminder_policy.py"
      - "tests/test_smart_reminder_cadence.py"
      - "app/services/smart_reminder_cadence.py"
      - "app/services/smart_reminder_policy*.py"
      - "app/api/smart_reminder.py"
      - "app/services/smart_reminder_preferences.py"
      - "app/services/smart_reminder_lifecycle.py"
      - "tests/test_smart_reminder_lifecycle.py"
      - "app/services/desktop_auth_service.py"
      - "app/services/identity_link_service.py"
      - "app/services/account_deletion_service.py"
      - "app/services/course_reminder_service.py"
      - "app/services/android_push_service.py"
      - "app/services/android_realtime_push_service.py"
      - "app/repositories/course_progress_repo.py"
      - "app/bot/utils/smart_reminder.py"
      - "app/bot/handlers/course.py"
      - "app/bot/handlers/menu.py"
      - "app/bot/handlers/messages.py"
      - "app/bot/keyboards/course.py"
      - "app/main.py"
      - "alembic/versions/0134_smart_reminder_mutations.py"
      - "app/db/models/smart_reminder.py"
      - "app/db/models/__init__.py"
      - "app/repositories/user_repo.py"
      - "tests/test_account_deletion_cleanup.py"
      - "alembic/versions/0133_smart_reminder_storage.py"
      - "scripts/qa_standalone_bootstrap.py"
      - "app/services/smart_reminder_legacy_evidence.py"
      - "app/services/smart_reminder_legacy_backfill.py"
      - "scripts/audit_smart_reminder_legacy.py"
      - "tests/test_miniapp_course_context.py"
      - "tests/test_android_course_api.py"
      - "tests/test_course_miniapp_practice*.py"
      - "tests/test_i18n_miniapp_reservation_asgi.py"
      - "docs/smart-reminders/**"
      - "android/app/src/test/java/com/pomp/hskai/core/notify/**"
      - "android/app/src/main/java/com/pomp/hskai/core/notify/**"
      - "android/app/src/test/java/com/pomp/hskai/core/navigation/DeepLinkRouterTest.kt"
      - "android/app/src/main/java/com/pomp/hskai/core/navigation/DeepLinkRouter.kt"
      - "android/app/src/test/java/com/pomp/hskai/widget/WidgetStoreTest.kt"
      - "android/app/src/test/java/com/pomp/hskai/data/repository/CourseRepositoryTest.kt"
      - "android/app/src/main/java/com/pomp/hskai/data/repository/CourseRepository.kt"
      - "android/app/src/androidTest/java/com/pomp/hskai/core/notify/**"
      - ".github/workflows/smart-reminder-p0.yml"
  push:
    branches:
      - main
      - "codex/smart-reminder-p0-**"
      - "codex/smart-reminder-p1-**"
      - "codex/smart-reminder-p2-**"
    paths:
      - "tests/test_smart_reminder_p0_regression.py"
      - "tests/test_smart_reminder_legacy_evidence.py"
      - "tests/test_smart_reminder_storage.py"
      - "tests/test_smart_reminder_legacy_backfill.py"
      - "tests/test_smart_reminder_preferences.py"
      - "tests/test_smart_reminder_policy.py"
      - "tests/test_smart_reminder_cadence.py"
      - "app/services/smart_reminder_cadence.py"
      - "app/services/smart_reminder_policy*.py"
      - "app/api/smart_reminder.py"
      - "app/services/smart_reminder_preferences.py"
      - "app/services/smart_reminder_lifecycle.py"
      - "tests/test_smart_reminder_lifecycle.py"
      - "app/services/desktop_auth_service.py"
      - "app/services/identity_link_service.py"
      - "app/services/account_deletion_service.py"
      - "app/services/course_reminder_service.py"
      - "app/services/android_push_service.py"
      - "app/services/android_realtime_push_service.py"
      - "app/repositories/course_progress_repo.py"
      - "app/bot/utils/smart_reminder.py"
      - "app/bot/handlers/course.py"
      - "app/bot/handlers/menu.py"
      - "app/bot/handlers/messages.py"
      - "app/bot/keyboards/course.py"
      - "app/main.py"
      - "alembic/versions/0134_smart_reminder_mutations.py"
      - "app/db/models/smart_reminder.py"
      - "app/db/models/__init__.py"
      - "app/repositories/user_repo.py"
      - "tests/test_account_deletion_cleanup.py"
      - "alembic/versions/0133_smart_reminder_storage.py"
      - "scripts/qa_standalone_bootstrap.py"
      - "app/services/smart_reminder_legacy_evidence.py"
      - "app/services/smart_reminder_legacy_backfill.py"
      - "scripts/audit_smart_reminder_legacy.py"
      - "tests/test_miniapp_course_context.py"
      - "tests/test_android_course_api.py"
      - "tests/test_course_miniapp_practice*.py"
      - "tests/test_i18n_miniapp_reservation_asgi.py"
      - "docs/smart-reminders/**"
      - "android/app/src/test/java/com/pomp/hskai/core/notify/**"
      - "android/app/src/main/java/com/pomp/hskai/core/notify/**"
      - "android/app/src/test/java/com/pomp/hskai/core/navigation/DeepLinkRouterTest.kt"
      - "android/app/src/main/java/com/pomp/hskai/core/navigation/DeepLinkRouter.kt"
      - "android/app/src/test/java/com/pomp/hskai/widget/WidgetStoreTest.kt"
      - "android/app/src/test/java/com/pomp/hskai/data/repository/CourseRepositoryTest.kt"
      - "android/app/src/main/java/com/pomp/hskai/data/repository/CourseRepository.kt"
      - "android/app/src/androidTest/java/com/pomp/hskai/core/notify/**"
      - ".github/workflows/smart-reminder-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-reminder-p0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-and-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt aiosqlite
      - name: Compile new P0 tests
        run: |
          python -m py_compile tests/test_smart_reminder_p0_regression.py \
            tests/test_miniapp_course_context.py tests/test_android_course_api.py \
            tests/test_smart_reminder_legacy_evidence.py \
            app/services/smart_reminder_legacy_evidence.py scripts/audit_smart_reminder_legacy.py
      - name: Run actual legacy status and consent baselines
        env:
          BOT_TOKEN: "9123456:synthetic-test-only-unusable-secret"
          DATABASE_URL: "postgresql+asyncpg://qa:qa@127.0.0.1:1/qa"
          REDIS_URL: "redis://127.0.0.1:1/0"
          HSK_STAGING_QA_MODE: "1"
        run: |
          python -m unittest -v \
            tests.test_smart_reminder_p0_regression \
            tests.test_smart_reminder_legacy_evidence \
            tests.test_native_scheduler_transport \
            tests.test_motivation_reminder_service \
            tests.test_android_push \
            tests.test_account_deletion_cleanup \
            tests.test_learning_signals \
            tests.test_course_today_service \
            tests.test_course_daily_window \
            tests.test_course_lesson_completion_proof \
            tests.test_account_deletion_api \
            tests.test_miniapp_course_context \
            tests.test_android_course_api \
            tests.test_course_miniapp_practice \
            tests.test_course_miniapp_practice_progress_window \
            tests.test_i18n_miniapp_reservation_asgi \
            tests.test_course_miniapp_onboarding \
            tests.test_bot_menu_localization \
            tests.test_desktop_auth_service \
            tests.test_android_auth_api \
            tests.test_identity_link_service \
            tests.test_native_oauth_api \
            tests.test_account_deletion_request

  android-jvm-legacy:
    name: Android reminder JVM baseline (Play and Direct)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Require committed Gradle wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Test Play reminders, deep links and offline map authority
        run: |
          ./gradlew --no-daemon testPlayDebugUnitTest \
            --tests "com.pomp.hskai.core.notify.ReminderDecisionTest" \
            --tests "com.pomp.hskai.core.notify.ReminderScheduleTest" \
            --tests "com.pomp.hskai.core.navigation.DeepLinkRouterTest" \
            --tests "com.pomp.hskai.widget.WidgetStoreTest" \
            --tests "com.pomp.hskai.data.repository.CourseRepositoryTest"
      - name: Test Direct reminders, deep links and offline map authority
        run: |
          ./gradlew --no-daemon testDirectDebugUnitTest \
            --tests "com.pomp.hskai.core.notify.ReminderDecisionTest" \
            --tests "com.pomp.hskai.core.notify.ReminderScheduleTest" \
            --tests "com.pomp.hskai.core.navigation.DeepLinkRouterTest" \
            --tests "com.pomp.hskai.widget.WidgetStoreTest" \
            --tests "com.pomp.hskai.data.repository.CourseRepositoryTest"

  smart-storage:
    name: Smart storage migration (SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: smart_qa
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: smart_reminder_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_qa -d smart_reminder_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install repository dependencies
        run: pip install -r requirements.txt aiosqlite
      - name: Compile and test storage, backfill and preference CAS on both engines
        env:
          SMART_REMINDER_TEST_DATABASE_URL: "postgresql+asyncpg://smart_qa:synthetic-ci-only@127.0.0.1:5432/smart_reminder_qa"
          NATIVE_ACCOUNT_TEST_DATABASE_URL: "postgresql+asyncpg://smart_qa:synthetic-ci-only@127.0.0.1:5432/smart_reminder_qa"
          BOT_TOKEN: "9123456:synthetic-test-only-unusable-secret"
          DATABASE_URL: "postgresql+asyncpg://qa:qa@127.0.0.1:1/qa"
          REDIS_URL: "redis://127.0.0.1:1/0"
          HSK_STAGING_QA_MODE: "1"
        run: |
          python -m py_compile app/db/models/smart_reminder.py alembic/versions/0133_smart_reminder_storage.py app/services/smart_reminder_legacy_backfill.py app/services/smart_reminder_preferences.py app/api/smart_reminder.py alembic/versions/0134_smart_reminder_mutations.py app/services/smart_reminder_lifecycle.py
          python -m py_compile app/services/smart_reminder_policy.py app/services/smart_reminder_policy_context.py app/services/smart_reminder_cadence.py tests/test_smart_reminder_policy.py tests/test_smart_reminder_cadence.py
          python -m unittest -v tests.test_smart_reminder_storage tests.test_smart_reminder_legacy_backfill tests.test_smart_reminder_preferences tests.test_smart_reminder_lifecycle tests.test_smart_reminder_policy tests.test_smart_reminder_cadence tests.test_telegram_identity_link tests.test_native_oauth_lifecycle
