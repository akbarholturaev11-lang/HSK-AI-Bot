  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-reminder-p0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-and-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt aiosqlite
      - name: Compile new P0 tests
        run: |
          python -m py_compile tests/test_smart_reminder_p0_regression.py \
            tests/test_miniapp_course_context.py tests/test_android_course_api.py \
            tests/test_smart_reminder_legacy_evidence.py \
            app/services/smart_reminder_legacy_evidence.py scripts/audit_smart_reminder_legacy.py
      - name: Run actual legacy status and consent baselines
        env:
          BOT_TOKEN: "9123456:synthetic-test-only-unusable-secret"
          DATABASE_URL: "postgresql+asyncpg://qa:qa@127.0.0.1:1/qa"
          REDIS_URL: "redis://127.0.0.1:1/0"
          HSK_STAGING_QA_MODE: "1"
        run: |
          python -m unittest -v \
            tests.test_smart_reminder_p0_regression \
            tests.test_smart_reminder_legacy_evidence \
            tests.test_native_scheduler_transport \
            tests.test_motivation_reminder_service \
            tests.test_android_push \
            tests.test_account_deletion_cleanup \
            tests.test_learning_signals \
            tests.test_course_today_service \
            tests.test_course_daily_window \
            tests.test_course_lesson_completion_proof \
            tests.test_account_deletion_api \
            tests.test_miniapp_course_context \
            tests.test_android_course_api \
            tests.test_desktop_course_api \
            tests.test_course_miniapp_practice \
            tests.test_course_miniapp_practice_progress_window \
            tests.test_i18n_miniapp_reservation_asgi \
            tests.test_course_miniapp_onboarding \
            tests.test_bot_menu_localization \
            tests.test_desktop_auth_service \
            tests.test_android_auth_api \
            tests.test_identity_link_service \
            tests.test_native_oauth_api \
            tests.test_account_deletion_request

  android-jvm-legacy:
    name: Android reminder JVM baseline (Play and Direct)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Require committed Gradle wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Test Play reminders, deep links and offline map authority
        run: |
          ./gradlew --no-daemon testPlayDebugUnitTest \
            --tests "com.pomp.hskai.core.notify.SmartStudyBridgeTest" \
            --tests "com.pomp.hskai.data.api.AndroidSmartReminderApiTest" \
            --tests "com.pomp.hskai.core.notify.ReminderDecisionTest" \
            --tests "com.pomp.hskai.core.notify.ReminderScheduleTest" \
            --tests "com.pomp.hskai.core.navigation.DeepLinkRouterTest" \
            --tests "com.pomp.hskai.widget.*" \
            --tests "com.pomp.hskai.core.auth.AuthRepository*" \
            --tests "com.pomp.hskai.data.repository.CourseRepositoryTest"
      - name: Test Direct reminders, deep links and offline map authority
        run: |
          ./gradlew --no-daemon testDirectDebugUnitTest \
            --tests "com.pomp.hskai.core.notify.SmartStudyBridgeTest" \
            --tests "com.pomp.hskai.data.api.AndroidSmartReminderApiTest" \
            --tests "com.pomp.hskai.core.notify.ReminderDecisionTest" \
            --tests "com.pomp.hskai.core.notify.ReminderScheduleTest" \
            --tests "com.pomp.hskai.core.navigation.DeepLinkRouterTest" \
            --tests "com.pomp.hskai.widget.*" \
            --tests "com.pomp.hskai.core.auth.AuthRepository*" \
            --tests "com.pomp.hskai.data.repository.CourseRepositoryTest"

  smart-storage:
    name: Smart storage migration (SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: smart_qa
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: smart_reminder_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_qa -d smart_reminder_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install repository dependencies
        run: pip install -r requirements.txt aiosqlite
      - name: Compile and test storage, backfill and preference CAS on both engines
        env:
          SMART_REMINDER_TEST_DATABASE_URL: "postgresql+asyncpg://smart_qa:synthetic-ci-only@127.0.0.1:5432/smart_reminder_qa"
          NATIVE_ACCOUNT_TEST_DATABASE_URL: "postgresql+asyncpg://smart_qa:synthetic-ci-only@127.0.0.1:5432/smart_reminder_qa"
          ADMIN_PWA_TEST_DATABASE_URL: "postgresql+asyncpg://smart_qa:synthetic-ci-only@127.0.0.1:5432/smart_reminder_qa"
          BOT_TOKEN: "9123456:synthetic-test-only-unusable-secret"
          DATABASE_URL: "postgresql+asyncpg://qa:qa@127.0.0.1:1/qa"
          REDIS_URL: "redis://127.0.0.1:1/0"
          HSK_STAGING_QA_MODE: "1"
        run: |
          python -m py_compile app/smart_reminder_qa.py scripts/smart_reminder_qa_guard.py scripts/smart_reminder_qa_seed.py tests/test_smart_reminder_qa.py app/services/smart_reminder_android.py alembic/versions/0136_smart_android_grants.py tests/test_smart_reminder_android.py scripts/qa_standalone_bootstrap.py app/services/smart_reminder_capabilities.py tests/test_smart_reminder_capabilities.py app/db/models/smart_reminder.py alembic/versions/0133_smart_reminder_storage.py app/services/smart_reminder_legacy_backfill.py app/services/smart_reminder_preferences.py app/api/smart_reminder.py alembic/versions/0134_smart_reminder_mutations.py app/services/smart_reminder_lifecycle.py
          python -m py_compile app/services/smart_reminder_policy.py app/services/smart_reminder_policy_context.py app/services/smart_reminder_cadence.py app/services/smart_reminder_shadow_queue.py app/services/smart_reminder_coordination.py app/services/smart_reminder_shadow_worker.py app/main.py app/config.py tests/test_smart_reminder_coordination.py app/services/smart_widget_context.py app/services/smart_widget_context_service.py app/services/android_course_service.py app/api/android_course.py tests/test_smart_widget_context.py app/services/smart_reminder_telegram.py alembic/versions/0135_smart_reminder_routing.py tests/test_smart_reminder_telegram.py tests/test_smart_reminder_policy.py tests/test_smart_reminder_cadence.py tests/test_smart_reminder_shadow_queue.py
          python -m unittest -v tests.test_smart_reminder_storage tests.test_smart_reminder_legacy_backfill tests.test_smart_reminder_preferences tests.test_smart_reminder_capabilities tests.test_smart_reminder_android tests.test_smart_reminder_qa tests.test_qa_standalone_bootstrap tests.test_smart_reminder_lifecycle tests.test_smart_reminder_policy tests.test_smart_reminder_cadence tests.test_smart_reminder_shadow_queue tests.test_smart_reminder_coordination tests.test_smart_widget_context tests.test_smart_reminder_telegram tests.test_smart_reminder_telegram_content tests.test_course_notification_language tests.test_notification_catalog_runtime tests.test_admin_pwa_notifications tests.test_i18n_notification_catalog_adoption tests.test_telegram_identity_link tests.test_native_oauth_lifecycle

      - name: Validate canonical notification and PWA catalogs
        run: |
          python -m scripts.export_smart_widget_goldens --check
          python scripts/i18n_build_all_catalogs.py --check
          python scripts/i18n_course_ui_catalog_guard.py --output /tmp/smart-course-ui.json
          python scripts/i18n_ui_adoption_audit.py --output /tmp/smart-ui-adoption.json
          python scripts/i18n_baseline_guard.py --output /tmp/smart-i18n-baseline.json
