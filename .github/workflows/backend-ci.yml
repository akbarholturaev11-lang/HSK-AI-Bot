name: Backend targeted tests

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "alembic/**"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt aiosqlite
      - name: Compile backend code
        run: |
          python -m compileall -q app tests
      - name: Run block, feedback, and admin integrity tests
        run: |
          python -m unittest tests.test_bot_block_status_service tests.test_bot_feedback_service tests.test_admin_stats_integrity
      - name: Run Pro trial and anti-abuse regressions
        run: |
          python -m unittest tests.test_pro_trial_service tests.test_trial_risk_service tests.test_trial_risk_entry_points tests.test_admin_limits_api tests.test_trial_entry_points
      - name: Run adjacent reminder and access regressions
        run: |
          python -m unittest tests.test_admin_stats_service tests.test_trial_reminder_service tests.test_motivation_reminder_service tests.test_blocked_user_guard tests.test_blocked_user_guard_cache
      - name: Run device intelligence and app promo regressions
        run: |
          python -m unittest tests.test_user_device_inventory_service tests.test_desktop_download_api tests.test_android_analytics_service tests.test_android_apk_download tests.test_admin_panel_has_no_dead_controls
      - name: Check account deletion request and public instructions
        run: python -m unittest tests.test_account_deletion_request tests.test_public_site
