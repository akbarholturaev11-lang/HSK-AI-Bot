name: Backend targeted tests

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "alembic/**"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      native-postgres:
        image: postgres:18
        env:
          POSTGRES_DB: native_accounts_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d native_accounts_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt aiosqlite
      - name: Check real Android assistant photo decoding
        run: python -m unittest tests.test_android_assistant_service.AssistantImageTransportTests
      - name: Verify onboarding save confirmation and recovery
        run: python -m unittest tests.test_miniapp_onboarding_save_confirmation tests.test_course_miniapp_onboarding
      - name: Run HSK 3.0 lesson limit regression
        run: python -m unittest tests.test_hsk30_lesson_limits tests.test_course_track_service tests.test_hsk30_promo_service tests.test_hsk30_switch_ui_contract tests.test_android_payment_method_dialog_contract
      - name: Run HSK 3.0 currency checkout regressions
        run: python -m unittest tests.test_hsk30_unlock_checkout tests.test_subscription_miniapp_card_banks
      - name: Run learning plan and canonical mistake regressions
        run: |
          python -m unittest tests.test_daily_plan_service tests.test_learning_signals tests.test_course_lesson_mistake_material_service tests.test_android_n1_compat
      - name: Compile backend code
        run: |
          python -m compileall -q app tests
      - name: Run block, feedback, and admin integrity tests
        run: |
          python -m unittest tests.test_bot_block_status_service tests.test_bot_feedback_service tests.test_admin_stats_integrity
      - name: Test one-time receipt previews and adjacent billing regressions
        run: >-
          python -m unittest tests.test_payment_review_preview
          tests.test_subscription_miniapp_submit tests.test_subscription_service
          tests.test_hsk30_admin_payment_flow tests.test_access_state_service
          tests.test_voice_practice_daily_limit
      - name: Check Alembic has exactly one head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"multiple Alembic heads: {heads}")
          print("alembic head:", heads[0])
          PY
      - name: Run Pro trial and anti-abuse regressions
        run: |
          python -m unittest tests.test_pro_trial_service tests.test_trial_risk_service tests.test_trial_risk_entry_points tests.test_admin_limits_api tests.test_trial_entry_points tests.test_referral_trial_contract
      - name: Run adjacent reminder and access regressions
        run: |
          python -m unittest tests.test_admin_stats_service tests.test_trial_reminder_service tests.test_motivation_reminder_service tests.test_blocked_user_guard tests.test_blocked_user_guard_cache
      - name: Run device intelligence and app promo regressions
        run: |
          python -m unittest tests.test_user_device_inventory_service tests.test_desktop_download_api tests.test_android_contextual_app_promo tests.test_android_analytics_service tests.test_android_push tests.test_android_account_notices tests.test_android_apk_download tests.test_admin_panel_has_no_dead_controls
      - name: Run advertisement placement, AI localization and default preset regressions
        run: python -m unittest tests.test_ad_placement_service tests.test_course_ad_types tests.test_course_ad_translation_service tests.test_course_ads_module tests.test_profile_limit_ui_contract tests.test_profile_answer_accuracy
      - name: Check account deletion ownership, retention, migration, and public instructions
        run: >-
          python -m unittest tests.test_admin_delete_safety tests.test_account_deletion_request
          tests.test_account_deletion_api tests.test_account_deletion_cleanup
          tests.test_account_deletion_migration tests.test_public_site
      - name: Check native signup, canonical ownership, and concurrent identity changes
        env:
          NATIVE_ACCOUNT_TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/native_accounts_test
        run: >-
          python -m unittest tests.test_native_account_signup tests.test_native_account_migration
          tests.test_native_account_concurrency tests.test_native_account_learning
          tests.test_native_account_ai_voice tests.test_native_account_lifecycle
          tests.test_native_account_admin tests.test_desktop_provider_accounts
          tests.test_native_account_acceptance tests.test_native_account_rehearsal
          tests.test_native_account_payments tests.test_native_payment_repository
          tests.test_native_payment_migration tests.test_native_payment_discounts_finance
          tests.test_payment_service_receipt_lock
