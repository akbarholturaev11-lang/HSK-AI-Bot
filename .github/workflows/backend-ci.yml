name: Backend targeted tests

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "alembic/**"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt aiosqlite
      - name: Compile changed backend code
        run: |
          python -m compileall -q app tests
      - name: Run block, feedback, and admin integrity tests
        run: |
          python -m unittest             tests.test_bot_block_status_service             tests.test_bot_feedback_service             tests.test_admin_stats_integrity
