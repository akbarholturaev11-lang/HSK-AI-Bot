  workflow_dispatch:

concurrency:
  group: backend-targeted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt aiosqlite
      - name: Smoke import staging ASGI entrypoint without database or Telegram startup
        env:
          HSK_STAGING_QA_MODE: "1"
          RAILWAY_ENVIRONMENT_NAME: staging
          HSK_STAGING_DB_HOST: localhost
          DATABASE_URL: postgresql://qa:qa@localhost:5432/qa
        run: |
          python - <<'PY'
          from app.staging_qa import app, staging_qa_lifespan
          assert app.router.lifespan_context is staging_qa_lifespan
          print("staging ASGI route graph imported; no startup, DB or Telegram operations")
          PY
      - name: Check real Android assistant photo decoding
        run: python -m unittest tests.test_android_assistant_service.AssistantImageTransportTests
      - name: Verify onboarding save confirmation and recovery
        run: python -m unittest tests.test_miniapp_onboarding_save_confirmation tests.test_course_miniapp_onboarding
      - name: Run HSK 3.0 lesson limit regression
        run: python -m unittest tests.test_hsk30_lesson_limits tests.test_course_track_service tests.test_hsk30_promo_service tests.test_hsk30_switch_ui_contract tests.test_android_payment_method_dialog_contract
      - name: Verify synthetic Mini App lesson reservation auth and quota boundary
        run: python -m unittest tests.test_i18n_miniapp_reservation_asgi
      - name: Verify course context, progress idempotence and current browser delivery contracts
        env:
          BOT_TOKEN: "9123456:synthetic-test-only-unusable-secret"
          DATABASE_URL: "postgresql+asyncpg://qa:qa@127.0.0.1:1/qa"
          REDIS_URL: "redis://127.0.0.1:1/0"
        run: python -m unittest tests.test_course_lesson_completion_proof tests.test_miniapp_course_context tests.test_course_v3_static_data tests.test_desktop_course_api
      - name: Verify language callback validation and onboarding state preservation
        env:
          BOT_TOKEN: "9123456:synthetic-test-only-unusable-secret"
          DATABASE_URL: "postgresql+asyncpg://qa:qa@127.0.0.1:1/qa"
          REDIS_URL: "redis://127.0.0.1:1/0"
        run: python -m unittest tests.test_onboarding_service
      - name: Verify actual HTTP delivery of browser scripts and private source boundaries
        env:
          BOT_TOKEN: "9123456:synthetic-test-only-unusable-secret"
          DATABASE_URL: "postgresql+asyncpg://qa:qa@127.0.0.1:1/qa"
          REDIS_URL: "redis://127.0.0.1:1/0"
        run: python -m unittest tests.test_telegram_sdk_asset
      - name: Verify local notification copy and custom override precedence
        env:
          BOT_TOKEN: "9123456:synthetic-test-only-unusable-secret"
          DATABASE_URL: "postgresql+asyncpg://qa:qa@127.0.0.1:1/qa"
          REDIS_URL: "redis://127.0.0.1:1/0"
        run: |
          python scripts/i18n_build_bot_catalogs.py --check
          python scripts/i18n_build_notification_catalogs.py --check
          python scripts/i18n_build_public_site_catalog.py --check
          python -m unittest tests.test_bot_catalog_runtime tests.test_notification_catalog_runtime tests.test_course_notification_language tests.test_motivation_reminder_service tests.test_public_site
      - name: Test canonical Google Apple Telegram native sign-in and identity linking
        run: |
          python -m unittest \
            tests.test_native_oauth_api \
            tests.test_native_account_signup \
            tests.test_desktop_provider_accounts \
            tests.test_native_oauth_lifecycle \
            tests.test_identity_link_service
      - name: Test 0108 native audit facts and personal discount account isolation
        run: |
          python -m unittest \
            tests.test_i18n_native_audit_migration \
            tests.test_i18n_native_discount_ownership
      - name: Test 0107 referrals, native owner isolation and signup attribution migration
        run: |
          python -m unittest \
            tests.test_i18n_native_referral_migration \
            tests.test_i18n_native_referral_ownership \
            tests.test_i18n_native_referral_concurrency
      - name: Test 0106 canonical financial migration and ownership isolation
        run: |
          python -m unittest tests.test_i18n_native_payment_migration tests.test_i18n_native_payment_repository tests.test_payment_review_preview
      - name: Test provider-only AI budgets, Voice sessions and 0105 migration
        run: python -m unittest tests.test_i18n_native_ai_voice_ownership
      - name: Test canonical native account ownership and migration foundation
        run: python -m unittest tests.test_i18n_native_account_ownership
      - name: Test bearer-authenticated P3 native lesson and completed entitlement contracts
        run: |
          python -m unittest \
            tests.test_desktop_course_api.DesktopCourseApiTests.test_authenticated_hsk30_p3_lesson_keeps_grammar_mirror_and_access \
            tests.test_desktop_course_api.DesktopCourseApiTests.test_a_completed_lesson_stays_reviewable_after_expiry \
            tests.test_desktop_course_api.DesktopCourseApiTests.test_denied_lesson_records_limit_hit_in_fixture_database \
            tests.test_android_course_api.AndroidCourseServiceTests.test_a_spent_allowance_cannot_complete_the_next_lesson \
            tests.test_android_course_api.AndroidCourseServiceTests.test_free_user_can_select_hsk30_n3_but_content_stays_locked
      - name: Run HSK 3.0 currency checkout regressions
        run: python -m unittest tests.test_hsk30_unlock_checkout tests.test_subscription_miniapp_card_banks
      - name: Run learning plan and canonical mistake regressions
        run: |
          python -m unittest tests.test_daily_plan_service tests.test_learning_signals tests.test_course_lesson_mistake_material_service tests.test_android_n1_compat
      - name: Test multilingual inventory and Mini App locale regressions
        run: |
          python -m unittest tests.test_i18n_inventory tests.test_i18n_ui_regressions
          python scripts/i18n_inventory.py --output /tmp/hsk-i18n-audit.json
          python -m unittest tests.test_i18n_source_audit
          python scripts/i18n_source_audit.py --output /tmp/hsk-i18n-source-audit.json
          python -m unittest tests.test_i18n_baseline_guard
          python scripts/i18n_baseline_guard.py --output /tmp/hsk-i18n-baseline-guard.json
          python -m unittest tests.test_i18n_lesson_samples
          python scripts/i18n_lesson_samples.py --output /tmp/hsk-i18n-lesson-samples.json
          python -m unittest tests.test_i18n_review_queue
          python scripts/i18n_review_queue.py --source /tmp/hsk-i18n-source-audit.json --output /tmp/hsk-i18n-review-queue.json
          python -m unittest tests.test_i18n_p0_contract_audit
          python scripts/i18n_p0_contract_audit.py --output /tmp/hsk-i18n-p0-contract.json
          python -m unittest tests.test_i18n_android_resource_audit
          python scripts/i18n_android_resource_audit.py --output /tmp/hsk-i18n-android-xml-audit.json
          python -m unittest tests.test_i18n_catalog_contract_audit
          python scripts/i18n_catalog_contract_audit.py --output /tmp/hsk-i18n-catalog-contract-audit.json
          python -m unittest tests.test_i18n_miniapp_catalog_audit
          python scripts/i18n_miniapp_catalog_audit.py --output /tmp/hsk-i18n-miniapp-catalog-audit.json
      - name: Save P0 localization audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk-i18n-p0-audit
          path: |
            /tmp/hsk-i18n-audit.json
            /tmp/hsk-i18n-source-audit.json
            /tmp/hsk-i18n-baseline-guard.json
            /tmp/hsk-i18n-lesson-samples.json
            /tmp/hsk-i18n-review-queue.json
            /tmp/hsk-i18n-p0-contract.json
            /tmp/hsk-i18n-android-xml-audit.json
            /tmp/hsk-i18n-catalog-contract-audit.json
            /tmp/hsk-i18n-miniapp-catalog-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Guard QA schema-only bootstrap (offline, no DB credentials)
        run: python -m unittest tests.test_qa_schema_only_bootstrap
      - name: Guard new isolated QA project initializer
        run: python -m unittest tests.test_qa_standalone_bootstrap
      - name: Test bundled tour narration WAV and MP3 routes
        run: python -m unittest tests.test_tour_audio_route

      - name: Guard full staging Telegram bot against production usage
        run: python -m unittest tests.test_qa_full_worker tests.test_qa_native_worker
      - name: Compile backend code
        run: |
          python -m compileall -q app tests
      - name: Run block, feedback, and admin integrity tests
        run: |
          python -m unittest tests.test_bot_block_status_service tests.test_bot_feedback_service tests.test_admin_stats_integrity
      - name: Test one-time receipt previews and adjacent billing regressions
        run: >-
          python -m unittest tests.test_payment_review_preview
          tests.test_subscription_miniapp_submit tests.test_subscription_service
          tests.test_hsk30_admin_payment_flow tests.test_access_state_service
          tests.test_voice_practice_daily_limit
      - name: Check Alembic has exactly one head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"multiple Alembic heads: {heads}")
          print("alembic head:", heads[0])
          PY
      - name: Run Pro trial and anti-abuse regressions
        run: |
          python -m unittest tests.test_pro_trial_service tests.test_trial_risk_service tests.test_trial_risk_entry_points tests.test_admin_limits_api tests.test_trial_entry_points tests.test_referral_trial_contract
      - name: Run adjacent reminder and access regressions
        run: |
          python -m unittest tests.test_admin_stats_service tests.test_trial_reminder_service tests.test_motivation_reminder_service tests.test_blocked_user_guard tests.test_blocked_user_guard_cache
      - name: Run device intelligence and app promo regressions
        run: |
          python -m unittest tests.test_user_device_inventory_service tests.test_desktop_download_api tests.test_android_contextual_app_promo tests.test_android_analytics_service tests.test_android_push tests.test_android_account_notices tests.test_android_apk_download tests.test_admin_panel_has_no_dead_controls
      - name: Run Bot menu localization regressions
        run: python -m unittest tests.test_bot_menu_localization
      - name: Run release feedback localization regressions
        run: python -m unittest tests.test_bot_release_feedback_localization
      - name: Run promo button localization regressions
        run: python -m unittest tests.test_bot_promo_button_localization
      - name: Run advertisement placement, AI localization and default preset regressions
        run: python -m unittest tests.test_ad_placement_service tests.test_course_ad_types tests.test_course_ad_translation_service tests.test_course_ads_module tests.test_miniapp_practice_presentation_restore tests.test_profile_limit_ui_contract tests.test_profile_answer_accuracy
      - name: Check account deletion ownership, retention, migration, and public instructions
        run: >-
          python -m unittest tests.test_admin_delete_safety tests.test_account_deletion_request
          tests.test_account_deletion_api tests.test_account_deletion_cleanup
          tests.test_account_deletion_migration tests.test_public_site

  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hsk_critical_test
          POSTGRES_USER: hsk_critical_qa
          POSTGRES_PASSWORD: hsk-critical-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U hsk_critical_qa -d hsk_critical_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Application globals must never point at the disposable fixture database.
      DATABASE_URL: "postgresql+asyncpg://qa:qa@127.0.0.1:1/qa"
      BOT_TOKEN: "9123456:synthetic-test-only-unusable-secret"
      REDIS_URL: "redis://127.0.0.1:1/0"
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install PostgreSQL regression dependencies
        run: python -m pip install -r requirements.txt pytest aiosqlite
      - name: Verify isolated PostgreSQL ownership, migrations and concurrent writes
        env:
          NATIVE_ACCOUNT_TEST_DATABASE_URL: "postgresql+asyncpg://hsk_critical_qa:hsk-critical-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/hsk_critical_test"
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          database = urlsplit(os.environ["NATIVE_ACCOUNT_TEST_DATABASE_URL"])
          assert database.scheme == "postgresql+asyncpg"
          assert database.hostname == "127.0.0.1"
          assert database.path == "/hsk_critical_test"
          assert database.port and database.port > 1
          assert os.environ["DATABASE_URL"] == "postgresql+asyncpg://qa:qa@127.0.0.1:1/qa"
          PY
          python -m pytest -q -rs --tb=short \
            tests/test_native_account_concurrency.py \
            tests/test_miniapp_course_map_concurrency.py \
            tests/test_native_oauth_lifecycle.py::NativeOAuthConcurrencyTests \
            tests/test_telegram_identity_link.py::TelegramIdentityConcurrencyTests \
            tests/test_i18n_native_payment_repository.py::NativePaymentConcurrencyTests \
            tests/test_native_hsk30_payments.py::NativeHsk30ConcurrencyTests \
            tests/test_payment_service_receipt_lock.py::PaymentServiceReceiptConcurrencyTests \
            tests/test_i18n_native_referral_concurrency.py \
            tests/test_i18n_native_audit_migration.py::NativeAuditMigrationPostgreSQLTests \
            tests/test_native_account_statistics.py \
            tests/test_native_purge_ownership.py \
            --junitxml=/tmp/hsk-native-postgres.xml
      - name: Reject skipped or missing PostgreSQL coverage
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("/tmp/hsk-native-postgres.xml")
          if not report.is_file():
              raise SystemExit("PostgreSQL regression report is missing")
          cases = list(ET.parse(report).getroot().iter("testcase"))
          skipped = [case for case in cases if case.find("skipped") is not None]
          if len(cases) < 64 or skipped:
              raise SystemExit(f"PostgreSQL coverage incomplete: {len(cases)} tests, {len(skipped)} skipped")
          if any(case.find("failure") is not None or case.find("error") is not None for case in cases):
              raise SystemExit("PostgreSQL regressions failed")
          print(f"PostgreSQL coverage: {len(cases)} tests, 0 skipped")
          PY
      - name: Save PostgreSQL regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk-native-postgres-regressions
          path: /tmp/hsk-native-postgres.xml
          if-no-files-found: warn
          retention-days: 14

  miniapp-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test dependencies
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Preserve current main navigation, preload and desktop dialog behavior
        run: >-
          python -m pytest -q tests/e2e/test_practice_bootstrap.py
          tests/e2e/test_miniapp_smoke.py::test_liquid_glass_bottom_nav_renders_without_extra_stylesheet_request
          tests/e2e/test_miniapp_smoke.py::test_practice_tab_is_usable_during_unfinished_background_load
          tests/e2e/test_miniapp_smoke.py::test_desktop_course_modal_covers_full_viewport_and_mobile_keeps_bottom_sheet
          tests/test_miniapp_top_spacing_contract.py
      - name: Verify opt-in Liquid Glass assets, rendering and navigation fallback
        run: >-
          python -m pytest -q tests/test_liquid_glass_nav_pilot.py
          tests/e2e/test_miniapp_smoke.py -k 'liquid_glass_pilot or glass_is_explicitly_opt_in or liquid_glass_assets_are_same_origin_and_allowlisted or original_navigation_has_safe_fallback'
      - name: Verify critical learning and checkout flows with synthetic APIs
        env:
          MINIAPP_E2E_BASE_URL: "http://hsk-ai.local"
