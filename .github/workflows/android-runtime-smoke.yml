name: Android runtime smoke (temporary)

on:
  push:
    branches:
      - fix/android-lesson-runtime-drill-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run lesson and drill runtime smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            cd android
            chmod +x gradlew
            ./gradlew --no-daemon connectedDirectDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.pomp.hskai.runtime.LessonRuntimeSmokeTest
