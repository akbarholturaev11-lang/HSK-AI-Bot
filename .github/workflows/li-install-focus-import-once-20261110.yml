name: One-time reviewed Li iPhone focus hero asset import

on:
  push:
    branches: [fix/li-pwa-install-pro-trial-20261110]
    paths: [.github/workflows/li-install-focus-import-once-20261110.yml]

permissions:
  contents: write

jobs:
  import-approved-home-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify provided HSK AI Home Screen photograph
        env:
          IMAGE_URL: https://at.adobe.com/X8Osf2c5x5CPXhEa
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 "$IMAGE_URL" -o /tmp/li-home-focus.jpg
          echo "17848fda4d9cbdf9655cd407c10efa0e5b6ae7fcf6b59132f47314134c553428  /tmp/li-home-focus.jpg" | sha256sum -c -
          test "$(wc -c < /tmp/li-home-focus.jpg)" -eq 164899
          file /tmp/li-home-focus.jpg | grep -q JPEG
          cp /tmp/li-home-focus.jpg app/static/assets/onboarding/iphone-install-home-focus.jpg
      - name: Commit only approved image
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/assets/onboarding/iphone-install-home-focus.jpg
          git diff --cached --quiet && exit 1
          git commit -m 'feat: add reviewed HSK AI install hero photo'
          git push origin HEAD:fix/li-pwa-install-pro-trial-20261110
