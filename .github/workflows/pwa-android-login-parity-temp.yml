name: Temporary Android parity PWA final security QA
on:
  push:
    branches: [feat/iphone-pwa-browser-auth-p1-20261102]
    paths:
      - ".github/workflows/pwa-android-login-parity-temp.yml"
      - "app/static/iphone-pwa-login.*"
      - "tests/test_pwa_browser_auth.py"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install same backend requirements
        run: python -m pip install -r requirements.txt aiosqlite
      - name: Verify source bundles, PWA syntax, exact Android strings
        run: |
          python scripts/i18n_build_local_catalogs.py --check
          python -m py_compile app/api/pwa_auth.py app/services/pwa_auth_service.py app/api/native_oauth.py tests/test_pwa_browser_auth.py
          node --check app/static/iphone-pwa-login.js
      - name: Android LinkScreen-to-PWA regression and security contract
        run: python -m unittest -v tests.test_pwa_browser_auth
      - name: Native OAuth and shared identity regressions
        run: python -m unittest -q tests.test_native_oauth_api tests.test_identity_link_service tests.test_desktop_auth_service
