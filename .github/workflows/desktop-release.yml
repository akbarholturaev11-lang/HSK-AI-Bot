name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      release_notes:
        description: Short update notes shown inside the desktop app
        required: true
        default: "HSK AI desktop release"
      publish_to_r2:
        description: Upload verified artifacts to Cloudflare R2
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  LLAMA_CPP_RELEASE: b10223
  # llama.cpp publishes its macOS arm64 archive from a macOS 26 runner with no
  # deployment target, so that binary aborts on every older macOS. The arm64
  # slice is therefore compiled from the pinned source below. The Intel archive
  # is already built with -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 upstream, which is
  # where MACOS_DEPLOYMENT_TARGET comes from.
  LLAMA_CPP_COMMIT: 11924d4c17abc27383376a1ac6a24fa3e36c1c0c
  LLAMA_CPP_MACOS_X64_SHA256: d5488dd5759f7a086852af5a206c6cded875c716de6a9f9d8460ea6c2dc24138
  LLAMA_CPP_WINDOWS_X64_SHA256: 74c1ded0512818d98b51940bf9150e16da8ed79cf0cbe8d85788e01cdd00ff67
  MACOS_DEPLOYMENT_TARGET: "13.3"

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.notes }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release
        name: Resolve immutable release inputs
        shell: bash
        env:
          MANUAL_NOTES: ${{ inputs.release_notes }}
          MANUAL_PUBLISH: ${{ inputs.publish_to_r2 }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./desktop/package.json').version")"
          tauri_version="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -n 1)"
          test "$package_version" = "$tauri_version"
          test "$package_version" = "$cargo_version"
          node -e '
            const version = process.argv[1];
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version)) {
              throw new Error(`Desktop version must be stable SemVer: ${version}`);
            }
          ' "$package_version"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_NAME}" = "desktop-v${package_version}" || {
              echo "::error::Tag must be desktop-v${package_version}"
              exit 1
            }
            git fetch --no-tags origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::Release tag must point to a commit contained in origin/main"
              exit 1
            }
            release_notes="HSK AI desktop v${package_version}"
            publish="true"
          else
            test "$GITHUB_REF" = "refs/heads/main" || {
              echo "::error::Manual desktop releases must run from main"
              exit 1
            }
            release_notes="$MANUAL_NOTES"
            publish="${MANUAL_PUBLISH:-false}"
          fi

          test "${#release_notes}" -le 1000 || {
            echo "::error::Release notes must be at most 1000 characters"
            exit 1
          }
          delimiter="RELEASE_NOTES_$(openssl rand -hex 16)"

          {
            echo "version=$package_version"
            echo "publish=$publish"
            echo "notes<<$delimiter"
            printf '%s\n' "$release_notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: Build universal macOS DMG
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Stage pinned universal local AI runtime
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          x64_archive="llama-${LLAMA_CPP_RELEASE}-bin-macos-x64.tar.gz"
          release_base="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_RELEASE}"

          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "$release_base/$x64_archive" -o "$staging/$x64_archive"
          printf '%s  %s\n' "$LLAMA_CPP_MACOS_X64_SHA256" "$staging/$x64_archive" \
            | shasum -a 256 -c -

          mkdir -p "$staging/x64"
          tar -xzf "$staging/$x64_archive" -C "$staging/x64"
          x64_server="$(find "$staging/x64" -type f -name llama-server -print -quit)"
          test -n "$x64_server"
          x64_root="$(dirname "$x64_server")"

          # Compile the arm64 slice from the pinned commit with the same options
          # llama.cpp uses for its own arm64 release, plus an explicit
          # deployment target so the result loads on macOS 13.3 and later.
          # The full commit history is required: llama.cpp derives its library
          # version from `git rev-list --count HEAD`, so a shallow clone would
          # rename every dylib and break pairing with the Intel archive.
          source_dir="$staging/llama.cpp"
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/ggml-org/llama.cpp "$source_dir"
          git -C "$source_dir" checkout --quiet --detach "$LLAMA_CPP_COMMIT"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$LLAMA_CPP_COMMIT"
          build_number="$(git -C "$source_dir" rev-list --count HEAD)"
          if [ "$build_number" != "${LLAMA_CPP_RELEASE#b}" ]; then
            echo "::error::Source build number $build_number does not match release $LLAMA_CPP_RELEASE; the arm64 dylib names would not match the Intel archive"
            exit 1
          fi

          cmake -S "$source_dir" -B "$source_dir/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_NUMBER="${LLAMA_CPP_RELEASE#b}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
            -DCMAKE_INSTALL_RPATH='@loader_path' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_METAL_USE_BF16=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_RPC=ON \
            -DLLAMA_BUILD_BORINGSSL=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build "$source_dir/build" --config Release \
            -j "$(sysctl -n hw.logicalcpu)"
          arm_server="$(find "$source_dir/build/bin" -type f -name llama-server -print -quit)"
          test -n "$arm_server"
          arm_root="$(dirname "$arm_server")"
          runtime="desktop/src-tauri/runtime/macos-universal"
          rm -rf "$runtime"
          mkdir -p "$runtime"

          lipo -create "$arm_server" "$x64_server" -output "$runtime/llama-server"
          while IFS= read -r -d '' arm_library; do
            library="$(basename "$arm_library")"
            x64_library="$x64_root/$library"
            if [ -f "$x64_library" ]; then
              lipo -create "$arm_library" "$x64_library" -output "$runtime/$library"
            else
              case "$library" in
                libggml-metal.*.dylib)
                  # llama.cpp's Intel archive intentionally has no Metal
                  # backend. Keep the arm64 Metal slice for Apple Silicon;
                  # the x64 server slice does not reference this library.
                  ! otool -L "$x64_server" | grep -q '@rpath/libggml-metal'
                  cp "$arm_library" "$runtime/$library"
                  ;;
                *)
                  echo "::error::Missing x64 runtime library: $library"
                  exit 1
                  ;;
              esac
            fi
          done < <(find "$arm_root" -maxdepth 1 -type f -name '*.dylib' -print0)
          while IFS= read -r -d '' arm_link; do
            link_name="$(basename "$arm_link")"
            link_target="$(readlink "$arm_link")"
            ln -s "$link_target" "$runtime/$link_name"
          done < <(find "$arm_root" -maxdepth 1 -type l -name '*.dylib' -print0)
          while IFS= read -r -d '' runtime_link; do
            test -e "$runtime_link" || {
              echo "::error::Broken runtime symlink: $runtime_link -> $(readlink "$runtime_link")"
              exit 1
            }
          done < <(find "$runtime" -maxdepth 1 -type l -name '*.dylib' -print0)
          while IFS= read -r -d '' x64_library; do
            library="$(basename "$x64_library")"
            test -e "$runtime/$library" || {
              echo "::error::Intel runtime library missing from the universal runtime: $library"
              exit 1
            }
          done < <(find "$x64_root" -maxdepth 1 -type f -name '*.dylib' -print0)
          find "$arm_root" -maxdepth 1 -type f \
            \( -name '*.metal' -o -name '*.json' \) \
            -exec cp {} "$runtime/" \;
          {
            echo "llama.cpp release: $LLAMA_CPP_RELEASE"
            echo "llama.cpp commit: $LLAMA_CPP_COMMIT"
            echo "macOS arm64: built from source, deployment target $MACOS_DEPLOYMENT_TARGET"
            echo "macOS x64 archive SHA-256: $LLAMA_CPP_MACOS_X64_SHA256"
          } > "$runtime/RUNTIME-BUILD.txt"

          chmod 0755 "$runtime/llama-server"
          find "$runtime" -maxdepth 1 -type f \
            \( -name llama-server -o -name '*.dylib' \) \
            -exec codesign --force --sign - --timestamp=none {} \;
          lipo "$runtime/llama-server" -verify_arch arm64 x86_64
          while IFS= read -r -d '' runtime_library; do
            case "$(basename "$runtime_library")" in
              libggml-metal.*.dylib)
                lipo "$runtime_library" -verify_arch arm64
                ;;
              *)
                lipo "$runtime_library" -verify_arch arm64 x86_64
                ;;
            esac
          done < <(find "$runtime" -maxdepth 1 -type f -name '*.dylib' -print0)
          while IFS= read -r -d '' runtime_binary; do
            while IFS= read -r minimum; do
              lowest="$(printf '%s\n%s\n' "$minimum" "$MACOS_DEPLOYMENT_TARGET" \
                | sort -V | head -n 1)"
              if [ "$lowest" != "$minimum" ]; then
                echo "::error::$(basename "$runtime_binary") requires macOS $minimum, above the supported $MACOS_DEPLOYMENT_TARGET"
                exit 1
              fi
            done < <(otool -l "$runtime_binary" | awk '/^ *minos / { print $2 }')
          done < <(find "$runtime" -maxdepth 1 -type f \
            \( -name llama-server -o -name '*.dylib' \) -print0)
          "$runtime/llama-server" --version

      - name: Verify release version
        working-directory: desktop
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = require("./package.json");
            const tauri = JSON.parse(fs.readFileSync("./src-tauri/tauri.conf.json", "utf8"));
            const cargo = fs.readFileSync("./src-tauri/Cargo.toml", "utf8");
            const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            const expected = process.env.RELEASE_VERSION;
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(expected)) throw new Error("Version must be stable SemVer");
            if (pkg.version !== expected || tauri.version !== expected || cargoVersion !== expected) {
              throw new Error(`Version mismatch: input=${expected}, package=${pkg.version}, tauri=${tauri.version}, cargo=${cargoVersion}`);
            }
          '

      - name: Test desktop UI
        working-directory: desktop
        run: npm run test:ui

      - name: Check native desktop code
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build universal DMG and updater
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_V4 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_V4 }}
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg

      - name: Verify universal app bundle and embedded AI runtime
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict "$app_path"
          embedded_server="$(find "$app_path" -type f -name llama-server -print -quit)"
          test -n "$embedded_server"
          lipo "$embedded_server" -verify_arch arm64 x86_64

      - name: Collect and checksum macOS artifacts
        shell: bash
        run: |
          bundle_root="desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          dmg_path="$(find "$bundle_root/dmg" -type f -name '*.dmg' -print -quit)"
          updater_path="$(find "$bundle_root/macos" -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$dmg_path"
          test -n "$updater_path"
          test -f "${updater_path}.sig"
          mkdir -p desktop/releases/macos
          cp "$dmg_path" "desktop/releases/macos/Pomp-HSK-AI_${RELEASE_VERSION}_universal.dmg"
          cp "$updater_path" "desktop/releases/macos/Pomp-HSK-AI_${RELEASE_VERSION}_universal.app.tar.gz"
          cp "${updater_path}.sig" "desktop/releases/macos/Pomp-HSK-AI_${RELEASE_VERSION}_universal.app.tar.gz.sig"
          cd desktop/releases/macos
          shasum -a 256 \
            "Pomp-HSK-AI_${RELEASE_VERSION}_universal.dmg" \
            "Pomp-HSK-AI_${RELEASE_VERSION}_universal.app.tar.gz" \
            > SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v6
        with:
          name: Pomp-HSK-AI_${{ needs.prepare.outputs.version }}_macos
          path: desktop/releases/macos/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows x64 NSIS installer
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Stage pinned Windows local AI runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archiveName = "llama-$env:LLAMA_CPP_RELEASE-bin-win-cpu-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $expanded = Join-Path $env:RUNNER_TEMP "llama-runtime-x64"
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/$env:LLAMA_CPP_RELEASE/$archiveName"
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 180
              $downloaded = $true
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          if (-not $downloaded) { throw "Pinned llama.cpp Windows runtime download failed" }
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LLAMA_CPP_WINDOWS_X64_SHA256) {
            throw "Pinned llama.cpp Windows archive checksum mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath $expanded -Force
          $server = Get-ChildItem -Path $expanded -Recurse -File -Filter "llama-server.exe" |
            Select-Object -First 1
          if (-not $server) { throw "Pinned llama-server.exe was not found" }
          $runtime = "desktop/src-tauri/runtime/windows-x64"
          if (Test-Path $runtime) { Remove-Item -Recurse -Force $runtime }
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Copy-Item $server.FullName "$runtime/llama-server.exe"
          Get-ChildItem -Path $server.Directory.FullName -File -Filter "*.dll" |
            Copy-Item -Destination $runtime
          @(
            "llama.cpp release: $env:LLAMA_CPP_RELEASE"
            "Windows x64 archive SHA-256: $env:LLAMA_CPP_WINDOWS_X64_SHA256"
          ) | Set-Content "$runtime/RUNTIME-BUILD.txt" -Encoding ascii
          & "$runtime/llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Pinned llama-server.exe smoke test failed" }

      - name: Verify release version
        working-directory: desktop
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = require("./package.json");
            const tauri = JSON.parse(fs.readFileSync("./src-tauri/tauri.conf.json", "utf8"));
            const cargo = fs.readFileSync("./src-tauri/Cargo.toml", "utf8");
            const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            const expected = process.env.RELEASE_VERSION;
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(expected)) throw new Error("Version must be stable SemVer");
            if (pkg.version !== expected || tauri.version !== expected || cargoVersion !== expected) {
              throw new Error(`Version mismatch: input=${expected}, package=${pkg.version}, tauri=${tauri.version}, cargo=${cargoVersion}`);
            }
          '

      - name: Test desktop UI
        working-directory: desktop
        run: npm run test:ui

      - name: Check native desktop code
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build NSIS installer and updater
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_V4 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_V4 }}
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Verify x64 application and embedded AI runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-PeX64([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "Invalid PE file: $Path"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) { throw "Expected x64 PE file: $Path" }
          }
          $app = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/pomp-hsk-ai.exe"
          $server = "desktop/src-tauri/runtime/windows-x64/llama-server.exe"
          if (-not (Test-Path $app)) { throw "Desktop x64 executable was not produced" }
          if (-not (Test-Path $server)) { throw "Embedded x64 llama-server was not staged" }
          Assert-PeX64 $app
          Assert-PeX64 $server

      - name: Collect and checksum Windows artifacts
        shell: pwsh
        run: |
          $bundleRoot = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleRoot -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path $signature)) { throw "Updater signature was not produced" }
          $releaseDir = "desktop/releases/windows"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $releaseName = "Pomp-HSK-AI_${env:RELEASE_VERSION}_x64-setup.exe"
          Copy-Item $installer.FullName "$releaseDir/$releaseName"
          Copy-Item $signature "$releaseDir/$releaseName.sig"
          $hash = (Get-FileHash "$releaseDir/$releaseName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = "$hash  $releaseName`n"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            "$releaseDir/SHA256SUMS-windows.txt",
            $checksumLine,
            $utf8NoBom
          )

      - uses: actions/upload-artifact@v6
        with:
          name: Pomp-HSK-AI_${{ needs.prepare.outputs.version }}_windows
          path: desktop/releases/windows/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Cloudflare R2
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    needs: [prepare, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: desktop-release-publish
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      RELEASE_NOTES: ${{ needs.prepare.outputs.notes }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: Pomp-HSK-AI_${{ needs.prepare.outputs.version }}_*
          path: release
          merge-multiple: true

      - name: Install release verification tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign

      - name: Validate R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          for value in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_BASE_URL; do
            test -n "${!value}" || { echo "::error::$value is required"; exit 1; }
          done
          case "$R2_PUBLIC_BASE_URL" in
            https://*) ;;
            *) echo "::error::R2_PUBLIC_BASE_URL must use HTTPS"; exit 1 ;;
          esac
          case "$R2_PUBLIC_BASE_URL" in
            *\?*|*\#*) echo "::error::R2_PUBLIC_BASE_URL cannot contain query or fragment"; exit 1 ;;
          esac
          node -e '
            const raw = process.env.R2_PUBLIC_BASE_URL;
            const parsed = new URL(raw);
            if (
              parsed.protocol !== "https:" || !parsed.hostname ||
              parsed.username || parsed.password ||
              parsed.search || parsed.hash
            ) {
              throw new Error("R2_PUBLIC_BASE_URL must be a public HTTPS origin or path");
            }
          '

      - name: Verify checksums and updater signatures
        shell: bash
        run: |
          set -euo pipefail
          mac_dmg="Pomp-HSK-AI_${RELEASE_VERSION}_universal.dmg"
          mac_update="Pomp-HSK-AI_${RELEASE_VERSION}_universal.app.tar.gz"
          win_exe="Pomp-HSK-AI_${RELEASE_VERSION}_x64-setup.exe"
          for artifact in \
            "$mac_dmg" "$mac_update" "$mac_update.sig" \
            "$win_exe" "$win_exe.sig" \
            SHA256SUMS-macos.txt SHA256SUMS-windows.txt; do
            test -s "release/$artifact" || {
              echo "::error::Missing or empty release artifact: $artifact"
              exit 1
            }
          done

          (
            cd release
            shasum -a 256 --check SHA256SUMS-macos.txt
            sha256sum --check SHA256SUMS-windows.txt
          )

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          jq -er '.plugins.updater.pubkey' desktop/src-tauri/tauri.conf.json \
            | base64 --decode > "$verify_dir/updater.pub"
          base64 --decode < "release/$mac_update.sig" > "$verify_dir/macos.minisig"
          base64 --decode < "release/$win_exe.sig" > "$verify_dir/windows.minisig"
          test "$(wc -c < "$verify_dir/updater.pub")" -le 512
          test "$(wc -c < "$verify_dir/macos.minisig")" -le 2048
          test "$(wc -c < "$verify_dir/windows.minisig")" -le 2048
          minisign -Vm "release/$mac_update" \
            -x "$verify_dir/macos.minisig" -p "$verify_dir/updater.pub"
          minisign -Vm "release/$win_exe" \
            -x "$verify_dir/windows.minisig" -p "$verify_dir/updater.pub"

      - name: Block downgrade and immutable-key overwrite
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          previous_manifest="$(mktemp)"
          manifest_error="$(mktemp)"
          if aws s3api head-object --bucket "$R2_BUCKET" --key "desktop/latest.json" \
            --endpoint-url "$endpoint" >/dev/null 2>"$manifest_error"; then
            aws s3 cp "s3://${R2_BUCKET}/desktop/latest.json" "$previous_manifest" \
              --endpoint-url "$endpoint" --only-show-errors
            previous_version="$(jq -er '.version' "$previous_manifest")"
            node -e '
              const parse = (value) => {
                if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(value)) throw new Error(`Invalid SemVer: ${value}`);
                return value.split(".").map(BigInt);
              };
              const [next, current] = process.argv.slice(1).map(parse);
              const comparison = next.findIndex((value, index) => value !== current[index]);
              if (comparison >= 0 && next[comparison] < current[comparison]) {
                throw new Error(`Release ${process.argv[1]} must not be older than published ${process.argv[2]}`);
              }
            ' "$RELEASE_VERSION" "$previous_version"
            if [ "$RELEASE_VERSION" = "$previous_version" ]; then
              base="${R2_PUBLIC_BASE_URL%/}/desktop/v${RELEASE_VERSION}"
              mac_dmg="Pomp-HSK-AI_${RELEASE_VERSION}_universal.dmg"
              mac_update="Pomp-HSK-AI_${RELEASE_VERSION}_universal.app.tar.gz"
              win_exe="Pomp-HSK-AI_${RELEASE_VERSION}_x64-setup.exe"
              mac_signature="$(tr -d '\r\n' < "release/$mac_update.sig")"
              win_signature="$(tr -d '\r\n' < "release/$win_exe.sig")"
              mac_dmg_sha="$(awk '$2 ~ /\.dmg$/ {print $1}' release/SHA256SUMS-macos.txt)"
              mac_update_sha="$(awk '$2 ~ /\.app\.tar\.gz$/ {print $1}' release/SHA256SUMS-macos.txt)"
              win_sha="$(awk 'NR == 1 {print $1}' release/SHA256SUMS-windows.txt)"
              jq -e \
                --arg version "$RELEASE_VERSION" \
                --arg mac_download "$base/$mac_dmg" \
                --arg mac_update "$base/$mac_update" \
                --arg mac_signature "$mac_signature" \
                --arg mac_dmg_sha "$mac_dmg_sha" \
                --arg mac_update_sha "$mac_update_sha" \
                --arg win_download "$base/$win_exe" \
                --arg win_signature "$win_signature" \
                --arg win_sha "$win_sha" \
                '.version == $version and
                 .macos.download_url == $mac_download and
                 .macos.update_url == $mac_update and
                 .macos.signature == $mac_signature and
                 .macos.download_sha256 == $mac_dmg_sha and
                 .macos.update_sha256 == $mac_update_sha and
                 .windows.download_url == $win_download and
                 .windows.update_url == $win_download and
                 .windows.signature == $win_signature and
                 .windows.sha256 == $win_sha' \
                "$previous_manifest" >/dev/null || {
                  echo "::error::Published version has a different immutable artifact fingerprint"
                  exit 1
                }
              echo "Retrying an already published release with the same artifact fingerprint"
            fi
          elif ! grep -Eq '404|Not Found|NoSuchKey' "$manifest_error"; then
            echo "::error::Could not safely read the existing R2 release manifest"
            cat "$manifest_error"
            exit 1
          fi

          prefix="desktop/v${RELEASE_VERSION}"
          keys=(
            "$prefix/Pomp-HSK-AI_${RELEASE_VERSION}_universal.dmg"
            "$prefix/Pomp-HSK-AI_${RELEASE_VERSION}_universal.app.tar.gz"
            "$prefix/Pomp-HSK-AI_${RELEASE_VERSION}_universal.app.tar.gz.sig"
            "$prefix/Pomp-HSK-AI_${RELEASE_VERSION}_x64-setup.exe"
            "$prefix/Pomp-HSK-AI_${RELEASE_VERSION}_x64-setup.exe.sig"
          )
          local_files=(
            "release/Pomp-HSK-AI_${RELEASE_VERSION}_universal.dmg"
            "release/Pomp-HSK-AI_${RELEASE_VERSION}_universal.app.tar.gz"
            "release/Pomp-HSK-AI_${RELEASE_VERSION}_universal.app.tar.gz.sig"
            "release/Pomp-HSK-AI_${RELEASE_VERSION}_x64-setup.exe"
            "release/Pomp-HSK-AI_${RELEASE_VERSION}_x64-setup.exe.sig"
          )
          for index in "${!keys[@]}"; do
            key="${keys[$index]}"
            error_file="$(mktemp)"
            if aws s3api head-object --bucket "$R2_BUCKET" --key "$key" \
              --endpoint-url "$endpoint" >/dev/null 2>"$error_file"; then
              existing_file="$(mktemp)"
              aws s3 cp "s3://${R2_BUCKET}/${key}" "$existing_file" \
                --endpoint-url "$endpoint" --only-show-errors
              if ! cmp --silent "${local_files[$index]}" "$existing_file"; then
                echo "::error::Immutable release key exists with different content: $key"
                exit 1
              fi
              echo "Immutable release key already contains identical content: $key"
              continue
            fi
            if ! grep -Eq '404|Not Found|NoSuchKey' "$error_file"; then
              echo "::error::Could not verify immutable release key: $key"
              cat "$error_file"
              exit 1
            fi
          done

      - name: Create and validate release metadata locally
        shell: bash
        run: |
          set -euo pipefail
          base="${R2_PUBLIC_BASE_URL%/}/desktop/v${RELEASE_VERSION}"
          mac_dmg="Pomp-HSK-AI_${RELEASE_VERSION}_universal.dmg"
          mac_update="Pomp-HSK-AI_${RELEASE_VERSION}_universal.app.tar.gz"
          win_exe="Pomp-HSK-AI_${RELEASE_VERSION}_x64-setup.exe"
          mac_signature="$(tr -d '\r\n' < "release/$mac_update.sig")"
          win_signature="$(tr -d '\r\n' < "release/$win_exe.sig")"
          mac_dmg_sha="$(awk '$2 ~ /\.dmg$/ {print $1}' release/SHA256SUMS-macos.txt)"
          mac_update_sha="$(awk '$2 ~ /\.app\.tar\.gz$/ {print $1}' release/SHA256SUMS-macos.txt)"
          win_sha="$(awk 'NR == 1 {print $1}' release/SHA256SUMS-windows.txt)"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg notes "$RELEASE_NOTES" \
            --arg published_at "$published_at" \
            --arg mac_download "$base/$mac_dmg" \
            --arg mac_update "$base/$mac_update" \
            --arg mac_signature "$mac_signature" \
            --arg mac_dmg_sha256 "$mac_dmg_sha" \
            --arg mac_update_sha256 "$mac_update_sha" \
            --arg windows_download "$base/$win_exe" \
            --arg windows_update "$base/$win_exe" \
            --arg windows_signature "$win_signature" \
            --arg windows_sha256 "$win_sha" \
            '{
              schema_version: 1,
              version: $version,
              notes: $notes,
              published_at: $published_at,
              macos: {
                download_url: $mac_download,
                update_url: $mac_update,
                signature: $mac_signature,
                download_sha256: $mac_dmg_sha256,
                update_sha256: $mac_update_sha256
              },
              windows: {
                download_url: $windows_download,
                update_url: $windows_update,
                signature: $windows_signature,
                sha256: $windows_sha256
              }
            }' > latest.json

          jq -e --arg version "$RELEASE_VERSION" '
            keys == ["macos", "notes", "published_at", "schema_version", "version", "windows"] and
            .schema_version == 1 and .version == $version and
            (.notes | type == "string" and length <= 1000) and
            (.published_at | type == "string") and
            (.macos | keys == ["download_sha256", "download_url", "signature", "update_sha256", "update_url"]) and
            (.windows | keys == ["download_url", "sha256", "signature", "update_url"]) and
            ([.macos.download_url, .macos.update_url, .windows.download_url, .windows.update_url]
              | all(type == "string" and startswith("https://") and (contains("?") | not) and (contains("#") | not))) and
            (.macos.download_url | endswith(".dmg")) and
            (.macos.update_url | endswith(".app.tar.gz")) and
            (.windows.download_url | endswith(".exe")) and
            (.windows.update_url | endswith(".exe")) and
            (.published_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) and
            ([.macos.download_sha256, .macos.update_sha256, .windows.sha256]
              | all(test("^[0-9a-f]{64}$"))) and
            ([.macos.signature, .windows.signature]
              | all(type == "string" and length >= 100 and length <= 4096 and test("^[A-Za-z0-9+/=_-]+$")))
          ' latest.json >/dev/null

      - name: Publish installers and updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="desktop/v${RELEASE_VERSION}"
          mac_dmg="Pomp-HSK-AI_${RELEASE_VERSION}_universal.dmg"
          mac_update="Pomp-HSK-AI_${RELEASE_VERSION}_universal.app.tar.gz"
          win_exe="Pomp-HSK-AI_${RELEASE_VERSION}_x64-setup.exe"

          aws s3 cp "release/$mac_dmg" "s3://${R2_BUCKET}/${prefix}/$mac_dmg" \
            --endpoint-url "$endpoint" \
            --content-type "application/x-apple-diskimage" \
            --content-disposition "attachment; filename=\"$mac_dmg\"" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "release/$mac_update" "s3://${R2_BUCKET}/${prefix}/$mac_update" \
            --endpoint-url "$endpoint" \
            --content-type "application/gzip" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "release/$mac_update.sig" "s3://${R2_BUCKET}/${prefix}/$mac_update.sig" \
            --endpoint-url "$endpoint" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "release/$win_exe" "s3://${R2_BUCKET}/${prefix}/$win_exe" \
            --endpoint-url "$endpoint" \
            --content-type "application/vnd.microsoft.portable-executable" \
            --content-disposition "attachment; filename=\"$win_exe\"" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "release/$win_exe.sig" "s3://${R2_BUCKET}/${prefix}/$win_exe.sig" \
            --endpoint-url "$endpoint" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 cp "release/$mac_dmg" "s3://${R2_BUCKET}/desktop/latest/Pomp-HSK-AI-universal.dmg" \
            --endpoint-url "$endpoint" \
            --content-type "application/x-apple-diskimage" \
            --content-disposition 'attachment; filename="Pomp-HSK-AI-universal.dmg"' \
            --cache-control "public,max-age=300,must-revalidate"
          aws s3 cp "release/$win_exe" "s3://${R2_BUCKET}/desktop/latest/Pomp-HSK-AI-x64-setup.exe" \
            --endpoint-url "$endpoint" \
            --content-type "application/vnd.microsoft.portable-executable" \
            --content-disposition 'attachment; filename="Pomp-HSK-AI-x64-setup.exe"' \
            --cache-control "public,max-age=300,must-revalidate"

      - name: Verify public artifacts and publish manifest last
        shell: bash
        run: |
          set -euo pipefail
          base="${R2_PUBLIC_BASE_URL%/}/desktop/v${RELEASE_VERSION}"
          stable_base="${R2_PUBLIC_BASE_URL%/}/desktop/latest"
          mac_dmg="Pomp-HSK-AI_${RELEASE_VERSION}_universal.dmg"
          mac_update="Pomp-HSK-AI_${RELEASE_VERSION}_universal.app.tar.gz"
          win_exe="Pomp-HSK-AI_${RELEASE_VERSION}_x64-setup.exe"
          for public_url in \
            "$base/$mac_dmg" \
            "$base/$mac_update" \
            "$base/$mac_update.sig" \
            "$base/$win_exe" \
            "$base/$win_exe.sig" \
            "$stable_base/Pomp-HSK-AI-universal.dmg" \
            "$stable_base/Pomp-HSK-AI-x64-setup.exe"; do
            curl --fail --silent --show-error --location --retry 5 \
              --retry-all-errors --retry-delay 2 --connect-timeout 15 \
              --proto '=https' --tlsv1.2 --head "$public_url" >/dev/null
          done

          public_check="$(mktemp -d)"
          trap 'rm -rf "$public_check"' EXIT
          for artifact in "$mac_dmg" "$mac_update" "$mac_update.sig" "$win_exe" "$win_exe.sig"; do
            curl --fail --silent --show-error --location --retry 5 \
              --retry-all-errors --retry-delay 2 --connect-timeout 15 \
              --proto '=https' --tlsv1.2 "$base/$artifact" \
              -o "$public_check/$artifact"
          done
          test "$(sha256sum "$public_check/$mac_dmg" | awk '{print $1}')" = \
            "$(jq -r '.macos.download_sha256' latest.json)"
          test "$(sha256sum "$public_check/$mac_update" | awk '{print $1}')" = \
            "$(jq -r '.macos.update_sha256' latest.json)"
          test "$(sha256sum "$public_check/$win_exe" | awk '{print $1}')" = \
            "$(jq -r '.windows.sha256' latest.json)"
          cmp "release/$mac_update.sig" "$public_check/$mac_update.sig"
          cmp "release/$win_exe.sig" "$public_check/$win_exe.sig"

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp latest.json "s3://${R2_BUCKET}/desktop/latest.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-store"

          public_manifest="${R2_PUBLIC_BASE_URL%/}/desktop/latest.json"
          manifest_visible="false"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 "$public_manifest" -o published-latest.json \
              && cmp --silent latest.json published-latest.json; then
              manifest_visible="true"
              break
            fi
            sleep $((attempt * 2))
          done
          test "$manifest_visible" = "true" || {
            echo "::error::Published desktop manifest did not become publicly visible"
            exit 1
          }

          {
            echo "### Desktop v${RELEASE_VERSION} published"
            echo
            echo "Release metadata: ${R2_PUBLIC_BASE_URL%/}/desktop/latest.json"
            echo
            echo "Mac and Windows stable download aliases were updated automatically."
            echo "Railway only needs the stable manifest URL once; per-version variables are not changed."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: Pomp-HSK-AI_${{ needs.prepare.outputs.version }}_release-metadata
          path: latest.json
          if-no-files-found: error
          retention-days: 30
