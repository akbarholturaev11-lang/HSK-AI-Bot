name: Validate analytics final-product-goal OpenSpec (retry)

on:
  push:
    branches:
      - codex/analytics-openspec-plan-20261030
    paths:
      - .github/workflows/validate-analytics-final-goal.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/analytics-openspec-plan-20261030
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate official OpenSpec and consumer acceptance
        env:
          OPENSPEC_NO_UPDATE_CHECK: '1'
        run: |
          set -euo pipefail
          npm install --global @fission-ai/openspec@latest
          openspec --version
          test -f openspec/config.yaml
          openspec context --json >/tmp/analytics-context.json
          openspec status --change full-journey-analytics --json >/tmp/analytics-status.json
          openspec validate full-journey-analytics --strict
          python - <<'PY'
          from pathlib import Path
          root=Path('openspec/changes/full-journey-analytics')
          proposal=(root/'proposal.md').read_text(encoding='utf-8')
          design=(root/'design.md').read_text(encoding='utf-8')
          tasks=(root/'tasks.md').read_text(encoding='utf-8')
          specs=(root/'specs/verified-analytics-export/spec.md').read_text(encoding='utf-8')
          assert tasks.count('- [ ]')==4, "Expected four execution packages"
          for doc in (proposal, design, tasks, specs):
              assert 'weekly' in doc.lower() and ('agent' in doc.lower()), 'Missing final agent outcome'
          assert 'Smart Reminder' in tasks and 'DEFERRED' in proposal
          assert '22 aggregate objects' in proposal
          print('PHASE1_SCOPE_OK: four packages; actionable weekly agent outcome and deferred work')
          PY
      - name: Remove one-time validation helper after success
        run: |
          set -euo pipefail
          git rm .github/workflows/validate-analytics-final-goal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(openspec): clean one-time final-goal validation [skip ci]"
          git push origin HEAD:codex/analytics-openspec-plan-20261030
