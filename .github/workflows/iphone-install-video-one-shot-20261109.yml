name: One-time import of user-reviewed iPhone PWA install recording

on:
  push:
    branches:
      - fix/iphone-install-video-replacement-20261109
    paths:
      - .github/workflows/iphone-install-video-one-shot-20261109.yml

permissions:
  contents: write

jobs:
  import-approved-recording:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved user recording from expiring staging link
        env:
          VIDEO_SOURCE: https://at.adobe.com/gp6ctITrZqis0kun
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 "$VIDEO_SOURCE" -o /tmp/hsk-install-original.mp4
          echo "2921aac471d37b9a4a247b7aec8d1a7d60e35755ccbbfa69b467441e9374b410  /tmp/hsk-install-original.mp4" | sha256sum --check
      - name: Install ffmpeg on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Produce and verify Safari H.264/AAC faststart MP4
        run: |
          set -euo pipefail
          command -v ffmpeg
          ffmpeg -hide_banner -loglevel error -i /tmp/hsk-install-original.mp4 \
            -map 0:v:0 -map '0:a:0?' \
            -c:v libx264 -preset slow -crf 26 -profile:v main -level:v 3.1 \
            -pix_fmt yuv420p -c:a aac -b:a 32k -ac 1 \
            -movflags +faststart -y app/static/assets/onboarding/iphone-home-screen.mp4
          sha256sum app/static/assets/onboarding/iphone-home-screen.mp4
          wc -c app/static/assets/onboarding/iphone-home-screen.mp4
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height -of json app/static/assets/onboarding/iphone-home-screen.mp4
          python3 - <<'PY'
          from pathlib import Path
          data = Path("app/static/assets/onboarding/iphone-home-screen.mp4").read_bytes()
          assert data[4:8] == b"ftyp", "invalid mp4"
          assert 100_000 < len(data) < 1_000_000, "bad size"
          assert 0 < data.find(b"moov") < data.find(b"mdat"), "not faststart"
          PY
      - name: Commit only the approved MP4 to the isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/assets/onboarding/iphone-home-screen.mp4
          git diff --cached --quiet && exit 1
          git commit -m 'fix: replace iPhone PWA install video with corrected recording'
          git push origin HEAD:fix/iphone-install-video-replacement-20261109
