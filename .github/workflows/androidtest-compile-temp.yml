name: Android test compile (temporary)

on:
  push:
    branches:
      - fix/android-lesson-runtime-drill-parity

permissions:
  contents: read

jobs:
  compile-android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android runtime smoke tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon compileDirectDebugAndroidTestKotlin
