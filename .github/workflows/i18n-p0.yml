name: Local-first localization P0 guards

# Fast stdlib-only checks. The full backend CI remains independent.
# Changes ONLY under localization/, scripts/, Android or Desktop must not
# bypass P0 migration and compatibility checks.
on:
  push:
    branches:
      - codex/i18n-local-first-foundation-20261017
    paths:
      - "localization/**"
      - "scripts/i18n_*.py"
      - "tests/test_i18n_*.py"
      - "app/static/**"
      - "app/bot/**"
      - "app/services/**"
      - "app/api/**"
      - "android/app/src/**"
      - "desktop/ui/**"
      - ".github/workflows/i18n-p0.yml"
  pull_request:
    paths:
      - "localization/**"
      - "scripts/i18n_*.py"
      - "tests/test_i18n_*.py"
      - "app/static/**"
      - "app/bot/**"
      - "app/services/**"
      - "app/api/**"
      - "android/app/src/**"
      - "desktop/ui/**"
      - ".github/workflows/i18n-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-p0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests for P0 source inventories and regression contracts
        run: |
          python -m unittest \
            tests.test_i18n_inventory \
            tests.test_i18n_ui_regressions \
            tests.test_i18n_source_audit \
            tests.test_i18n_baseline_guard \
            tests.test_i18n_lesson_samples \
            tests.test_i18n_review_queue \
            tests.test_i18n_p0_contract_audit \
            tests.test_i18n_android_resource_audit \
            tests.test_i18n_catalog_contract_audit \
            tests.test_i18n_miniapp_catalog_audit \
            tests.test_i18n_public_bundle_guard \
            tests.test_i18n_miniapp_hotspot_triage \
            tests.test_i18n_memorize_inline_triage \
            tests.test_i18n_route_boundary_audit \
            tests.test_i18n_client_lesson_compat_audit \
            tests.test_i18n_miniapp_lesson_fetch_audit \
            tests.test_i18n_staging_anon_route_probe \
            tests.test_i18n_staging_boot_guard \
            tests.test_i18n_miniapp_reservation_boundary_audit \
            tests.test_i18n_legacy_lesson_content_risk_audit \
            tests.test_i18n_miniapp_storage_scope_audit \
            tests.test_i18n_build_local_catalogs \
            tests.test_i18n_common_ui_adoption \
            tests.test_i18n_course_ui_catalog_guard \
            tests.test_i18n_build_course_catalogs \
            tests.test_i18n_onboarding_ui_adoption \
            tests.test_i18n_onboarding_options \
            tests.test_i18n_test_center_adoption \
            tests.test_i18n_recognition_adoption \
            tests.test_i18n_practice_ui_adoption \
            tests.test_i18n_voice_memorize_dictionary_adoption \
            tests.test_i18n_phrases_download_ui_adoption \
            tests.test_i18n_subscription_ui_adoption \
            tests.test_i18n_subscription_nested_ui_adoption \
            tests.test_i18n_dictionary_ui_adoption \
            tests.test_i18n_course_voice_inline_adoption \
            tests.test_i18n_lesson_display_overlay_contract \
            tests.test_i18n_lesson_overlay_readiness_audit \
            tests.test_i18n_lesson_overlay_full_audit \
            tests.test_i18n_lesson_locale_gap_review_queue \
            tests.test_i18n_editor_translation_draft \
            tests.test_i18n_editor_translation_batch \
            tests.test_i18n_editor_preview_integrity \
            tests.test_i18n_grammar_editor_workspace \
            tests.test_i18n_editor_grammar_mirror_integrity \
            tests.test_i18n_grammar_mirror_source_audit \
            tests.test_i18n_grammar_translation_reuse_audit \
            tests.test_i18n_editor_translation_reuse \
            tests.test_i18n_grammar_private_review_queue \
            tests.test_i18n_editor_context_progress
      - name: Read-only P0 source checks
        run: |
          mkdir -p /tmp/i18n-p0
          python scripts/i18n_inventory.py --output /tmp/i18n-p0/source-inventory.json
          python scripts/i18n_source_audit.py --output /tmp/i18n-p0/source-audit.json
          python scripts/i18n_baseline_guard.py --output /tmp/i18n-p0/frozen-sources.json
          python scripts/i18n_lesson_samples.py --output /tmp/i18n-p0/lesson-samples.json
          python scripts/i18n_review_queue.py --source /tmp/i18n-p0/source-audit.json --output /tmp/i18n-p0/review-queue.json
          python scripts/i18n_p0_contract_audit.py --output /tmp/i18n-p0/lesson-security.json
          python scripts/i18n_legacy_lesson_content_risk_audit.py --output /tmp/i18n-p0/public-lesson-source-risk.json
          python scripts/i18n_lesson_overlay_readiness_audit.py --output /tmp/i18n-p0/p3-overlay-readiness.json
          python scripts/i18n_lesson_overlay_full_audit.py --output /tmp/i18n-p0/p3-all-lesson-readiness.json
          python scripts/i18n_lesson_locale_gap_review_queue.py --output /tmp/i18n-p0/p3-locale-gap-pointers.json --verify-count-queue localization/reviews/p3_nhsk2_locale_gaps_20261019.json
          python scripts/i18n_grammar_mirror_source_audit.py --output /tmp/i18n-p0/p3-grammar-mirror-readiness.json
          python scripts/i18n_grammar_translation_reuse_audit.py --output /tmp/i18n-p0/p3-grammar-reuse-opportunities.json
          python scripts/i18n_android_resource_audit.py --output /tmp/i18n-p0/android-xml.json
          python scripts/i18n_catalog_contract_audit.py --output /tmp/i18n-p0/bot-desktop-catalog.json
          python scripts/i18n_miniapp_catalog_audit.py --output /tmp/i18n-p0/miniapp-catalog.json
          python scripts/i18n_public_bundle_guard.py --output /tmp/i18n-p0/public-pack-security.json
          python scripts/i18n_route_boundary_audit.py --output /tmp/i18n-p0/static-route-security.json
          python scripts/i18n_client_lesson_compat_audit.py --output /tmp/i18n-p0/native-lesson-compatibility.json
          python scripts/i18n_miniapp_lesson_fetch_audit.py --output /tmp/i18n-p0/miniapp-fetch-intents.json
          python scripts/i18n_miniapp_reservation_boundary_audit.py --output /tmp/i18n-p0/miniapp-reservation-boundary.json
          python scripts/i18n_miniapp_storage_scope_audit.py --output /tmp/i18n-p0/miniapp-storage-scope.json
          # Local generation is deterministic and uses no server or network.
          python scripts/i18n_build_local_catalogs.py --check
          python scripts/i18n_course_ui_catalog_guard.py --output /tmp/i18n-p0/course-ui-catalog.json
          python scripts/i18n_build_course_catalogs.py --check
          # Deliberate dry run: NO staging or production HTTP in CI.
          python scripts/i18n_staging_anon_route_probe.py --output /tmp/i18n-p0/staging-anon-probe-plan.json
      - name: Upload read-only P0 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk-i18n-p0-source-contracts
          path: /tmp/i18n-p0/*.json
          if-no-files-found: warn
          retention-days: 14
