name: Temporary Android login common catalog sync
on:
  push:
    branches: [feat/iphone-pwa-browser-auth-p1-20261102]
    paths:
      - ".github/workflows/pwa-login-i18n-sync-temp.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate only official common locale artifacts (all-catalog baseline currently blocked on main)
        run: |
          set -euo pipefail
          python scripts/i18n_build_local_catalogs.py --write
          python scripts/i18n_build_local_catalogs.py --check
          git diff --name-only
          git diff --name-only | while read -r file; do
            case "$file" in
              "app/static/course_v3_data/hsk-common-i18n.js"|"desktop/ui/js/generated/hsk-common-i18n.js"|"app/bot/generated/common_i18n.py"|"android/app/src/main/res/values/hsk_common_i18n.xml"|"android/app/src/main/res/values-ru/hsk_common_i18n.xml"|"android/app/src/main/res/values-tg/hsk_common_i18n.xml") ;;
              *) echo "Unexpected generated mutation $file" >&2; exit 1 ;;
            esac
          done
      - name: Commit exactly six generated resources to feature branch
        run: |
          set -euo pipefail
          git add app/static/course_v3_data/hsk-common-i18n.js desktop/ui/js/generated/hsk-common-i18n.js app/bot/generated/common_i18n.py android/app/src/main/res/values/hsk_common_i18n.xml android/app/src/main/res/values-ru/hsk_common_i18n.xml android/app/src/main/res/values-tg/hsk_common_i18n.xml
          if git diff --cached --quiet; then echo "Catalogs already current"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "i18n: generate Android-parity PWA login copy from canonical three locales"
          git push origin HEAD:feat/iphone-pwa-browser-auth-p1-20261102
