name: Test bounded analytics section refresh (current code)
on:
  push:
    branches:
      - feat/analytics-section-refresh-20261030
    paths:
      - .github/workflows/test-analytics-section-refresh.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/analytics-section-refresh-20261030
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt aiosqlite
      - name: Syntax and focused server tests
        run: |
          python -m compileall -q app/admin_api/pwa_statistics_cache.py app/admin_api/pwa_manual_aggregate_refresh.py tests/test_admin_pwa_manual_aggregate_refresh.py
          python -m unittest tests.test_admin_pwa_manual_aggregate_refresh tests.test_admin_pwa_analytics tests.test_admin_pwa_daily_r2_cache -v
