name: iOS CI

on:
  push:
    branches:
      - codex/ios-app
    paths:
      - "ios/**"
      - "app/api/ios_auth.py"
      - "app/bot/fsm/ios_auth.py"
      - "app/bot/handlers/desktop_auth.py"
      - "app/db/models/course_miniapp_event.py"
      - "app/services/desktop_auth_service.py"
      - "app/main.py"
      - "tests/test_android_auth_api.py"
      - "tests/test_ios_auth_api.py"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - "app/api/ios_auth.py"
      - "app/bot/fsm/ios_auth.py"
      - "app/bot/handlers/desktop_auth.py"
      - "app/db/models/course_miniapp_event.py"
      - "app/services/desktop_auth_service.py"
      - "app/main.py"
      - "tests/test_android_auth_api.py"
      - "tests/test_ios_auth_api.py"
      - ".github/workflows/ios-ci.yml"

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iPhone simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project HSKAI.xcodeproj \
            -scheme HSKAI \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  native-auth-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile native auth modules
        run: |
          python -m py_compile \
            app/api/ios_auth.py \
            app/services/desktop_auth_service.py \
            app/bot/handlers/desktop_auth.py

      - name: Run Android + iOS auth regressions
        run: PYTHONPATH=. pytest tests/test_android_auth_api.py tests/test_ios_auth_api.py -q
