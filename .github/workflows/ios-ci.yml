name: iOS CI

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - codex/ios-app
    paths:
      - "ios/**"
      - "app/api/ios_auth.py"
      - "app/api/ios_course.py"
      - "app/api/ios_practice.py"
      - "app/bot/fsm/ios_auth.py"
      - "app/bot/handlers/desktop_auth.py"
      - "app/db/models/course_miniapp_event.py"
      - "app/services/desktop_auth_service.py"
      - "app/main.py"
      - "tests/test_android_auth_api.py"
      - "tests/test_ios_auth_api.py"
      - "tests/test_ios_course_api.py"
      - "tests/test_ios_practice_api.py"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - "app/api/ios_auth.py"
      - "app/api/ios_course.py"
      - "app/api/ios_practice.py"
      - "app/bot/fsm/ios_auth.py"
      - "app/bot/handlers/desktop_auth.py"
      - "app/db/models/course_miniapp_event.py"
      - "app/services/desktop_auth_service.py"
      - "app/main.py"
      - "tests/test_android_auth_api.py"
      - "tests/test_ios_auth_api.py"
      - "tests/test_ios_course_api.py"
      - "tests/test_ios_practice_api.py"
      - ".github/workflows/ios-ci.yml"

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iPhone simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project HSKAI.xcodeproj \
            -scheme HSKAI \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check iOS localization key parity
        run: |
          python3 - <<'PY'
          import re, pathlib
          base=pathlib.Path("ios/HSKAI/Resources")
          sets={}
          for lang in ("uz","ru","tg"):
              text=(base/f"{lang}.lproj/Localizable.strings").read_text()
              sets[lang]=set(re.findall(r'^"([^"]+)"\\s*=', text, re.M))
          assert sets["uz"] == sets["ru"] == sets["tg"], {k: len(v) for k,v in sets.items()}
          print("localization keys:", len(sets["uz"]))
          PY

      - name: Run iOS unit tests
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime in data["devices"].values() for d in runtime if d["name"].startswith("iPhone") and d.get("isAvailable", False)))')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcodebuild \
            -project HSKAI.xcodeproj \
            -scheme HSKAI \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test

  native-auth-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile native auth modules
        run: |
          python -m py_compile \
            app/api/ios_auth.py \
            app/api/ios_course.py \
            app/api/ios_practice.py \
          app/api/ios_social.py \
          app/api/ios_subscription.py \
          app/api/ios_challenges.py \
          app/api/ios_assistant.py \
            app/services/desktop_auth_service.py \
            app/bot/handlers/desktop_auth.py

      - name: Run Android + iOS auth regressions
        run: PYTHONPATH=. pytest tests/test_android_auth_api.py tests/test_ios_auth_api.py tests/test_ios_course_api.py tests/test_ios_practice_api.py tests/test_ios_social_api.py tests/test_ios_subscription_api.py tests/test_ios_challenges_api.py -q
