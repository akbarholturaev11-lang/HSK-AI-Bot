name: iPhone learner PWA OpenSpec planning

on:
  push:
    branches:
      - feat/iphone-course-pwa-planning-20261102
    paths:
      - ".github/workflows/iphone-pwa-openspec.yml"
      - "docs/IPHONE_PWA_CONTEXT.md"
      - "openspec/changes/iphone-course-pwa/**"

permissions:
  contents: write

concurrency:
  group: iphone-course-pwa-openspec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit repo and install official OpenSpec CLI
        run: |
          set -euo pipefail
          node --version
          npm install --global @fission-ai/openspec@latest
          openspec --version
          test -f .agents/skills/hsk-ai-openspec-planning/SKILL.md
          test -f AGENTS.md
          test -f AI_RULES.md
          test -f PROJECT_MEMORY.md
          test -f openspec/config.yaml
          test -f docs/IPHONE_PWA_CONTEXT.md
          git rev-parse HEAD
          openspec context --json > /tmp/pwa-openspec-context.json
      - name: CLI-create (or inspect) the isolated iPhone PWA change
        run: |
          set -euo pipefail
          if test ! -f openspec/changes/iphone-course-pwa/.openspec.yaml; then
            openspec new change iphone-course-pwa
          fi
          openspec status --change iphone-course-pwa --json > /tmp/pwa-openspec-status.json
          openspec instructions proposal --change iphone-course-pwa --json > /tmp/pwa-proposal-instructions.json
          if test -f openspec/changes/iphone-course-pwa/proposal.md; then
            openspec instructions specs --change iphone-course-pwa --json > /tmp/pwa-specs-instructions.json
            openspec instructions design --change iphone-course-pwa --json > /tmp/pwa-design-instructions.json
          fi
          if test -f openspec/changes/iphone-course-pwa/design.md; then
            openspec instructions tasks --change iphone-course-pwa --json > /tmp/pwa-tasks-instructions.json
          fi
          if test -f openspec/changes/iphone-course-pwa/tasks.md; then
            openspec validate iphone-course-pwa
          else
            echo "Initial scaffold generated. Full plan validation will run after all plan artifacts exist."
          fi
      - name: Save official CLI scaffold to planning branch
        run: |
          set -euo pipefail
          git add openspec/changes/iphone-course-pwa/.openspec.yaml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: initialize iPhone PWA OpenSpec CLI scaffold"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload CLI evidence and plan for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-pwa-openspec-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/pwa-openspec-context.json
            /tmp/pwa-openspec-status.json
            /tmp/pwa-proposal-instructions.json
            /tmp/pwa-specs-instructions.json
            /tmp/pwa-design-instructions.json
            /tmp/pwa-tasks-instructions.json
            docs/IPHONE_PWA_CONTEXT.md
            openspec/changes/iphone-course-pwa/
