name: Temporary Mistake Replay V2

on:
  push:
    branches:
      - codex/cloud-ai
    paths:
      - scripts/_tmp_mistake_replay_v2_patch.py
      - .github/workflows/tmp-mistake-replay-v2.yml

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cloud branch
        uses: actions/checkout@v4
        with:
          ref: codex/cloud-ai
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply exact replay patch
        run: python scripts/_tmp_mistake_replay_v2_patch.py

      - name: Compile backend
        run: python -m py_compile app/services/course_mistake_service.py

      - name: Run mistake contract tests
        run: python -m pytest tests/test_mistake_review_contract.py tests/test_course_mistake_service.py -q

      - name: Verify frontend contract markers
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app/static/course_v3_mistakes.html').read_text(encoding='utf-8')
          required = [
              'validateQuestionContract',
              'submitBuilder',
              'selected_index:selected',
              '/api/v3/tts?text=',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing frontend replay markers: {missing}')
          PY

      - name: Remove temporary patch machinery
        run: rm scripts/_tmp_mistake_replay_v2_patch.py .github/workflows/tmp-mistake-replay-v2.yml

      - name: Commit tested implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(mistakes): replay builder errors with exact interaction'
          git push origin HEAD:codex/cloud-ai
