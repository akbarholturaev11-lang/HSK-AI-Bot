name: Merge P3 into main-snapshot integration branch

on:
  push:
    branches:
      - codex/p3-main-integration-20261020
    paths:
      - ".github/workflows/p3-integration-merge.yml"

permissions:
  contents: write

concurrency:
  group: one-time-p3-main-merge
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge verified P3 ref, resolve bounded conflicts, and push integration branch only
        shell: bash
        env:
          EXPECTED_P3_SHA: 7d113214c7e9b3260d03fb8de0892e6809deed7e
          ORIGINAL_MAIN_SHA: 055de820db10b32fadffa942938a16e2070f0d52
        run: |
          set -euo pipefail
          git config user.name "HSK AI integration workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ "$(git branch --show-current)" = "codex/p3-main-integration-20261020" ]
          git merge-base --is-ancestor "$ORIGINAL_MAIN_SHA" HEAD
          git fetch --no-tags origin codex/i18n-local-first-foundation-20261017
          actual="$(git rev-parse FETCH_HEAD)"
          if [ "$actual" != "$EXPECTED_P3_SHA" ]; then
            echo "::error::P3 HEAD moved from approved merge snapshot ($EXPECTED_P3_SHA to $actual)"
            exit 1
          fi
          set +e
          git merge --no-commit --no-ff "$EXPECTED_P3_SHA"
          merge_status=$?
          set -e
          if [ "$merge_status" -eq 0 ]; then
            echo "::error::Unexpected clean merge; conflict manifest should be updated"
            exit 1
          fi
          python scripts/p3_merge_resolve.py
          git diff --cached --check
          python -m compileall -q scripts app tests
          node --check app/static/course_v3_data/p3-grammar-reservation.js
          # Exact generated local-first UZ/RU/TJ artifacts remain consistent.
          python scripts/i18n_build_local_catalogs.py --check
          echo "---- INTEGRATION MERGE PRE-COMMIT SUMMARY ----"
          git status --short | tail -n 32
          git diff --cached --stat | tail -n 8
          git commit -m "merge: integrate current main snapshot with P3 local-first branch"
          echo "MERGED_HEAD=$(git rev-parse HEAD)"
          echo "MERGED_PARENTS=$(git rev-list --parents -n 1 HEAD)"
          # Write only the isolated branch; NEVER push main.
          git push origin "HEAD:refs/heads/codex/p3-main-integration-20261020"
          echo "INTEGRATION_PUSH_SUCCESS"
