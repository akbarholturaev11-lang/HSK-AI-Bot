name: Universal Sign-In QA APK

# This is a disposable, isolated debug APK built only for the Universal
# Sign-In draft branch. Never use this to publish Play or Direct releases.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/universal-signin-qa-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-direct-debug-apk:
    name: Build isolated staging Direct QA APK
    if: github.head_ref == 'codex/universal-sign-in' || github.ref == 'refs/heads/codex/universal-sign-in'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      QA_ORIGIN: https://hsk-qa-api-qa.up.railway.app
      EXPECTED_QA_PACKAGE: com.pomp.hskai.qa

    steps:
      - uses: actions/checkout@v4

      - name: Validate isolated branch and committed Gradle wrapper
        run: |
          set -euo pipefail
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -x gradlew || chmod +x gradlew
          test "$QA_ORIGIN" = "https://hsk-qa-api-qa.up.railway.app"
          test "$EXPECTED_QA_PACKAGE" = "com.pomp.hskai.qa"

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build QA APK (Direct Debug only, no release signing)
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDirectDebug "-PPOMP_QA_API_ORIGIN=$QA_ORIGIN"

      - name: Validate APK manifest and staging config
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/direct/debug -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          test -x "$aapt"
          "$aapt" dump badging "$apk" | grep -F "package: name='$EXPECTED_QA_PACKAGE'"
          "$aapt" dump badging "$apk" | grep -F 'HSK AI QA'
          "$aapt" dump xmltree "$apk" AndroidManifest.xml | grep -F 'pomp-hsk-ai-qa'
          # Ensure actual compiled BuildConfig is pointing only at staging.
          grep -R -F "https://hsk-qa-api-qa.up.railway.app" app/build/generated/source/buildConfig/
          grep -R -F 'pomp-hsk-ai-qa' app/build/generated/source/buildConfig/
          if grep -R -F 'QA_BUILD = false' app/build/generated/source/buildConfig/direct/debug/; then
            echo "ERROR: QA_BUILD is false in generated DirectDebug config"
            exit 1
          fi
          printf '%s\n' "APK_SHA256:"
          sha256sum "$apk"

      - name: Upload installable QA APK
        uses: actions/upload-artifact@v4
        with:
          name: hsk-ai-universal-standalone-qa-direct-debug
          path: android/app/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
