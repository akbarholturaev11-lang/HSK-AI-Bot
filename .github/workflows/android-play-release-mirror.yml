name: Mirror published Google Play Android releases

# The Play Console remains the publisher; this job only reads its live
# production track and mirrors confirmed version codes to the existing R2 CDN.
# It never changes Google Play releases or the direct/latest.json manifest.
on:
  workflow_dispatch:
  schedule:
    - cron: "19,49 * * * *"

concurrency:
  group: android-play-release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ vars.ANDROID_PLAY_RELEASE_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        id: play_auth
        with:
          credentials_json: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Read live Google Play production track
        env:
          PLAY_TOKEN: ${{ steps.play_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          root="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.pomp.hskai/edits"
          edit_json="$(curl --fail --silent --show-error --retry 2 --request POST \
            --header "Authorization: Bearer $PLAY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' "$root")"
          edit_id="$(jq -er '.id | select(type == "string" and length > 0)' <<<"$edit_json")"
          trap 'curl --silent --show-error --request DELETE --header "Authorization: Bearer $PLAY_TOKEN" "$root/$edit_id" >/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 2 \
            --header "Authorization: Bearer $PLAY_TOKEN" \
            "$root/$edit_id/tracks/production" > "$RUNNER_TEMP/play-production-track.json"

      - name: Append verified Play releases to R2 ledger
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          for k in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            test -n "${!k}" || { echo "::error::$k missing"; exit 1; }
          done
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          previous="$RUNNER_TEMP/play-previous.json"
          printf '{}\n' > "$previous"
          err="$(mktemp)"
          if aws s3api head-object --bucket "$R2_BUCKET" --key "android/play-releases.json" \
             --endpoint-url "$endpoint" >/dev/null 2>"$err"; then
            aws s3 cp "s3://$R2_BUCKET/android/play-releases.json" "$previous" \
              --endpoint-url "$endpoint" --only-show-errors
          elif ! grep -Eq '404|Not Found|NoSuchKey' "$err"; then
            echo "::error::Cannot verify prior Play release ledger"; exit 1
          fi
          python3 scripts/android_sync_play_releases.py \
            --track "$RUNNER_TEMP/play-production-track.json" \
            --existing "$previous" \
            --output "$RUNNER_TEMP/play-releases.json"
          # Only this service-account-verified workflow writes the Play ledger.
          aws s3 cp "$RUNNER_TEMP/play-releases.json" "s3://$R2_BUCKET/android/play-releases.json" \
            --endpoint-url "$endpoint" --only-show-errors \
            --content-type "application/json" --cache-control "no-store"
          echo "Google Play production release history synchronized (without modifying Play or Direct)."
