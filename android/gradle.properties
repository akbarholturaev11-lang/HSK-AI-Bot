org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Compile-time API origin, matching the shipping desktop client
# (desktop/src-tauri/src/lib.rs: API_ORIGIN). Requests to any other host are
# rejected at runtime. This is a public origin, never a secret.
# A debug build may override it in a private, uncommitted gradle.properties.
POMP_API_ORIGIN=https://telegram-chinese-bot-production.up.railway.app

# The Telegram bot username is NOT configured here on purpose: the link screen
# always uses the `bot_deep_link` returned by /api/v3/android-auth/link/start,
# so the client can never drift away from the deployed bot.

# Google Sign-In. This is the OAuth **Web** client id, which is what Credential
# Manager needs and what the server verifies as the token audience. It is a
# public value, not a secret, and there is no google-services.json.
# Leave it blank to ship without the Google button: nothing else changes.
POMP_GOOGLE_WEB_CLIENT_ID=371559064762-s0gl7c5ikoqq4t83qs678l8sci2o1d2t.apps.googleusercontent.com

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
