[build]
builder = "DOCKERFILE"
dockerfilePath = "ops/smart-reminder-qa.Dockerfile"

[deploy]
startCommand = "uvicorn app.smart_reminder_qa:create_app --factory --host 0.0.0.0 --port $PORT --no-access-log"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
